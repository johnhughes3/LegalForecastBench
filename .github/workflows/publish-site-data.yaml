name: Publish selected site data

on:
  workflow_dispatch:
    inputs:
      refreshed_data_run_id:
        description: 'Optional run containing a complete refreshed public data artifact'
        required: false
        type: string
      refreshed_data_artifact:
        description: 'Artifact name (required with refreshed_data_run_id)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-site-data-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: legalforecastbench-official-eval-fan-in
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
    steps:
      - name: Check out selected main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate optional refreshed input selection
        env:
          REFRESH_RUN: ${{ inputs.refreshed_data_run_id }}
          REFRESH_ARTIFACT: ${{ inputs.refreshed_data_artifact }}
        run: |
          if [[ -n "$REFRESH_RUN" || -n "$REFRESH_ARTIFACT" ]]; then
            [[ "$REFRESH_RUN" =~ ^[0-9]+$ && -n "$REFRESH_ARTIFACT" ]] || {
              echo 'Select both a numeric run ID and a refreshed artifact name' >&2
              exit 1
            }
          fi

      - name: Download selected refreshed public data
        if: inputs.refreshed_data_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.refreshed_data_artifact }}
          run-id: ${{ inputs.refreshed_data_run_id }}
          github-token: ${{ github.token }}
          path: refreshed-site-data

      - name: Validate and build selected public data
        env:
          REFRESH_RUN: ${{ inputs.refreshed_data_run_id }}
        run: |
          corepack enable
          corepack prepare pnpm@11.27.0 --activate
          pnpm install --frozen-lockfile
          pnpm site:check
          if [[ -n "$REFRESH_RUN" ]]; then
            LFB_SITE_DATA_DIR="$GITHUB_WORKSPACE/refreshed-site-data" pnpm site:build
          else
            pnpm site:build
          fi

      - name: Assume protected publication role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.LFB_GITHUB_FAN_IN_ROLE_ARN }}
          role-duration-seconds: 3600
          role-session-name: lfb-site-data-${{ github.run_id }}

      - name: Publish and read back every displayed dataset
        shell: bash
        run: |
          set -euo pipefail
          prefix="reports/site-data/multi-ablation/${GITHUB_SHA}"
          mapfile -d '' files < <(find site/dist/data -type f \( -name '*.json' -o -name '*.jsonl' \) -print0 | sort -z)
          (( ${#files[@]} > 0 )) || { echo 'No built site datasets' >&2; exit 1; }
          readback="$(mktemp -d)"
          trap 'rm -rf "$readback"' EXIT
          for source in "${files[@]}"; do
            relative="${source#site/dist/}"
            key="${prefix}/${relative}"
            bash .github/scripts/reconcile-s3-object.sh "$LFB_RESULTS_BUCKET" "$source" "$key"
            aws s3api get-object --bucket "$LFB_RESULTS_BUCKET" --key "$key" "$readback/object" > /dev/null
            cmp "$source" "$readback/object"
            printf '%s\n' "$relative" >> /tmp/published-site-data.txt
          done
          {
            printf 'Published and read back **%s** datasets.\n\n' "${#files[@]}"
            printf 'Source revision: `%s`\n\n' "$GITHUB_SHA"
            printf 'Destination: `s3://%s/%s/`\n\n' "$LFB_RESULTS_BUCKET" "$prefix"
            cat /tmp/published-site-data.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the published datasets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: published-site-data-${{ github.sha }}
          path: |
            site/dist/data/**/*.json
            site/dist/data/**/*.jsonl
          if-no-files-found: error
          retention-days: 90
