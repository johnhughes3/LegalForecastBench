name: Publish Python Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Release check
    # Unset CI_RUNNER (Dependabot and public johnhughes3 repos cannot see the
    # private org variable) must fall back to ubicloud-standard-2, not ubuntu-latest.
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Run release checks
        run: uv run scripts/release_check.py --output-dir tmp/release-check

      - name: Upload release-check artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-check
          path: tmp/release-check
          if-no-files-found: error

  publish:
    name: Publish package
    needs: release-check
    # Defense in depth behind the tag-only trigger: if a future trigger reaches
    # this job from a branch, it declines rather than publishing. See
    # docs/security/pypi-trusted-publishing.md.
    if: startsWith(github.ref, 'refs/tags/v')
    # Protected pypi environment: stay on GitHub-hosted ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Download release-check artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-check
          path: tmp/release-check

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: tmp/release-check/dist
          skip-existing: true

      - name: Publish GitHub release metadata
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'alpha') }}
          files: |
            tmp/release-check/dist/*.whl
            tmp/release-check/dist/*.tar.gz
            tmp/release-check/package-artifact-hashes.json
