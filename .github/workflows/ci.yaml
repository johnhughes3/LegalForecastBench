name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality gates
    # Unset CI_RUNNER (Dependabot and public johnhughes3 repos cannot see the
    # private org variable) must fall back to ubicloud-standard-2, not ubuntu-latest.
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history/refs (including origin/main) so the acquisition-config
          # fence step below can `git show origin/main:...` without a separate
          # authenticated fetch. A bare `git fetch` after this step has no
          # credentials to use, since persist-credentials is false on purpose
          # (it stops later steps from reusing the checkout token) — see
          # legalforecastbench-58v3 for the same failure mode elsewhere.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v7.1.6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Contract ratchet
        run: uv run python -m legalforecast.contracts.ratchet

      - name: Acquisition config fence
        run: uv run python -m legalforecast.config.fence

      - name: Type-check
        run: uv run pyright

      - name: Check public API docstring coverage
        run: >-
          uv run interrogate
          legalforecast/publication
          legalforecast/labeling
          scripts

      - name: Test
        # Supported parallel full-suite command (see AGENTS.md “Testing”).
        # pytest-cov combines the per-worker xdist coverage data automatically.
        run: >-
          uv run pytest -q -n 4 --dist=loadscope
          --cov=legalforecast
          --cov-report=xml:coverage.xml
          --junitxml=test-report.junit.xml

      - name: Upload coverage reports to Codecov
        # Coverage is most useful when the suite failed, so upload unless the
        # run was cancelled rather than only on success.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: johnhughes3/LegalForecastBench
          files: coverage.xml

      # Same action as the coverage upload above, run a second time with
      # report_type: test_results.  codecov/test-results-action is deprecated in
      # favour of this, and it was the last thing pulling in a Node 20 runtime.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: johnhughes3/LegalForecastBench
          files: test-report.junit.xml
          report_type: test_results

      - name: Rebuild and verify packet renders
        run: >-
          uv run pytest -q
          tests/test_packet_render_ci_workflow.py::test_production_packet_builder_matches_reviewed_golden

      - name: Build package
        run: uv build --out-dir tmp/ci-dist
