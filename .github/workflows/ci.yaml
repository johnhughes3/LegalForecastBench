name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run pyright

      - name: Check public API docstring coverage
        run: >-
          uv run interrogate
          legalforecast/publication
          legalforecast/labeling
          scripts

      - name: Test
        # Supported parallel full-suite command (see AGENTS.md “Testing”);
        # public ubuntu-latest runners expose 4 vCPUs, matching -n 4.
        run: uv run pytest -q -n 4 --dist=loadscope

      - name: Rebuild and verify packet renders
        run: >-
          uv run pytest -q
          tests/test_packet_render_ci_workflow.py::test_production_packet_builder_matches_reviewed_golden

      - name: Build package
        run: uv build --out-dir tmp/ci-dist
