name: Protected Labels Fan In

# Forecast execution and label acquisition are deliberately separate workflow
# invocations. This workflow is the only public-repository job that accepts a
# labels-release locator or assumes a role able to read it.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact trusted public commit; it must be the dispatched main commit and remain main-reachable.
        required: true
        type: string
      cycle_id:
        description: Public cycle identifier used for the immutable report prefix.
        required: true
        type: string
      forecast_run_id:
        description: Completed Run Benchmark workflow run ID that produced the forecast receipts.
        required: true
        type: number
      forecast_run_attempt:
        description: Exact attempt of forecast_run_id whose durable artifact is being scored.
        required: true
        type: number
      manifest_uri:
        description: Locked public run-manifest URI under the configured results bucket.
        required: true
        type: string
      forecast_release_uri:
        description: Outcome-blinded forecast-release.json URI under the configured results bucket.
        required: true
        type: string
      artifact_root_uri:
        description: Immutable forecast artifact prefix under the configured results bucket.
        required: true
        type: string
      model_registry_uri:
        description: Frozen public model registry URI under the configured results bucket.
        required: true
        type: string
      labels_release_uri:
        description: Labels-release.json URI; this input is accepted only by this protected fan-in.
        required: true
        type: string
      model_key:
        description: Exact provider:model_id key executed by the forecast run.
        required: true
        type: string
      publish:
        description: Write the verified score/report to the immutable public report prefix.
        required: true
        default: false
        type: boolean
      hugging_face_release_version:
        description: Optional immutable Hugging Face dataset release version; publishes only with publish=true.
        required: false
        default: ""
        type: string
      artifact_retention_days:
        description: Retention for sanitized score/report workflow artifacts.
        required: true
        default: "14"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: protected-labels-fan-in-${{ inputs.cycle_id }}-${{ inputs.forecast_run_id }}-${{ inputs.forecast_run_attempt }}
  cancel-in-progress: false

jobs:
  fan-in-results:
    name: Verify forecast and fan in labels
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: legalforecastbench-official-eval-fan-in
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_GITHUB_FAN_IN_ROLE_ARN: ${{ vars.LFB_GITHUB_FAN_IN_ROLE_ARN }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
    steps:
      - name: Checkout exact main release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Validate protected request and release identity
        shell: bash
        env:
          ARTIFACT_ROOT_URI: ${{ inputs.artifact_root_uri }}
          CYCLE_ID: ${{ inputs.cycle_id }}
          FORECAST_RELEASE_URI: ${{ inputs.forecast_release_uri }}
          FORECAST_RUN_ATTEMPT: ${{ inputs.forecast_run_attempt }}
          FORECAST_RUN_ID: ${{ inputs.forecast_run_id }}
          LABELS_RELEASE_URI: ${{ inputs.labels_release_uri }}
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          MODEL_KEY: ${{ inputs.model_key }}
          MODEL_REGISTRY_URI: ${{ inputs.model_registry_uri }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "protected labels fan-in is allowed only from refs/heads/main" >&2
            exit 1
          }
          [[ "${GITHUB_SHA}" == "${RELEASE_SHA}" ]] || {
            echo "release_sha must equal the exact main commit that triggered this workflow" >&2
            exit 1
          }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be a full lowercase commit SHA" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]] || {
            echo "checked-out HEAD does not equal release_sha" >&2
            exit 1
          }
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main || {
            echo "release_sha must remain reachable from origin/main" >&2
            exit 1
          }
          [[ "${CYCLE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "cycle_id contains unsafe characters" >&2
            exit 1
          }
          [[ "${FORECAST_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || {
            echo "forecast_run_id must be a positive integer" >&2
            exit 1
          }
          [[ "${FORECAST_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]] || {
            echo "forecast_run_attempt must be a positive integer" >&2
            exit 1
          }
          [[ "${MODEL_KEY}" =~ ^(openai|anthropic|gemini|google):[^:[:space:]]+$ ]] || {
            echo "model_key must be provider:model_id" >&2
            exit 1
          }
          [[ "${RETENTION_DAYS}" =~ ^[1-9][0-9]*$ && "${RETENTION_DAYS}" -le 90 ]] || {
            echo "artifact_retention_days must be between 1 and 90" >&2
            exit 1
          }
          for locator in "${MANIFEST_URI}" "${FORECAST_RELEASE_URI}" \
            "${ARTIFACT_ROOT_URI}" "${MODEL_REGISTRY_URI}" "${LABELS_RELEASE_URI}"; do
            [[ "${locator}" =~ ^(s3://[^/]+/[A-Za-z0-9._/-]+|manifests/[A-Za-z0-9._/-]+)$ ]] || {
              echo "official input locators must be s3:// URIs or manifests/ keys" >&2
              exit 1
            }
            # The doubled-slash check applies to the key, not the whole
            # locator: `s3://` carries one itself, so testing the locator
            # rejected every well-formed s3 URI and left `manifests/` keys as
            # the only dispatchable form. Stripping the scheme first keeps the
            # real defence -- an empty path segment in the key -- and leaves
            # `manifests/` locators, which have no scheme to strip, unchanged.
            key_only="${locator#s3://}"
            [[ "${locator}" != *..* && "${key_only}" != *"//"* ]] || {
              echo "official input locator contains an unsafe path" >&2
              exit 1
            }
          done
          [[ "${ARTIFACT_ROOT_URI}" == */ ]] || {
            echo "artifact_root_uri must be a prefix ending in /" >&2
            exit 1
          }
          [[ -n "${LFB_RESULTS_BUCKET:-}" ]] || {
            echo "LFB_RESULTS_BUCKET must be configured on the protected environment" >&2
            exit 1
          }
          for locator in "${MANIFEST_URI}" "${FORECAST_RELEASE_URI}" \
            "${ARTIFACT_ROOT_URI}" "${MODEL_REGISTRY_URI}" "${LABELS_RELEASE_URI}"; do
            case "${locator}" in
              manifests/*) ;;
              s3://*)
                bucket_and_key="${locator#s3://}"
                [[ "${bucket_and_key}" == "${LFB_RESULTS_BUCKET}/"* ]] || {
                  echo "s3 locator must use the configured LFB_RESULTS_BUCKET" >&2
                  exit 1
                }
                ;;
              *)
                echo "official input locator has an unsupported form" >&2
                exit 1
                ;;
            esac
          done

      - name: Validate exact forecast workflow attempt
        shell: bash
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          FORECAST_RUN_ATTEMPT: ${{ inputs.forecast_run_attempt }}
          FORECAST_RUN_ID: ${{ inputs.forecast_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY_NAME"]
          run_id = int(os.environ["FORECAST_RUN_ID"])
          attempt = int(os.environ["FORECAST_RUN_ATTEMPT"])
          expected_sha = os.environ["RELEASE_SHA"]
          path = f"/repos/{repository}/actions/runs/{run_id}/attempts/{attempt}"
          request = urllib.request.Request(
              api_url + path,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "legalforecastbench-protected-labels-fan-in",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
          except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
              raise SystemExit("could not validate the forecast workflow attempt") from exc
          if not isinstance(run, dict):
              raise SystemExit("forecast workflow attempt response is invalid")
          checks = {
              "run identity": run.get("id") == run_id and run.get("run_attempt") == attempt,
              "release": run.get("head_sha") == expected_sha,
              "branch": run.get("head_branch") == "main",
              "event": run.get("event") == "workflow_dispatch",
              "workflow path": run.get("path") == ".github/workflows/run-benchmark.yaml",
              "success": run.get("status") == "completed" and run.get("conclusion") == "success",
          }
          for label, valid in checks.items():
              if not valid:
                  raise SystemExit(f"forecast workflow {label} check failed")
          print(json.dumps({"run_id": run_id, "run_attempt": attempt, "head_sha": expected_sha}, sort_keys=True))
          PY

      - name: Download exact durable forecast result artifact
        shell: bash
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          FORECAST_RUN_ATTEMPT: ${{ inputs.forecast_run_attempt }}
          FORECAST_RUN_ID: ${{ inputs.forecast_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import json
          import os
          import stat
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path

          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY_NAME"]
          token = os.environ["GITHUB_TOKEN"]
          run_id = os.environ["FORECAST_RUN_ID"]
          attempt = os.environ["FORECAST_RUN_ATTEMPT"]
          expected_name = f"official-forecast-results-{run_id}-{attempt}"

          def request_json(url: str, description: str) -> object:
              request = urllib.request.Request(
                  url if url.startswith("http") else api_url + url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "legalforecastbench-protected-labels-fan-in",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"could not read {description}") from exc

          listing = request_json(
              f"/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100",
              "forecast run artifacts",
          )
          if not isinstance(listing, dict) or not isinstance(listing.get("artifacts"), list):
              raise SystemExit("forecast artifact listing is invalid")
          matches = [
              item for item in listing["artifacts"]
              if isinstance(item, dict) and item.get("name") == expected_name
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one durable forecast artifact: {expected_name}")
          artifact = matches[0]
          if artifact.get("expired") is True:
              raise SystemExit("durable forecast artifact has expired")
          archive_url = artifact.get("archive_download_url")
          if not isinstance(archive_url, str) or not archive_url.startswith("http"):
              raise SystemExit("durable forecast artifact URL is invalid")
          request = urllib.request.Request(
              archive_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "legalforecastbench-protected-labels-fan-in",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  archive_bytes = response.read()
          except (OSError, urllib.error.URLError) as exc:
              raise SystemExit("could not download durable forecast artifact") from exc
          root = Path("/tmp/lfb-forecast")
          root.mkdir(parents=True, exist_ok=False)
          seen: set[str] = set()
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              for member in archive.infolist():
                  relative = Path(member.filename)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit("durable forecast artifact contains an unsafe path")
                  normalized = relative.as_posix()
                  if normalized in seen:
                      raise SystemExit("durable forecast artifact contains a duplicate path")
                  seen.add(normalized)
                  if member.is_dir():
                      continue
                  if stat.S_ISLNK(member.external_attr >> 16):
                      raise SystemExit("durable forecast artifact contains a symlink")
                  destination = root / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(member))
          required = (
              "forecast-run.json",
              "run-manifest.json",
              "forecast-release.json",
              "model-registry.json",
              "run-summary.json",
              "ledger/ledger.sqlite3",
          )
          for name in required:
              path = root / name
              if not path.is_file() or path.is_symlink() or path.stat().st_size == 0:
                  raise SystemExit(f"durable forecast artifact is missing {name}")
          artifacts_root = root / "artifacts"
          if not artifacts_root.is_dir() or artifacts_root.is_symlink():
              raise SystemExit("durable forecast artifact is missing artifacts/")
          artifact_files = [path for path in artifacts_root.rglob("*") if path.is_file()]
          if not artifact_files or any(path.is_symlink() for path in artifacts_root.rglob("*")):
              raise SystemExit("durable forecast artifact has no safe artifacts/")
          receipts = sorted((root / "receipts").glob("*.json"))
          if not receipts or any(path.is_symlink() for path in receipts):
              raise SystemExit("durable forecast artifact has no receipt files")
          if any(path.name == "labels-release.json" or "labels" in path.parts for path in root.rglob("*")):
              raise SystemExit("forecast artifact must not contain labels or label locators")
          PY

      - name: Configure protected fan-in storage access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lfb-labels-fan-in-${{ inputs.forecast_run_id }}-${{ inputs.forecast_run_attempt }}
          role-to-assume: ${{ env.LFB_GITHUB_FAN_IN_ROLE_ARN }}

      - name: Fetch and bind locked releases, including labels only here
        shell: bash
        env:
          FORECAST_RELEASE_URI: ${{ inputs.forecast_release_uri }}
          LABELS_RELEASE_URI: ${{ inputs.labels_release_uri }}
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          MODEL_REGISTRY_URI: ${{ inputs.model_registry_uri }}
        run: |
          set -euo pipefail
          reference=/tmp/lfb-fan-in-reference
          mkdir -p "${reference}"
          fetch_locked() {
            local locator="$1" destination="$2"
            case "${locator}" in
              s3://*) aws s3 cp "${locator}" "${destination}" --only-show-errors ;;
              manifests/*) aws s3 cp "s3://${LFB_RESULTS_BUCKET}/${locator}" "${destination}" --only-show-errors ;;
              *) echo "unsupported official locator: ${locator}" >&2; return 1 ;;
            esac
          }
          fetch_locked "${MANIFEST_URI}" "${reference}/run-manifest.json"
          fetch_locked "${FORECAST_RELEASE_URI}" "${reference}/forecast-release.json"
          fetch_locked "${MODEL_REGISTRY_URI}" "${reference}/model-registry.json"
          # This is the only step in the repository that reads the label locator.
          fetch_locked "${LABELS_RELEASE_URI}" "${reference}/labels-release.json"
          cmp -- "${reference}/run-manifest.json" /tmp/lfb-forecast/run-manifest.json
          cmp -- "${reference}/forecast-release.json" /tmp/lfb-forecast/forecast-release.json
          cmp -- "${reference}/model-registry.json" /tmp/lfb-forecast/model-registry.json

      - name: Validate run identity, model registry, and complete durable state
        shell: bash
        env:
          ARTIFACT_ROOT_URI: ${{ inputs.artifact_root_uri }}
          FORECAST_RELEASE_URI: ${{ inputs.forecast_release_uri }}
          FORECAST_RUN_ATTEMPT: ${{ inputs.forecast_run_attempt }}
          FORECAST_RUN_ID: ${{ inputs.forecast_run_id }}
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          MODEL_KEY: ${{ inputs.model_key }}
          MODEL_REGISTRY_URI: ${{ inputs.model_registry_uri }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          root = Path("/tmp/lfb-forecast")
          metadata = json.loads((root / "forecast-run.json").read_text(encoding="utf-8"))
          if not isinstance(metadata, dict):
              raise SystemExit("forecast-run.json must be an object")
          expected_fields = {
              "schema_version", "workflow_run_id", "workflow_run_attempt", "release_sha",
              "manifest_uri", "forecast_release_uri", "artifact_root_uri", "model_registry_uri",
              "model_key", "run_identity_sha256", "forecast_release_digest", "model_registry_sha256",
              "repeat_count",
          }
          if set(metadata) != expected_fields or metadata["schema_version"] != "legalforecast.forecast-run.v1":
              raise SystemExit("forecast-run.json fields or schema are invalid")
          expected = {
              "workflow_run_id": int(os.environ["FORECAST_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["FORECAST_RUN_ATTEMPT"]),
              "release_sha": os.environ["RELEASE_SHA"],
              "manifest_uri": os.environ["MANIFEST_URI"],
              "forecast_release_uri": os.environ["FORECAST_RELEASE_URI"],
              "artifact_root_uri": os.environ["ARTIFACT_ROOT_URI"],
              "model_registry_uri": os.environ["MODEL_REGISTRY_URI"],
              "model_key": os.environ["MODEL_KEY"],
          }
          for field, value in expected.items():
              if metadata[field] != value:
                  raise SystemExit(f"forecast-run.json {field} does not match dispatch")
          for field in (
              "run_identity_sha256",
              "forecast_release_digest",
              "model_registry_sha256",
          ):
              value = metadata[field]
              if not isinstance(value, str) or len(value) != 64 or any(char not in "0123456789abcdef" for char in value):
                  raise SystemExit(f"forecast-run.json {field} is not a lowercase SHA-256")
          if type(metadata["repeat_count"]) is not int or metadata["repeat_count"] != 1:
              raise SystemExit("official fan-in accepts exactly one forecast repeat")
          summary = json.loads((root / "run-summary.json").read_text(encoding="utf-8"))
          if not isinstance(summary, dict) or summary.get("run_identity_sha256") != metadata["run_identity_sha256"]:
              raise SystemExit("run summary is not bound to forecast-run identity")
          if summary.get("status") != "completed":
              raise SystemExit("run summary is not completed")
          ledger_path = root / "ledger/ledger.sqlite3"
          with sqlite3.connect(ledger_path) as connection:
              integrity = connection.execute("PRAGMA integrity_check").fetchone()
              if integrity != ("ok",):
                  raise SystemExit("durable forecast ledger failed integrity_check")
              try:
                  status = connection.execute("SELECT status FROM runs").fetchall()
              except sqlite3.DatabaseError as exc:
                  raise SystemExit("durable forecast ledger has no runs table") from exc
              if not status or any(row != ("completed",) for row in status):
                  raise SystemExit("durable forecast ledger does not show a completed run")

          receipts = sorted((root / "receipts").glob("*.json"))
          records = []
          seen_units: set[tuple[str, int]] = set()
          for path in receipts:
              record = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(record, dict):
                  raise SystemExit(f"receipt is not an object: {path.name}")
              required = ("schema_version", "run_identity_sha256", "forecast_release_digest", "model_key", "model_registry_sha256", "case_id", "unit_id", "repeat_index", "parser_output")
              if any(field not in record for field in required):
                  raise SystemExit(f"receipt lacks required identity: {path.name}")
              if (
                  record["run_identity_sha256"] != metadata["run_identity_sha256"]
                  or record["forecast_release_digest"]
                  != metadata["forecast_release_digest"]
                  or record["model_key"] != metadata["model_key"]
                  or record["model_registry_sha256"]
                  != metadata["model_registry_sha256"]
                  or record["repeat_index"] != 1
              ):
                  raise SystemExit(f"receipt identity differs from forecast-run.json: {path.name}")
              if (
                  not isinstance(record["case_id"], str)
                  or not isinstance(record["unit_id"], str)
                  or not isinstance(record["parser_output"], dict)
                  or type(record["repeat_index"]) is not int
              ):
                  raise SystemExit(f"receipt identity fields are malformed: {path.name}")
              key = (record["unit_id"], record["repeat_index"])
              if not record["unit_id"] or key in seen_units:
                  raise SystemExit(f"receipt unit coverage is duplicate or malformed: {path.name}")
              seen_units.add(key)
              record["required_unit_ids"] = [record["unit_id"]]
              record["model_id"] = record["model_key"]
              records.append(record)
          if not records:
              raise SystemExit("no durable forecast receipts were supplied")
          Path("/tmp/lfb-run-records.jsonl").write_text(
              "".join(json.dumps(record, sort_keys=True) + "\n" for record in records),
              encoding="utf-8",
          )
          PY

      - name: Validate releases and score complete forecast receipts
        shell: bash
        run: |
          set -euo pipefail
          uv run legalforecast manifest validate \
            --manifest /tmp/lfb-fan-in-reference/run-manifest.json \
            --forecast /tmp/lfb-fan-in-reference/forecast-release.json \
            --labels /tmp/lfb-fan-in-reference/labels-release.json \
            --artifact-root /tmp/lfb-forecast/artifacts
          # CORE-LANE INTERFACE: the identity-aware scorer accepts the expected
          # run identity and frozen model registry supplied by this workflow.
          uv run legalforecast score \
            --runs /tmp/lfb-run-records.jsonl \
            --labels-release /tmp/lfb-fan-in-reference/labels-release.json \
            --forecast-release /tmp/lfb-fan-in-reference/forecast-release.json \
            --artifact-root /tmp/lfb-forecast/artifacts \
            --manifest /tmp/lfb-fan-in-reference/run-manifest.json \
            --model-registry /tmp/lfb-fan-in-reference/model-registry.json \
            --expected-run-identity "$(python -c 'import json; print(json.load(open("/tmp/lfb-forecast/forecast-run.json"))["run_identity_sha256"])')" \
            --expected-model-registry-sha256 "$(python -c 'import json; print(json.load(open("/tmp/lfb-forecast/forecast-run.json"))["model_registry_sha256"])')" \
            --output /tmp/lfb-score.json \
            --unit-scores-output /tmp/lfb-unit-scores.jsonl

      - name: Render report from the verified score artifact
        shell: bash
        run: |
          set -euo pipefail
          uv run legalforecast report \
            --scores /tmp/lfb-score.json \
            --output-dir /tmp/lfb-report \
            --labels-release /tmp/lfb-fan-in-reference/labels-release.json \
            --forecast-release /tmp/lfb-fan-in-reference/forecast-release.json \
            --artifact-root /tmp/lfb-forecast/artifacts \
            --manifest /tmp/lfb-fan-in-reference/run-manifest.json \
            --frozen-model-registry /tmp/lfb-fan-in-reference/model-registry.json \
            --expected-run-identity "$(python -c 'import json; print(json.load(open("/tmp/lfb-forecast/forecast-run.json"))["run_identity_sha256"])')" \
            --expected-model-registry-sha256 "$(python -c 'import json; print(json.load(open("/tmp/lfb-forecast/forecast-run.json"))["model_registry_sha256"])')" \
            --title "LegalForecast official benchmark"

      - name: Publish verified report once
        if: ${{ inputs.publish }}
        shell: bash
        env:
          CYCLE_ID: ${{ inputs.cycle_id }}
        run: |
          set -euo pipefail
          destination="reports/${CYCLE_ID}/multi-ablation"
          existing="$(aws s3api list-objects-v2 --bucket "${LFB_RESULTS_BUCKET}" --prefix "${destination}/" --max-keys 1 --query 'Key' --output text)"
          [[ "${existing}" == "None" ]] || {
            echo "refusing to overwrite existing immutable report prefix: ${destination}" >&2
            exit 1
          }
          put_once() {
            local source="$1" key="$2"
            aws s3api put-object \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --key "${key}" \
              --body "${source}" \
              --if-none-match '*'
          }
          put_once /tmp/lfb-score.json "${destination}/scores.json"
          put_once /tmp/lfb-unit-scores.jsonl "${destination}/unit-scores.jsonl"
          while IFS= read -r -d '' report_file; do
            relative="${report_file#/tmp/lfb-report/}"
            put_once "${report_file}" "${destination}/report/${relative}"
          done < <(find /tmp/lfb-report -type f -print0)

      - name: Build retained Hugging Face benchmark package
        if: ${{ inputs.publish && inputs.hugging_face_release_version != '' }}
        shell: bash
        env:
          HF_RELEASE_VERSION: ${{ inputs.hugging_face_release_version }}
          HF_REPOSITORY: ${{ vars.LFB_HF_OFFICIAL_DATASET_REPO }}
          CYCLE_ID: ${{ inputs.cycle_id }}
        run: |
          set -euo pipefail
          [[ -n "${HF_REPOSITORY:-}" ]] || {
            echo "LFB_HF_OFFICIAL_DATASET_REPO must be configured on the protected environment" >&2
            exit 1
          }
          uv run python -m legalforecast.hugging_face_publication \
            --score /tmp/lfb-score.json \
            --unit-scores /tmp/lfb-unit-scores.jsonl \
            --report-dir /tmp/lfb-report \
            --cycle-id "${CYCLE_ID}" \
            --output-dir /tmp/hugging-face-benchmark \
            --release-version "${HF_RELEASE_VERSION}" \
            --dataset-repository "${HF_REPOSITORY}"

      - name: Publish immutable benchmark to manually gated Hugging Face Dataset
        if: ${{ inputs.publish && inputs.hugging_face_release_version != '' }}
        shell: bash
        env:
          HF_OIDC_RESOURCE: datasets/${{ vars.LFB_HF_OFFICIAL_DATASET_REPO }}
          HF_RELEASE_VERSION: ${{ inputs.hugging_face_release_version }}
          HF_REPOSITORY: ${{ vars.LFB_HF_OFFICIAL_DATASET_REPO }}
        run: |
          set -euo pipefail
          uv run --no-project --with huggingface_hub==1.28.0 python - <<'PY'
          import json
          import os
          from pathlib import Path

          from huggingface_hub import HfApi

          repository = os.environ["HF_REPOSITORY"]
          release_version = os.environ["HF_RELEASE_VERSION"]
          upload_plan = json.loads(
              Path("/tmp/hugging-face-benchmark/hf-upload-plan.json").read_text(
                  encoding="utf-8"
              )
          )
          if upload_plan.get("repository") != repository:
              raise SystemExit("refusing publication: upload plan repository mismatch")
          release_path = upload_plan.get("release_path")
          if not isinstance(release_path, str) or not release_path:
              raise SystemExit("refusing publication: upload plan has no release path")
          if upload_plan.get("revision_policy") != "immutable-commit":
              raise SystemExit("refusing publication: upload plan is not immutable")
          api = HfApi()
          info = api.dataset_info(repository)
          if info.gated != "manual":
              raise SystemExit(
                  "refusing publication: Hugging Face Dataset must use manual gating"
              )
          remote_files = api.list_repo_files(repo_id=repository, repo_type="dataset")
          release_prefix = f"{release_path}/"
          if any(
              path == release_path or path.startswith(release_prefix)
              for path in remote_files
          ):
              raise SystemExit(
                  f"refusing publication: immutable release already exists: {release_path}"
              )
          commit = api.upload_folder(
              repo_id=repository,
              repo_type="dataset",
              folder_path="/tmp/hugging-face-benchmark",
              commit_message=f"Publish LegalForecastBench {release_version}",
              parent_commit=info.sha,
          )
          print(f"Published immutable Hugging Face revision: {commit.oid}")
          PY

      - name: Upload sanitized score and report artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: protected-labels-fan-in-${{ inputs.cycle_id }}-${{ github.run_id }}
          path: |
            /tmp/lfb-score.json
            /tmp/lfb-unit-scores.jsonl
            /tmp/lfb-report
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}
