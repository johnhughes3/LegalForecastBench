name: Official provider-free paid-labeling baton

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact trusted commit SHA on main
        required: true
        type: string
      stage:
        description: Exact paid-labeling stage
        required: true
        type: choice
        options:
          - llm-unitize
          - llm-review-stage-a
          - llm-label-provider-shard
      provider:
        description: Provider isolated in the next paid job
        required: true
        type: choice
        options:
          - anthropic
          - google
          - openai
      sequence_ordinal:
        description: Positive sequential baton ordinal
        required: true
        type: number
      source_descriptor_json:
        description: Closed draft-release ciphertext descriptor JSON
        required: true
        type: string
      predecessor_descriptor_json:
        description: Closed prior-result artifact descriptor JSON, or {}
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

concurrency:
  group: official-paid-labeling-baton
  cancel-in-progress: false

jobs:
  assemble-encrypted-baton:
    name: Assemble encrypted provider-free baton
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: legalforecastbench-official-labeling-baton
    permissions:
      actions: read
      contents: read
    env:
      BATON_ROOT: ${{ github.workspace }}/.official-labeling-baton
      JOB_ROOT: ${{ github.workspace }}/.official-paid-labeling-job
      LFB_BATON_AGE_RECIPIENT: ${{ vars.LFB_BATON_AGE_RECIPIENT }}
      OUTPUT_ROOT: ${{ github.workspace }}/official-labeling-baton-output
    steps:
      - name: Checkout trusted release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Validate immutable release and closed descriptors
        id: descriptors
        shell: bash
        env:
          PREDECESSOR_DESCRIPTOR_JSON: ${{ inputs.predecessor_descriptor_json }}
          PROVIDER: ${{ inputs.provider }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SEQUENCE_ORDINAL: ${{ inputs.sequence_ordinal }}
          SOURCE_DESCRIPTOR_JSON: ${{ inputs.source_descriptor_json }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] || [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "baton assembly must be dispatched from an immutable main commit." >&2
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${GITHUB_SHA}" ]] || [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "release_sha must equal the exact main commit that triggered this workflow." >&2
            exit 1
          fi
          sequence_identity_pattern='^(1:llm-unitize:anthropic|2:llm-review-stage-a:google|3:llm-label-provider-shard:openai|3:llm-label-provider-shard:google|4:llm-label-provider-shard:openai|4:llm-label-provider-shard:google)$'
          [[ "${SEQUENCE_ORDINAL}:${STAGE}:${PROVIDER}" =~ ${sequence_identity_pattern} ]] || {
            echo "Sequence/stage/provider identity is outside the frozen Cycle 1 chain." >&2
            exit 1
          }
          jq -e '
            type == "object" and
            (keys | sort) == ["asset_digest","asset_id","asset_name","asset_size_bytes","package_manifest_sha256","release_id"] and
            (.release_id | type == "number" and . > 0 and floor == .) and
            (.asset_id | type == "number" and . > 0 and floor == .) and
            (.asset_size_bytes | type == "number" and . > 0 and floor == .) and
            (.asset_name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*[.]age$")) and
            (.asset_digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
            (.package_manifest_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
          ' <<<"${SOURCE_DESCRIPTOR_JSON}" >/dev/null
          expected_source_name="official-paid-labeling-source-${RELEASE_SHA}-${STAGE}-${PROVIDER}-${SEQUENCE_ORDINAL}.age"
          if [[ "$(jq -r '.asset_name' <<<"${SOURCE_DESCRIPTOR_JSON}")" != "${expected_source_name}" ]]; then
            echo "Draft-release source asset name differs from the canonical release/stage identity." >&2
            exit 1
          fi
          if [[ "${SEQUENCE_ORDINAL}" == "1" ]]; then
            jq -e 'type == "object" and length == 0' <<<"${PREDECESSOR_DESCRIPTOR_JSON}" >/dev/null
          else
            jq -e '
              type == "object" and
              (keys | sort) == ["artifact_digest","artifact_name","package_manifest_sha256","run_attempt","run_id"] and
              (.run_id | type == "number" and . > 0 and floor == .) and
              (.run_attempt | type == "number" and . > 0 and floor == .) and
              (.artifact_name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
              (.artifact_digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
              (.package_manifest_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
            ' <<<"${PREDECESSOR_DESCRIPTOR_JSON}" >/dev/null
            predecessor_run_id="$(jq -r '.run_id' <<<"${PREDECESSOR_DESCRIPTOR_JSON}")"
            predecessor_run_attempt="$(jq -r '.run_attempt' <<<"${PREDECESSOR_DESCRIPTOR_JSON}")"
            predecessor_name="$(jq -r '.artifact_name' <<<"${PREDECESSOR_DESCRIPTOR_JSON}")"
            recovery_name="official-paid-labeling-${STAGE}-${PROVIDER}-${predecessor_run_id}-${predecessor_run_attempt}"
            advance_name="$(jq -nr \
              --arg sequence_ordinal "${SEQUENCE_ORDINAL}" \
              --arg provider "${PROVIDER}" \
              --arg run_id "${predecessor_run_id}" \
              --arg run_attempt "${predecessor_run_attempt}" \
              'if $sequence_ordinal == "2" then
                 "official-paid-labeling-llm-unitize-anthropic-" + $run_id + "-" + $run_attempt
               elif $sequence_ordinal == "3" then
                 "official-paid-labeling-llm-review-stage-a-google-" + $run_id + "-" + $run_attempt
               elif $provider == "openai" then
                 "official-paid-labeling-llm-label-provider-shard-google-" + $run_id + "-" + $run_attempt
               else
                 "official-paid-labeling-llm-label-provider-shard-openai-" + $run_id + "-" + $run_attempt
               end')"
            if [[ "${predecessor_name}" != "${advance_name}" && "${predecessor_name}" != "${recovery_name}" ]]; then
              echo "Predecessor artifact name is not bound to its exact run attempt and transition." >&2
              exit 1
            fi
          fi
          {
            echo "source_release_id=$(jq -r '.release_id' <<<"${SOURCE_DESCRIPTOR_JSON}")"
            echo "source_asset_id=$(jq -r '.asset_id' <<<"${SOURCE_DESCRIPTOR_JSON}")"
            echo "source_asset_name=$(jq -r '.asset_name' <<<"${SOURCE_DESCRIPTOR_JSON}")"
            echo "source_asset_size=$(jq -r '.asset_size_bytes' <<<"${SOURCE_DESCRIPTOR_JSON}")"
            echo "source_asset_digest=$(jq -r '.asset_digest' <<<"${SOURCE_DESCRIPTOR_JSON}")"
            echo "source_package_manifest_sha256=$(jq -r '.package_manifest_sha256' <<<"${SOURCE_DESCRIPTOR_JSON}")"
            echo "predecessor_run_id=$(jq -r '.run_id // empty' <<<"${PREDECESSOR_DESCRIPTOR_JSON}")"
            echo "predecessor_run_attempt=$(jq -r '.run_attempt // empty' <<<"${PREDECESSOR_DESCRIPTOR_JSON}")"
            echo "predecessor_artifact_name=$(jq -r '.artifact_name // empty' <<<"${PREDECESSOR_DESCRIPTOR_JSON}")"
            echo "predecessor_artifact_digest=$(jq -r '.artifact_digest // empty' <<<"${PREDECESSOR_DESCRIPTOR_JSON}")"
            echo "predecessor_package_manifest_sha256=$(jq -r '.package_manifest_sha256 // empty' <<<"${PREDECESSOR_DESCRIPTOR_JSON}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true

      - name: Install pinned age
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BATON_ROOT}/tools"
          curl --fail --silent --show-error --location \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output "${BATON_ROOT}/age.tar.gz"
          printf '%s  %s\n' \
            bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 \
            "${BATON_ROOT}/age.tar.gz" | sha256sum --check --strict
          tar -xzf "${BATON_ROOT}/age.tar.gz" \
            --strip-components=1 --directory "${BATON_ROOT}/tools" age/age
          chmod 0755 "${BATON_ROOT}/tools/age"

      - name: Download exact encrypted draft-release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_ASSET_DIGEST: ${{ steps.descriptors.outputs.source_asset_digest }}
          SOURCE_ASSET_ID: ${{ steps.descriptors.outputs.source_asset_id }}
          SOURCE_ASSET_NAME: ${{ steps.descriptors.outputs.source_asset_name }}
          SOURCE_ASSET_SIZE: ${{ steps.descriptors.outputs.source_asset_size }}
          SOURCE_RELEASE_ID: ${{ steps.descriptors.outputs.source_release_id }}
        run: |
          set -euo pipefail
          mkdir -p "${BATON_ROOT}/source"
          release_json="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${SOURCE_RELEASE_ID}")"
          jq -e --argjson asset_id "${SOURCE_ASSET_ID}" --arg release_sha "${RELEASE_SHA}" \
            '.draft == true and .target_commitish == $release_sha and
             ([.assets[] | select(.id == $asset_id)] | length) == 1' \
            <<<"${release_json}" >/dev/null
          asset_json="$(jq -c --argjson asset_id "${SOURCE_ASSET_ID}" '.assets[] | select(.id == $asset_id)' <<<"${release_json}")"
          jq -e \
            --arg name "${SOURCE_ASSET_NAME}" \
            --arg digest "${SOURCE_ASSET_DIGEST}" \
            --argjson size "${SOURCE_ASSET_SIZE}" \
            '.name == $name and .size == $size and .digest == $digest and .state == "uploaded"' \
            <<<"${asset_json}" >/dev/null
          gh api \
            -H 'Accept: application/octet-stream' \
            "/repos/${GITHUB_REPOSITORY}/releases/assets/${SOURCE_ASSET_ID}" \
            > "${BATON_ROOT}/source/${SOURCE_ASSET_NAME}"
          test "$(stat -c '%s' "${BATON_ROOT}/source/${SOURCE_ASSET_NAME}")" = "${SOURCE_ASSET_SIZE}"
          printf '%s  %s\n' "${SOURCE_ASSET_DIGEST#sha256:}" \
            "${BATON_ROOT}/source/${SOURCE_ASSET_NAME}" | sha256sum --check --strict
          echo "ciphertext=${BATON_ROOT}/source/${SOURCE_ASSET_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact predecessor run and artifact
        if: ${{ inputs.sequence_ordinal > 1 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR_ARTIFACT_DIGEST: ${{ steps.descriptors.outputs.predecessor_artifact_digest }}
          PREDECESSOR_ARTIFACT_NAME: ${{ steps.descriptors.outputs.predecessor_artifact_name }}
          PREDECESSOR_RUN_ATTEMPT: ${{ steps.descriptors.outputs.predecessor_run_attempt }}
          PREDECESSOR_RUN_ID: ${{ steps.descriptors.outputs.predecessor_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PREDECESSOR_RUN_ID}/attempts/${PREDECESSOR_RUN_ATTEMPT}")"
          jq -e \
            --arg release_sha "${RELEASE_SHA}" \
            --argjson attempt "${PREDECESSOR_RUN_ATTEMPT}" \
            '.path == ".github/workflows/official-paid-labeling.yaml" and
             .event == "workflow_dispatch" and .head_branch == "main" and
             .head_sha == $release_sha and .run_attempt == $attempt and
             .status == "completed" and .conclusion == "success"' \
            <<<"${run_json}" >/dev/null
          artifacts_json="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${PREDECESSOR_RUN_ID}/artifacts?per_page=100")"
          jq -s '{artifacts: map(.artifacts[]) }' <<<"${artifacts_json}" > "${BATON_ROOT}/predecessor-artifacts.json"
          jq -e \
            --arg name "${PREDECESSOR_ARTIFACT_NAME}" \
            --arg digest "${PREDECESSOR_ARTIFACT_DIGEST}" \
            '([.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length) == 1' \
            "${BATON_ROOT}/predecessor-artifacts.json" >/dev/null

      - name: Download exact encrypted predecessor artifact
        if: ${{ inputs.sequence_ordinal > 1 }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ steps.descriptors.outputs.predecessor_artifact_name }}
          path: ${{ env.BATON_ROOT }}/predecessor
          repository: ${{ github.repository }}
          run-id: ${{ steps.descriptors.outputs.predecessor_run_id }}

      - name: Assemble and encrypt closed baton
        id: assemble
        shell: bash
        env:
          BATON_AGE_IDENTITY: ${{ secrets.BATON_AGE_IDENTITY }}
          PREDECESSOR_PACKAGE_MANIFEST_SHA256: ${{ steps.descriptors.outputs.predecessor_package_manifest_sha256 }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SEQUENCE_ORDINAL: ${{ inputs.sequence_ordinal }}
          SOURCE_PACKAGE_MANIFEST_SHA256: ${{ steps.descriptors.outputs.source_package_manifest_sha256 }}
        run: |
          set -euo pipefail
          test -n "${BATON_AGE_IDENTITY:-}"
          if [[ ! "${LFB_BATON_AGE_RECIPIENT:-}" =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]; then
            echo "The protected baton environment lacks a valid LFB_BATON_AGE_RECIPIENT." >&2
            exit 1
          fi
          umask 077
          mkdir -p "${BATON_ROOT}/private" "${OUTPUT_ROOT}"
          printf '%s\n' "${BATON_AGE_IDENTITY}" > "${BATON_ROOT}/private/age-identity.txt"
          set --
          if [[ "${SEQUENCE_ORDINAL}" -gt 1 ]]; then
            set -- \
              --predecessor-root "${BATON_ROOT}/predecessor" \
              --predecessor-package-manifest-sha256 "${PREDECESSOR_PACKAGE_MANIFEST_SHA256}"
          fi
          uv run legalforecast acquisition assemble-paid-labeling-baton \
            --source-ciphertext "${{ steps.source.outputs.ciphertext }}" \
            --source-ciphertext-sha256 "${{ steps.descriptors.outputs.source_asset_digest }}" \
            --source-package-manifest-sha256 "${SOURCE_PACKAGE_MANIFEST_SHA256}" \
            --age-executable "${BATON_ROOT}/tools/age" \
            --age-identity-file "${BATON_ROOT}/private/age-identity.txt" \
            --age-recipient "${LFB_BATON_AGE_RECIPIENT}" \
            --release-sha "${RELEASE_SHA}" \
            --stage "${{ inputs.stage }}" \
            --provider "${{ inputs.provider }}" \
            --sequence-ordinal "${SEQUENCE_ORDINAL}" \
            "$@" \
            --job-root "${JOB_ROOT}" \
            --output-ciphertext "${OUTPUT_ROOT}/official-paid-labeling-baton.age" \
            --receipt-output "${OUTPUT_ROOT}/baton-receipt.json" \
            --execute

      - name: Clear plaintext and decryption identity
        id: clear_sensitive
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for sensitive_root in "${BATON_ROOT}/private" "${JOB_ROOT}"; do
            if [[ -d "${sensitive_root}" ]]; then
              find "${sensitive_root}" -type f -exec shred --force --iterations=1 --zero --remove {} +
              find "${sensitive_root}" -depth -type d -empty -delete
            fi
            test ! -e "${sensitive_root}"
          done

      - name: Upload ciphertext-only paid-labeling baton
        id: upload_baton
        if: ${{ always() && steps.assemble.outcome == 'success' && steps.clear_sensitive.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: official-paid-labeling-baton-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}/official-paid-labeling-baton.age
            ${{ env.OUTPUT_ROOT }}/baton-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7

      - name: Record public-safe artifact receipt
        if: ${{ steps.upload_baton.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "artifact_id=${{ steps.upload_baton.outputs.artifact-id }}"
            echo "artifact_digest=${{ steps.upload_baton.outputs.artifact-digest }}"
            echo "artifact_url=${{ steps.upload_baton.outputs.artifact-url }}"
            echo "release_sha=${{ inputs.release_sha }}"
            echo "stage=${{ inputs.stage }}"
            echo "provider=${{ inputs.provider }}"
            echo "sequence_ordinal=${{ inputs.sequence_ordinal }}"
          } >> "${GITHUB_STEP_SUMMARY}"
