name: Claude Code terminal runtime smoke

on:
  pull_request:
    paths:
      - .github/workflows/claude-code-runtime-smoke.yaml
      - infra/claude-code-runtime/**
      - legalforecast/multiharness/claude_code_container.py
      - legalforecast/multiharness/container_harness/**
      - tests/test_claude_code_runtime_image.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Native Bash sandbox and read-only case inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Enable nested user namespaces on disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build pinned Claude Code image
        run: |
          set -euo pipefail
          docker build --pull=false -f infra/claude-code-runtime/Containerfile -t lfb-claude-code:smoke .
          image_id="$(docker image inspect --format '{{.Id}}' lfb-claude-code:smoke)"
          [[ "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "LFB_CLAUDE_CODE_RUNTIME_IMAGE=${image_id}" >> "${GITHUB_ENV}"

      - name: Verify read-only inputs and hosted namespace capability
        run: |
          set -euo pipefail
          docker run --rm --user 0:0 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --pids-limit 32 \
            --memory 128m --cpus 0.25 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --tmpfs /workspace:rw,nosuid,nodev,size=16m \
            --entrypoint /usr/bin/bwrap "${LFB_CLAUDE_CODE_RUNTIME_IMAGE}" \
            --unshare-user --unshare-pid --unshare-net \
            --ro-bind / / --proc /proc --dev /dev /bin/true
          uv run pytest -q tests/test_claude_code_runtime_image.py
