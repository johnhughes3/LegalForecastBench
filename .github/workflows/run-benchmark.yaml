          done
          set +e
          uv run legalforecast run execute --manifest /tmp/lfb-forecast-inputs/run-manifest.json --forecast /tmp/lfb-forecast-inputs/forecast-release.json --artifact-root /tmp/lfb-forecast-inputs/artifacts --model-registry /tmp/lfb-forecast-inputs/model-registry.json --model-key "${MODEL_KEY}" --cell-id "${CELL_ID}" --unit-id "${UNIT_ID}" --repeat-index "${REPEAT_INDEX}" --ablation "${ABLATION}" --ledger /tmp/lfb-run/ledger.sqlite3 --receipts-dir /tmp/lfb-run/receipts --ceiling-microusd "${CEILING_MICROUSD}" --account "${ACCOUNT}" --provider-authority-table "${PROVIDER_AUTHORITY_TABLE}" --provider-authority-region "${PROVIDER_AUTHORITY_REGION}" --provider-authority-resource-identity-sha256 "${PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256}" > /tmp/lfb-run/run-summary.json 2>&1
          status=$?
          set -e
          uv run python - "${status}" <<'PY'
          import json, os, sqlite3, sys
          from pathlib import Path
          status = int(sys.argv[1]); model_key = os.environ["MODEL_KEY"]
          summary = {"schema_version": "legalforecast.forecast-cell-state.v1", "provider": model_key.split(":", 1)[0], "model_key": model_key, "cell_id": os.environ["CELL_ID"], "unit_id": os.environ["UNIT_ID"], "repeat_index": int(os.environ["REPEAT_INDEX"]), "ablation": os.environ["ABLATION"], "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "status": "completed" if status == 0 else "failed", "failure_type": None if status == 0 else "provider_or_runner_failure", "exit_status": status}
          if status != 0:
              Path("/tmp/lfb-run/run-summary.json").write_text(json.dumps(summary, sort_keys=True) + "\n", encoding="utf-8")
          ledger_path = Path("/tmp/lfb-run/ledger.sqlite3")
          if not ledger_path.exists():
              with sqlite3.connect(ledger_path) as connection:
                  connection.execute("CREATE TABLE runs(status TEXT NOT NULL)")
                  connection.execute("INSERT INTO runs(status) VALUES (?)", (summary["status"],))
                  connection.commit()
          Path("/tmp/lfb-run/failure-summary.json").write_text(json.dumps(summary, sort_keys=True) + "\n", encoding="utf-8")
          state_path = Path("/tmp/lfb-run/state.json"); state = json.loads(state_path.read_text()); state.update({"status": summary["status"], "model_key": model_key}); state_path.write_text(json.dumps(state, sort_keys=True) + "\n", encoding="utf-8")
          PY
          exit "${status}"
      - name: Persist Google ledger, receipts, and structured state
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-run-state-${{ matrix.provider }}-${{ matrix.cell_id_slug }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/lfb-run/state.json
            /tmp/lfb-run/failure-summary.json
            /tmp/lfb-run/ledger.sqlite3
            /tmp/lfb-run/run-summary.json
            /tmp/lfb-run/receipts
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  persist-forecast-results:
    name: Persist combined forecast result
    if: ${{ always() && needs.prepare-inputs.result == 'success' }}
    needs: [prepare-inputs, run-openai, run-anthropic, run-gemini]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout and verify trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require main-reachable exact source
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA:-$(git rev-parse HEAD)}"
          git merge-base --is-ancestor origin/main HEAD
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v7.1.6
        with:
          enable-cache: true
      - name: Download validated forecast inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-forecast-inputs-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/lfb-forecast-inputs
      - name: Download per-cell durable state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: locked-run-state-*-attempt-${{ github.run_attempt }}
          path: /tmp/lfb-state-artifacts
          merge-multiple: false
      - name: Assemble exact protected fan-in source artifact
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          FORECAST_RELEASE_URI: ${{ inputs.forecast_release_uri }}
          ARTIFACT_ROOT_URI: ${{ inputs.artifact_root_uri }}
          MODEL_REGISTRY_URI: ${{ inputs.model_registry_uri }}
          MODEL_KEY: ${{ inputs.model_key }}
          REPEAT_COUNT: ${{ inputs.repeat_count }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          import re
          import shutil
          import sqlite3
          from pathlib import Path

          inputs = Path("/tmp/lfb-forecast-inputs")
          state_root = Path("/tmp/lfb-state-artifacts")
          output = Path("/tmp/lfb-forecast-results")
          if output.exists() or output.is_symlink():
              raise SystemExit("combined forecast result destination already exists")
          output.mkdir()
          (output / "receipts").mkdir()
          source_artifacts = inputs / "artifacts"
          if not source_artifacts.is_dir() or source_artifacts.is_symlink():
              raise SystemExit("complete forecast artifact tree is missing")
          shutil.copytree(source_artifacts, output / "artifacts")
          if any(path.is_symlink() for path in (output / "artifacts").rglob("*")):
              raise SystemExit("complete forecast artifact tree contains a symlink")
          for name in (
              "run-manifest.json",
              "forecast-release.json",
              "model-registry.json",
          ):
              source = inputs / name
              if not source.is_file() or source.is_symlink():
                  raise SystemExit(f"validated forecast input is missing: {name}")
              shutil.copyfile(source, output / name)
          def read_object(path: Path) -> dict[str, object]:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"durable state file is missing: {path}")
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"durable state file is not JSON: {path}") from exc
              if not isinstance(value, dict):
                  raise SystemExit(f"durable state file is not an object: {path}")
              return value

          state_dirs = sorted(
              path for path in state_root.iterdir()
              if path.is_dir() and not path.is_symlink()
          ) if state_root.is_dir() and not state_root.is_symlink() else []
          if not state_dirs:
              raise SystemExit("no per-cell durable state artifacts were supplied")

          receipts: list[dict[str, object]] = []
          summaries: list[dict[str, object]] = []
          states: list[dict[str, object]] = []
          for state_dir in state_dirs:
              state = read_object(state_dir / "state.json")
              states.append(state)
              summary_path = state_dir / "run-summary.json"
              if summary_path.is_file() and not summary_path.is_symlink():
                  try:
                      summary_value = json.loads(summary_path.read_text(encoding="utf-8"))
                  except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                      summary_value = None
                  if isinstance(summary_value, dict):
                      summaries.append(summary_value)
              failure = state_dir / "failure-summary.json"
              if not failure.is_file() or failure.is_symlink():
                  raise SystemExit(f"durable failure summary is missing: {state_dir.name}")
              read_object(failure)
              receipts_dir = state_dir / "receipts"
              if receipts_dir.exists() and (not receipts_dir.is_dir() or receipts_dir.is_symlink()):
                  raise SystemExit(f"durable receipt directory is unsafe: {state_dir.name}")
              if not receipts_dir.exists():
                  continue
              for receipt_path in sorted(receipts_dir.glob("*.json")):
                  if receipt_path.is_symlink() or not receipt_path.is_file():
                      raise SystemExit(f"durable receipt is unsafe: {receipt_path}")
                  receipt = read_object(receipt_path)
                  receipts.append(receipt)
                  safe_prefix = re.sub(r"[^A-Za-z0-9_.-]+", "_", state_dir.name)
                  destination = output / "receipts" / f"{safe_prefix}-{receipt_path.name}"
                  if destination.exists():
                      raise SystemExit(f"duplicate durable receipt destination: {destination.name}")
                  shutil.copyfile(receipt_path, destination)
          if not receipts:
              raise SystemExit("no provider receipts are available for the combined result")

          first = receipts[0]
          identity_fields = (
              "run_identity_sha256",
              "forecast_release_digest",
              "model_key",
              "model_registry_sha256",
          )
          for field in identity_fields:
              value = first.get(field)
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"provider receipt lacks {field}")
          identity = {field: first[field] for field in identity_fields}
          seen_units: set[tuple[str, int]] = set()
          for receipt in receipts:
              if any(receipt.get(field) != identity[field] for field in identity_fields):
                  raise SystemExit("provider receipts disagree about frozen run identity")
              if receipt.get("repeat_index") != 1:
                  raise SystemExit("official fan-in source requires repeat_index 1")
              unit_id, case_id, parser_output = receipt.get("unit_id"), receipt.get("case_id"), receipt.get("parser_output")
              if not isinstance(unit_id, str) or not unit_id or not isinstance(case_id, str) or not case_id or not isinstance(parser_output, dict):
                  raise SystemExit("provider receipt lacks exact prediction identity")
              key = (unit_id, 1)
              if key in seen_units:
                  raise SystemExit(f"duplicate provider receipt unit: {unit_id}")
              seen_units.add(key)

          forecast_release_digest = identity["forecast_release_digest"]
          model_registry_sha256 = identity["model_registry_sha256"]
          run_identity_sha256 = identity["run_identity_sha256"]
          if any(
              not re.fullmatch(r"[0-9a-f]{64}", str(identity[field]))
              for field in ("run_identity_sha256", "forecast_release_digest", "model_registry_sha256")
          ):
              raise SystemExit("provider receipt has an invalid frozen identity digest")
          forecast_run = {
              "schema_version": "legalforecast.forecast-run.v1",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "release_sha": os.environ["RELEASE_SHA"],
              "manifest_uri": os.environ["MANIFEST_URI"],
              "forecast_release_uri": os.environ["FORECAST_RELEASE_URI"],
              "artifact_root_uri": os.environ["ARTIFACT_ROOT_URI"],
              "model_registry_uri": os.environ["MODEL_REGISTRY_URI"],
              "model_key": identity["model_key"],
              "run_identity_sha256": run_identity_sha256,
              "forecast_release_digest": forecast_release_digest,
              "model_registry_sha256": model_registry_sha256,
              "repeat_count": int(os.environ["REPEAT_COUNT"]),
          }
          (output / "forecast-run.json").write_text(
              json.dumps(forecast_run, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          all_completed = all(state.get("status") == "completed" for state in states)
          run_status = "completed" if all_completed and len(receipts) > 0 else "failed"
          run_summary = {
              "schema_version": "legalforecast.forecast-run-summary.v1",
              "run_identity_sha256": run_identity_sha256,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": run_status,
              "completed_cells": len(receipts) if all_completed else 0,
              "executed_cells": len(receipts) if all_completed else 0,
              "resumed_cells": 0,
              "state_artifact_count": len(states),
          }
          (output / "run-summary.json").write_text(
              json.dumps(run_summary, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          ledger_path = output / "ledger" / "ledger.sqlite3"
          ledger_path.parent.mkdir()
          with sqlite3.connect(ledger_path) as connection:
              connection.executescript(
                  """
                  CREATE TABLE runs(
                      run_identity_sha256 TEXT PRIMARY KEY,
                      workflow_run_id INTEGER NOT NULL,
                      workflow_run_attempt INTEGER NOT NULL,
                      status TEXT NOT NULL
                  );
                  CREATE TABLE cells(
                      cell_id TEXT PRIMARY KEY,
                      case_id TEXT NOT NULL,
                      unit_id TEXT NOT NULL,
                      repeat_index INTEGER NOT NULL,
                      model_key TEXT NOT NULL,
                      status TEXT NOT NULL
                  );
                  """
              )
              connection.execute(
                  "INSERT INTO runs VALUES (?, ?, ?, ?)",
                  (run_identity_sha256, int(os.environ["GITHUB_RUN_ID"]), int(os.environ["GITHUB_RUN_ATTEMPT"]), run_status),
              )
              for receipt in receipts:
                  connection.execute(
                      "INSERT INTO cells VALUES (?, ?, ?, ?, ?, ?)",
                      (str(receipt["cell_id"]), str(receipt["case_id"]), str(receipt["unit_id"]), 1, str(receipt["model_key"]), run_status),
                  )
              connection.commit()
          PY
      - name: Persist exact combined forecast result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: official-forecast-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/lfb-forecast-results/forecast-run.json
            /tmp/lfb-forecast-results/run-manifest.json
            /tmp/lfb-forecast-results/forecast-release.json
            /tmp/lfb-forecast-results/model-registry.json
            /tmp/lfb-forecast-results/artifacts
            /tmp/lfb-forecast-results/run-summary.json
            /tmp/lfb-forecast-results/ledger/ledger.sqlite3
            /tmp/lfb-forecast-results/receipts
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
