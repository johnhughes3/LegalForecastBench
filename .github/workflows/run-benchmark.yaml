name: Run Benchmark

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact public-repository commit to evaluate; it must be reachable from origin/main.
        required: false
        default: ""
        type: string
      manifest_uri:
        description: Locked public benchmark-run manifest URI or checked-out JSON path.
        required: true
        type: string
      forecast_release_uri:
        description: Outcome-blinded forecast-release.json URI or checked-out path.
        required: true
        type: string
      labels_release_uri:
        description: Separate labels-release.json URI or checked-out path used only by fan-in.
        required: true
        type: string
      artifact_root_uri:
        description: URI or path containing the forecast release's declared public artifacts.
        required: true
        type: string
      model_registry_uri:
        description: Frozen public model registry URI or checked-out JSON path.
        required: true
        type: string
      model_key:
        description: One provider:model_id key from the frozen model registry.
        required: true
        type: string
      ceiling_microusd:
        description: Positive run ceiling in millionths of one US dollar.
        required: true
        type: string
      account:
        description: Stable provider-account identity for this run ledger.
        required: false
        default: default
        type: string
      max_parallel:
        description: Maximum number of resumable forecast cells allowed in this run.
        required: false
        default: "1"
        type: string
      artifact_retention_days:
        description: Retention for public workflow artifacts.
        required: false
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    benchmark-${{ inputs.manifest_uri }}-${{ inputs.forecast_release_uri }}-${{ inputs.labels_release_uri }}-${{ inputs.artifact_root_uri }}-${{ inputs.model_registry_uri }}-${{ inputs.model_key }}-${{ inputs.account }}-${{ inputs.ceiling_microusd }}
  cancel-in-progress: false

jobs:
  prepare-inputs:
    name: Validate releases and materialize allowlisted forecast inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: legalforecastbench-official-eval
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_ANTHROPIC_BEDROCK_MODEL_ID: ${{ vars.LFB_ANTHROPIC_BEDROCK_MODEL_ID }}
      LFB_ANTHROPIC_RUNTIME: ${{ vars.LFB_ANTHROPIC_RUNTIME }}
      LFB_MODEL_PACKET_PREFIX: ${{ vars.LFB_MODEL_PACKET_PREFIX }}
      LFB_PACKET_BUCKET: ${{ vars.LFB_PACKET_BUCKET }}
      LFB_PROVIDER_AUTHORITY_TABLE: ${{ vars.LFB_PROVIDER_AUTHORITY_TABLE }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
      LFB_RESULTS_MANIFEST_PREFIX: ${{ vars.LFB_RESULTS_MANIFEST_PREFIX }}
      LFB_GITHUB_PACKET_READ_ROLE_ARN: ${{ vars.LFB_GITHUB_PACKET_READ_ROLE_ARN }}
    steps:
      - name: Checkout requested public revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require an exact main-reachable source revision
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA:-$(git rev-parse HEAD)}"
          git merge-base --is-ancestor origin/main HEAD
          test -n "$(git rev-parse origin/main)"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true

      - name: Validate dispatch identity and bounded values
        shell: bash
        env:
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          FORECAST_RELEASE_URI: ${{ inputs.forecast_release_uri }}
          LABELS_RELEASE_URI: ${{ inputs.labels_release_uri }}
          ARTIFACT_ROOT_URI: ${{ inputs.artifact_root_uri }}
          MODEL_REGISTRY_URI: ${{ inputs.model_registry_uri }}
          MODEL_KEY: ${{ inputs.model_key }}
          CEILING_MICROUSD: ${{ inputs.ceiling_microusd }}
          ACCOUNT: ${{ inputs.account }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        run: |
          set -euo pipefail
          for value in "${MANIFEST_URI}" "${FORECAST_RELEASE_URI}" "${LABELS_RELEASE_URI}" "${ARTIFACT_ROOT_URI}" "${MODEL_REGISTRY_URI}" "${MODEL_KEY}" "${ACCOUNT}"; do
            [[ -n "${value}" && "${value}" != *..* ]] || { echo "unsafe or empty dispatch identity" >&2; exit 1; }
          done
          [[ "${MODEL_KEY}" =~ ^(openai|anthropic|gemini|google):[^:[:space:]]+$ ]] || { echo "model_key must be provider:model_id" >&2; exit 1; }
          [[ "${CEILING_MICROUSD}" =~ ^[1-9][0-9]*$ ]] || { echo "ceiling_microusd must be positive" >&2; exit 1; }
          [[ "${MAX_PARALLEL}" =~ ^[1-9][0-9]*$ && "${MAX_PARALLEL}" -le 8 ]] || { echo "max_parallel must be between 1 and 8" >&2; exit 1; }
          [[ "${RETENTION_DAYS}" =~ ^[1-9][0-9]*$ && "${RETENTION_DAYS}" -le 90 ]] || { echo "artifact_retention_days must be between 1 and 90" >&2; exit 1; }

      - name: Configure read-only public object access
        if: ${{ startsWith(inputs.manifest_uri, 's3://') || startsWith(inputs.forecast_release_uri, 's3://') || startsWith(inputs.artifact_root_uri, 's3://') || startsWith(inputs.model_registry_uri, 's3://') || startsWith(inputs.manifest_uri, 'manifests/') || startsWith(inputs.forecast_release_uri, 'manifests/') || startsWith(inputs.artifact_root_uri, 'manifests/') || startsWith(inputs.model_registry_uri, 'manifests/') }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lfb-forecast-inputs-${{ github.run_id }}
          role-to-assume: ${{ env.LFB_GITHUB_PACKET_READ_ROLE_ARN }}

      - name: Fetch locked files and exact declared forecast artifacts
        shell: bash
        env:
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          FORECAST_RELEASE_URI: ${{ inputs.forecast_release_uri }}
          ARTIFACT_ROOT_URI: ${{ inputs.artifact_root_uri }}
          MODEL_REGISTRY_URI: ${{ inputs.model_registry_uri }}
        run: |
          set -euo pipefail
          root=/tmp/lfb-locked-inputs
          rm -rf "${root}"
          mkdir -p "${root}/artifacts"
          fetch_file() {
            local uri="$1" destination="$2"
            case "${uri}" in
              s3://*) aws s3 cp "${uri}" "${destination}" --only-show-errors ;;
              manifests/*)
                [[ -n "${LFB_RESULTS_BUCKET:-}" ]] || { echo "LFB_RESULTS_BUCKET is required for manifests/ inputs." >&2; exit 1; }
                aws s3 cp "s3://${LFB_RESULTS_BUCKET}/${uri}" "${destination}" --only-show-errors ;;
              *) cp -- "${uri}" "${destination}" ;;
            esac
          }
          fetch_file "${MANIFEST_URI}" "${root}/run-manifest.json"
          fetch_file "${FORECAST_RELEASE_URI}" "${root}/forecast-release.json"
          fetch_file "${MODEL_REGISTRY_URI}" "${root}/model-registry.json"
          export LFB_ARTIFACT_ROOT_URI="${ARTIFACT_ROOT_URI}"
          uv run python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from legalforecast.contracts import FORECAST_RELEASE_V1, RAW_BYTES_RAW_SHA256_V1
          from legalforecast.release.models import ForecastRelease
          from legalforecast.release.service import load_forecast_execution

          root = Path("/tmp/lfb-locked-inputs")
          source_root = os.environ["LFB_ARTIFACT_ROOT_URI"]
          release_path = root / "forecast-release.json"
          release = ForecastRelease.model_validate(json.loads(release_path.read_text()))
          declared: dict[str, tuple[str, int]] = {}
          for case in release.cases:
              for document in case.documents:
                  declared[document.path] = (document.sha256, document.byte_count)
          for unit in release.prediction_units:
              declared[unit.packet_path] = (unit.packet_sha256, unit.packet_byte_count)
              declared[unit.prompt_path] = (unit.prompt_sha256, unit.prompt_byte_count)
          if not declared:
              raise SystemExit("forecast release declares no artifacts")

          def source_for(relative: str) -> tuple[str, bool]:
              if source_root.startswith("s3://"):
                  return f"{source_root.rstrip('/')}/{relative}", True
              if source_root.startswith("manifests/"):
                  bucket = os.environ.get("LFB_RESULTS_BUCKET", "")
                  if not bucket:
                      raise SystemExit("LFB_RESULTS_BUCKET is required for manifests/ artifacts")
                  return f"s3://{bucket}/{source_root.rstrip('/')}/{relative}", True
              base = Path(source_root)
              if base.is_symlink():
                  raise SystemExit(f"artifact root must not be a symlink: {base}")
              candidate = base / relative
              try:
                  resolved = candidate.resolve(strict=True)
              except OSError as exc:
                  raise SystemExit(f"declared artifact is missing: {candidate}") from exc
              if not candidate.is_file() or candidate.is_symlink() or not resolved.is_relative_to(base.resolve(strict=True)):
                  raise SystemExit(f"declared artifact is missing: {candidate}")
              return str(candidate), False

          for relative, (expected_digest, expected_size) in sorted(declared.items()):
              if not relative or relative.startswith("/") or ".." in Path(relative).parts:
                  raise SystemExit(f"unsafe declared artifact path: {relative!r}")
              destination = root / "artifacts" / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              source, is_s3 = source_for(relative)
              if is_s3:
                  subprocess.run(["aws", "s3", "cp", source, str(destination), "--only-show-errors"], check=True)
              else:
                  shutil.copyfile(source, destination)
              payload = destination.read_bytes()
              actual_digest = str(RAW_BYTES_RAW_SHA256_V1.commit(payload, domain=FORECAST_RELEASE_V1).digest)
              if len(payload) != expected_size or actual_digest != expected_digest:
                  raise SystemExit(f"declared artifact commitment mismatch: {relative}")

          load_forecast_execution(release_path, artifact_root=root / "artifacts")
          materialized_paths = list((root / "artifacts").rglob("*"))
          if any(path.is_symlink() for path in materialized_paths):
              raise SystemExit("materialized artifact tree must not contain symlinks")
          actual = {path.relative_to(root / "artifacts").as_posix() for path in materialized_paths if path.is_file()}
          if actual != set(declared):
              raise SystemExit(f"materialized tree is not exactly release-declared: extras={sorted(actual - set(declared))}")
          PY

      - name: Validate manifest against outcome-blinded forecast release
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from legalforecast.release.consumer import load_run_manifest, validate_manifest_against_forecast
          from legalforecast.release.models import ForecastRelease

          loaded = load_run_manifest(Path("/tmp/lfb-locked-inputs/run-manifest.json"))
          forecast = ForecastRelease.model_validate(json.loads(Path("/tmp/lfb-locked-inputs/forecast-release.json").read_text()))
          validate_manifest_against_forecast(loaded.manifest, forecast)
          PY

      - name: Upload outcome-blinded forecast inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-forecast-inputs-${{ github.run_id }}
          path: /tmp/lfb-locked-inputs
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  run-openai:
    name: OpenAI resumable forecast cell
    if: ${{ startsWith(inputs.model_key, 'openai:') }}
    needs: prepare-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: legalforecastbench-official-eval
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        cell: [run]
    steps:
      - name: Checkout and verify trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require main-reachable exact source
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA:-$(git rev-parse HEAD)}"
          git merge-base --is-ancestor origin/main HEAD
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true
      - name: Restore resumable OpenAI state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: locked-run-state-openai-${{ github.run_id }}-*
          path: /tmp/lfb-run
          merge-multiple: true
        continue-on-error: true
      - name: Download outcome-blinded inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-forecast-inputs-${{ github.run_id }}
          path: /tmp/lfb-forecast-inputs
      - name: Execute OpenAI forecast cell
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_KEY: ${{ inputs.model_key }}
          ACCOUNT: ${{ inputs.account }}
          CEILING_MICROUSD: ${{ inputs.ceiling_microusd }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lfb-run/receipts
          uv run legalforecast run execute \
            --manifest /tmp/lfb-forecast-inputs/run-manifest.json \
            --forecast /tmp/lfb-forecast-inputs/forecast-release.json \
            --artifact-root /tmp/lfb-forecast-inputs/artifacts \
            --model-registry /tmp/lfb-forecast-inputs/model-registry.json \
            --model-key "${MODEL_KEY}" \
            --ledger /tmp/lfb-run/ledger.sqlite3 \
            --receipts-dir /tmp/lfb-run/receipts \
            --ceiling-microusd "${CEILING_MICROUSD}" \
            --account "${ACCOUNT}" | tee /tmp/lfb-run/run-summary.json
      - name: Persist OpenAI ledger, receipts, and result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-run-state-openai-${{ github.run_id }}-${{ strategy.job-index }}
          path: /tmp/lfb-run
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

  run-anthropic:
    name: Anthropic resumable forecast cell
    if: ${{ startsWith(inputs.model_key, 'anthropic:') }}
    needs: prepare-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: legalforecastbench-official-eval
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        cell: [run]
    steps:
      - name: Checkout and verify trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require main-reachable exact source
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA:-$(git rev-parse HEAD)}"
          git merge-base --is-ancestor origin/main HEAD
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true
      - name: Restore resumable Anthropic state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: locked-run-state-anthropic-${{ github.run_id }}-*
          path: /tmp/lfb-run
          merge-multiple: true
        continue-on-error: true
      - name: Download outcome-blinded inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-forecast-inputs-${{ github.run_id }}
          path: /tmp/lfb-forecast-inputs
      - name: Execute Anthropic forecast cell
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_KEY: ${{ inputs.model_key }}
          ACCOUNT: ${{ inputs.account }}
          CEILING_MICROUSD: ${{ inputs.ceiling_microusd }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lfb-run/receipts
          uv run legalforecast run execute \
            --manifest /tmp/lfb-forecast-inputs/run-manifest.json \
            --forecast /tmp/lfb-forecast-inputs/forecast-release.json \
            --artifact-root /tmp/lfb-forecast-inputs/artifacts \
            --model-registry /tmp/lfb-forecast-inputs/model-registry.json \
            --model-key "${MODEL_KEY}" \
            --ledger /tmp/lfb-run/ledger.sqlite3 \
            --receipts-dir /tmp/lfb-run/receipts \
            --ceiling-microusd "${CEILING_MICROUSD}" \
            --account "${ACCOUNT}" | tee /tmp/lfb-run/run-summary.json
      - name: Persist Anthropic ledger, receipts, and result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-run-state-anthropic-${{ github.run_id }}-${{ strategy.job-index }}
          path: /tmp/lfb-run
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

  run-gemini:
    name: Gemini resumable forecast cell
    if: ${{ startsWith(inputs.model_key, 'gemini:') || startsWith(inputs.model_key, 'google:') }}
    needs: prepare-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: legalforecastbench-official-eval
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        cell: [run]
    steps:
      - name: Checkout and verify trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require main-reachable exact source
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA:-$(git rev-parse HEAD)}"
          git merge-base --is-ancestor origin/main HEAD
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true
      - name: Restore resumable Gemini state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: locked-run-state-gemini-${{ github.run_id }}-*
          path: /tmp/lfb-run
          merge-multiple: true
        continue-on-error: true
      - name: Download outcome-blinded inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-forecast-inputs-${{ github.run_id }}
          path: /tmp/lfb-forecast-inputs
      - name: Execute Gemini forecast cell
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_KEY: ${{ inputs.model_key }}
          ACCOUNT: ${{ inputs.account }}
          CEILING_MICROUSD: ${{ inputs.ceiling_microusd }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lfb-run/receipts
          uv run legalforecast run execute \
            --manifest /tmp/lfb-forecast-inputs/run-manifest.json \
            --forecast /tmp/lfb-forecast-inputs/forecast-release.json \
            --artifact-root /tmp/lfb-forecast-inputs/artifacts \
            --model-registry /tmp/lfb-forecast-inputs/model-registry.json \
            --model-key "${MODEL_KEY}" \
            --ledger /tmp/lfb-run/ledger.sqlite3 \
            --receipts-dir /tmp/lfb-run/receipts \
            --ceiling-microusd "${CEILING_MICROUSD}" \
            --account "${ACCOUNT}" | tee /tmp/lfb-run/run-summary.json
      - name: Persist Gemini ledger, receipts, and result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-run-state-gemini-${{ github.run_id }}-${{ strategy.job-index }}
          path: /tmp/lfb-run
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

  score-and-report:
    name: Score and report at labels-only fan-in
    if: ${{ always() && needs.prepare-inputs.result == 'success' && (needs.run-openai.result == 'success' || needs.run-openai.result == 'skipped') && (needs.run-anthropic.result == 'success' || needs.run-anthropic.result == 'skipped') && (needs.run-gemini.result == 'success' || needs.run-gemini.result == 'skipped') && (needs.run-openai.result == 'success' || needs.run-anthropic.result == 'success' || needs.run-gemini.result == 'success') }}
    needs: [prepare-inputs, run-openai, run-anthropic, run-gemini]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: legalforecastbench-official-eval-fan-in
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
      LFB_GITHUB_FAN_IN_ROLE_ARN: ${{ vars.LFB_GITHUB_FAN_IN_ROLE_ARN }}
    steps:
      - name: Checkout and verify trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require main-reachable exact source
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA:-$(git rev-parse HEAD)}"
          git merge-base --is-ancestor origin/main HEAD
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true
      - name: Configure labels-only fan-in access
        if: ${{ startsWith(inputs.labels_release_uri, 's3://') || startsWith(inputs.labels_release_uri, 'manifests/') }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lfb-labels-fan-in-${{ github.run_id }}
          role-to-assume: ${{ env.LFB_GITHUB_FAN_IN_ROLE_ARN }}
      - name: Download outcome-blinded inputs and provider state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: locked-*
          path: /tmp/lfb-fan-in
          merge-multiple: false
      - name: Fetch labels release only at fan-in
        shell: bash
        env:
          LABELS_RELEASE_URI: ${{ inputs.labels_release_uri }}
        run: |
          set -euo pipefail
          case "${LABELS_RELEASE_URI}" in
            s3://*) aws s3 cp "${LABELS_RELEASE_URI}" /tmp/lfb-fan-in/labels-release.json --only-show-errors ;;
            manifests/*) aws s3 cp "s3://${LFB_RESULTS_BUCKET}/${LABELS_RELEASE_URI}" /tmp/lfb-fan-in/labels-release.json --only-show-errors ;;
            *) cp -- "${LABELS_RELEASE_URI}" /tmp/lfb-fan-in/labels-release.json ;;
          esac
      - name: Validate public contracts and project durable receipts
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import shutil
          from pathlib import Path

          root = Path("/tmp/lfb-fan-in")

          def copy_one(pattern: str, destination: Path) -> None:
              matches = sorted(root.rglob(pattern))
              if not matches:
                  raise SystemExit(f"missing fan-in input: {pattern}")
              source = matches[0]
              if source.is_dir():
                  shutil.copytree(source, destination, dirs_exist_ok=True)
              else:
                  shutil.copyfile(source, destination)

          copy_one("run-manifest.json", Path("/tmp/lfb-run-manifest.json"))
          copy_one("forecast-release.json", Path("/tmp/lfb-forecast-release.json"))
          copy_one("model-registry.json", Path("/tmp/lfb-model-registry.json"))
          copy_one("artifacts", Path("/tmp/lfb-artifacts"))
          PY
          test -s /tmp/lfb-run-manifest.json -a -s /tmp/lfb-forecast-release.json -a -s /tmp/lfb-model-registry.json -a -s /tmp/lfb-fan-in/labels-release.json
          uv run legalforecast manifest validate \
            --manifest /tmp/lfb-run-manifest.json \
            --forecast /tmp/lfb-forecast-release.json \
            --labels /tmp/lfb-fan-in/labels-release.json \
            --artifact-root /tmp/lfb-artifacts
          uv run python - <<'PY'
          import json
          from pathlib import Path

          fan_in_root = Path("/tmp/lfb-fan-in")
          receipt_paths = sorted(
              path
              for path in fan_in_root.rglob("*.json")
              if path.parent.name == "receipts"
          )
          if not receipt_paths:
              raise SystemExit("fan-in received no durable provider receipts")
          output = Path("/tmp/lfb-run-records.jsonl")
          with output.open("w", encoding="utf-8") as handle:
              for path in receipt_paths:
                  receipt = json.loads(path.read_text(encoding="utf-8"))
                  unit_id = receipt.get("unit_id")
                  case_id = receipt.get("case_id")
                  model_key = receipt.get("model_key")
                  parser_output = receipt.get("parser_output")
                  if not all(isinstance(value, str) and value for value in (unit_id, case_id, model_key)):
                      raise SystemExit(f"receipt lacks run-record identity: {path}")
                  if not isinstance(parser_output, dict):
                      raise SystemExit(f"receipt lacks parser output: {path}")
                  record = {
                      "case_id": case_id,
                      "model_id": model_key,
                      "required_unit_ids": [unit_id],
                      "parser_output": parser_output,
                      "ablation": receipt.get("ablation", "none"),
                      "run_identity_sha256": receipt.get("run_identity_sha256"),
                      "forecast_release_digest": receipt.get("forecast_release_digest"),
                      "model_registry_sha256": receipt.get("model_registry_sha256"),
                  }
                  handle.write(json.dumps(record, sort_keys=True) + "\n")
          PY
      - name: Score public receipts against labels release
        shell: bash
        run: |
          set -euo pipefail
          uv run legalforecast score \
            --runs /tmp/lfb-run-records.jsonl \
            --labels-release /tmp/lfb-fan-in/labels-release.json \
            --forecast-release /tmp/lfb-forecast-release.json \
            --artifact-root /tmp/lfb-artifacts \
            --manifest /tmp/lfb-run-manifest.json \
            --output /tmp/lfb-score.json
          uv run legalforecast report \
            --scores /tmp/lfb-score.json \
            --output-dir /tmp/lfb-report \
            --labels-release /tmp/lfb-fan-in/labels-release.json \
            --forecast-release /tmp/lfb-forecast-release.json \
            --artifact-root /tmp/lfb-artifacts \
            --manifest /tmp/lfb-run-manifest.json \
            --title "LegalForecast official benchmark"
      - name: Upload score and report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-score-report-${{ github.run_id }}
          path: |
            /tmp/lfb-score.json
            /tmp/lfb-report
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}
