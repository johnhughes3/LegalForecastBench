name: Run Benchmark

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact public-repository commit to evaluate; it must be reachable from origin/main.
        required: false
        default: ""
        type: string
      manifest_uri:
        description: Locked public benchmark-run manifest URI or checked-out JSON path.
        required: true
        type: string
      forecast_release_uri:
        description: Outcome-blinded forecast-release.json URI or checked-out path.
        required: true
        type: string
      artifact_root_uri:
        description: URI or path containing the forecast release's declared public artifacts.
        required: true
        type: string
      model_registry_uri:
        description: Frozen public model registry URI or checked-out JSON path.
        required: true
        type: string
      model_key:
        description: One provider:model_id key from the frozen model registry.
        required: true
        type: string
      ceiling_microusd:
        description: Positive run ceiling in millionths of one US dollar.
        required: true
        type: string
      account:
        description: Stable provider-account identity for this run ledger.
        required: false
        default: default
        type: string
      repeat_count:
        description: Number of repeats for each forecast unit and registered model.
        required: false
        default: "1"
        type: string
      max_parallel:
        description: Maximum number of resumable forecast cells allowed in this run.
        required: false
        default: "4"
        type: string
      artifact_retention_days:
        description: Retention for public workflow artifacts.
        required: false
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    benchmark-${{ inputs.manifest_uri }}-${{ inputs.forecast_release_uri }}-${{ inputs.artifact_root_uri }}-${{ inputs.model_registry_uri }}-${{ inputs.model_key }}-${{ inputs.account }}-${{ inputs.ceiling_microusd }}-${{ inputs.repeat_count }}
  cancel-in-progress: false

jobs:
  prepare-inputs:
    name: Validate releases and materialize allowlisted forecast inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: legalforecastbench-official-eval-prepare-inputs
    permissions:
      contents: read
      id-token: write
    outputs:
      openai_matrix: ${{ steps.matrix.outputs.openai_matrix }}
      openai_count: ${{ steps.matrix.outputs.openai_count }}
      anthropic_matrix: ${{ steps.matrix.outputs.anthropic_matrix }}
      anthropic_count: ${{ steps.matrix.outputs.anthropic_count }}
      gemini_matrix: ${{ steps.matrix.outputs.gemini_matrix }}
      gemini_count: ${{ steps.matrix.outputs.gemini_count }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
    env:
      LFB_AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
      LFB_GITHUB_PREPARE_INPUTS_ROLE_ARN: ${{ vars.LFB_GITHUB_PREPARE_INPUTS_ROLE_ARN }}
    steps:
      - name: Checkout requested public revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require an exact main-reachable source revision
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA:-$(git rev-parse HEAD)}"
          git merge-base --is-ancestor origin/main HEAD
          test -n "$(git rev-parse origin/main)"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v7.1.6
        with:
          enable-cache: true
      - name: Validate dispatch identity and bounded values
        shell: bash
        env:
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          FORECAST_RELEASE_URI: ${{ inputs.forecast_release_uri }}
          ARTIFACT_ROOT_URI: ${{ inputs.artifact_root_uri }}
          MODEL_REGISTRY_URI: ${{ inputs.model_registry_uri }}
          MODEL_KEY: ${{ inputs.model_key }}
          CEILING_MICROUSD: ${{ inputs.ceiling_microusd }}
          ACCOUNT: ${{ inputs.account }}
          REPEAT_COUNT: ${{ inputs.repeat_count }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        run: |
          set -euo pipefail
          for value in "${MANIFEST_URI}" "${FORECAST_RELEASE_URI}" "${ARTIFACT_ROOT_URI}" "${MODEL_REGISTRY_URI}" "${MODEL_KEY}" "${ACCOUNT}"; do
            [[ -n "${value}" && "${value}" != *..* ]] || { echo "unsafe or empty dispatch identity" >&2; exit 1; }
          done
          [[ "${MODEL_KEY}" =~ ^(openai|anthropic|gemini|google):[^:[:space:]]+$ ]] || { echo "model_key must be provider:model_id" >&2; exit 1; }
          [[ "${CEILING_MICROUSD}" =~ ^[1-9][0-9]*$ ]] || { echo "ceiling_microusd must be positive" >&2; exit 1; }
          [[ "${REPEAT_COUNT}" =~ ^[1-9][0-9]*$ && "${REPEAT_COUNT}" -le 20 ]] || { echo "repeat_count must be between 1 and 20" >&2; exit 1; }
          [[ "${REPEAT_COUNT}" == "1" ]] || { echo "repeat_count must be exactly 1 until repeated-sampling fan-in is supported" >&2; exit 1; }
          [[ "${MAX_PARALLEL}" =~ ^[1-9][0-9]*$ && "${MAX_PARALLEL}" -le 32 ]] || { echo "max_parallel must be between 1 and 32" >&2; exit 1; }
          [[ "${RETENTION_DAYS}" =~ ^[1-9][0-9]*$ && "${RETENTION_DAYS}" -le 90 ]] || { echo "artifact_retention_days must be between 1 and 90" >&2; exit 1; }
      - name: Configure read-only public object access
        if: ${{ startsWith(inputs.manifest_uri, 's3://') || startsWith(inputs.forecast_release_uri, 's3://') || startsWith(inputs.artifact_root_uri, 's3://') || startsWith(inputs.model_registry_uri, 's3://') || startsWith(inputs.manifest_uri, 'manifests/') || startsWith(inputs.forecast_release_uri, 'manifests/') || startsWith(inputs.artifact_root_uri, 'manifests/') || startsWith(inputs.model_registry_uri, 'manifests/') }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.LFB_AWS_REGION }}
          role-session-name: lfb-forecast-inputs-${{ github.run_id }}
          role-to-assume: ${{ env.LFB_GITHUB_PREPARE_INPUTS_ROLE_ARN }}
      - name: Fetch locked files and exact declared forecast artifacts
        shell: bash
        env:
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          FORECAST_RELEASE_URI: ${{ inputs.forecast_release_uri }}
          ARTIFACT_ROOT_URI: ${{ inputs.artifact_root_uri }}
          MODEL_REGISTRY_URI: ${{ inputs.model_registry_uri }}
        run: |
          set -euo pipefail
          root=/tmp/lfb-locked-inputs
          rm -rf "${root}"
          mkdir -p "${root}/artifacts"
          fetch_file() {
            local uri="$1" destination="$2"
            case "${uri}" in
              s3://*) aws s3 cp "${uri}" "${destination}" --only-show-errors ;;
              manifests/*)
                [[ -n "${LFB_RESULTS_BUCKET:-}" ]] || { echo "LFB_RESULTS_BUCKET is required for manifests/ inputs." >&2; exit 1; }
                aws s3 cp "s3://${LFB_RESULTS_BUCKET}/${uri}" "${destination}" --only-show-errors ;;
              *) cp -- "${uri}" "${destination}" ;;
            esac
          }
          fetch_file "${MANIFEST_URI}" "${root}/run-manifest.json"
          fetch_file "${FORECAST_RELEASE_URI}" "${root}/forecast-release.json"
          fetch_file "${MODEL_REGISTRY_URI}" "${root}/model-registry.json"
          export LFB_ARTIFACT_ROOT_URI="${ARTIFACT_ROOT_URI}"
          uv run python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          from legalforecast.contracts import FORECAST_RELEASE_V1, RAW_BYTES_RAW_SHA256_V1
          from legalforecast.release.models import ForecastRelease
          from legalforecast.release.service import load_forecast_execution
          root = Path("/tmp/lfb-locked-inputs")
          source_root = os.environ["LFB_ARTIFACT_ROOT_URI"]
          release_path = root / "forecast-release.json"
          release = ForecastRelease.model_validate(json.loads(release_path.read_text()))
          declared: dict[str, tuple[str, int]] = {}
          for case in release.cases:
              for document in case.documents:
                  declared[document.path] = (document.sha256, document.byte_count)
          for unit in release.prediction_units:
              declared[unit.packet_path] = (unit.packet_sha256, unit.packet_byte_count)
              declared[unit.prompt_path] = (unit.prompt_sha256, unit.prompt_byte_count)
          if not declared:
              raise SystemExit("forecast release declares no artifacts")
          def source_for(relative: str) -> tuple[str, bool]:
              if source_root.startswith("s3://"):
                  return f"{source_root.rstrip('/')}/{relative}", True
              if source_root.startswith("manifests/"):
                  bucket = os.environ.get("LFB_RESULTS_BUCKET", "")
                  if not bucket:
                      raise SystemExit("LFB_RESULTS_BUCKET is required for manifests/ artifacts")
                  return f"s3://{bucket}/{source_root.rstrip('/')}/{relative}", True
              base = Path(source_root)
              if base.is_symlink():
                  raise SystemExit(f"artifact root must not be a symlink: {base}")
              candidate = base / relative
              try:
                  resolved, base_resolved = candidate.resolve(strict=True), base.resolve(strict=True)
              except OSError as exc:
                  raise SystemExit(f"declared artifact is missing: {candidate}") from exc
              if not candidate.is_file() or candidate.is_symlink() or not resolved.is_relative_to(base_resolved):
                  raise SystemExit(f"declared artifact is missing: {candidate}")
              return str(candidate), False
          for relative, (expected_digest, expected_size) in sorted(declared.items()):
              if not relative or relative.startswith("/") or ".." in Path(relative).parts:
                  raise SystemExit(f"unsafe declared artifact path: {relative!r}")
              destination = root / "artifacts" / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              source, is_s3 = source_for(relative)
              if is_s3:
                  subprocess.run(["aws", "s3", "cp", source, str(destination), "--only-show-errors"], check=True)
              else:
                  shutil.copyfile(source, destination)
              payload = destination.read_bytes()
              actual_digest = str(RAW_BYTES_RAW_SHA256_V1.commit(payload, domain=FORECAST_RELEASE_V1).digest)
              if len(payload) != expected_size or actual_digest != expected_digest:
                  raise SystemExit(f"declared artifact commitment mismatch: {relative}")
          load_forecast_execution(release_path, artifact_root=root / "artifacts")
          materialized = list((root / "artifacts").rglob("*"))
          if any(path.is_symlink() for path in materialized):
              raise SystemExit("materialized artifact tree must not contain symlinks")
          actual = {path.relative_to(root / "artifacts").as_posix() for path in materialized if path.is_file()}
          if actual != set(declared):
              raise SystemExit(f"materialized tree is not exactly release-declared: extras={sorted(actual - set(declared))}")
          PY
      - name: Validate locked manifest against outcome-blinded forecast release
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from legalforecast.release.consumer import load_run_manifest, validate_manifest_against_forecast
          from legalforecast.release.models import ForecastRelease
          loaded = load_run_manifest(Path("/tmp/lfb-locked-inputs/run-manifest.json"))
          forecast = ForecastRelease.model_validate(json.loads(Path("/tmp/lfb-locked-inputs/forecast-release.json").read_text()))
          validate_manifest_against_forecast(loaded.manifest, forecast)
          PY
      - name: Build dynamic logical-cell matrices from validated releases
        id: matrix
        shell: bash
        env:
          REPEAT_COUNT: ${{ inputs.repeat_count }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          MODEL_KEY: ${{ inputs.model_key }}
          ACCOUNT: ${{ inputs.account }}
          CEILING_MICROUSD: ${{ inputs.ceiling_microusd }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os, re
          from pathlib import Path
          from legalforecast.evals.model_registry import load_model_registry, model_registry_sha256, require_official_registry_entries
          from legalforecast.immutable_io import read_single_link_file
          from legalforecast.release import load_forecast_run_inputs
          from legalforecast.runner import derive_cell_id, derive_run_identity_sha256
          repeat_count = int(os.environ["REPEAT_COUNT"])
          run_inputs = load_forecast_run_inputs(Path("/tmp/lfb-locked-inputs/run-manifest.json"), Path("/tmp/lfb-locked-inputs/forecast-release.json"), artifact_root=Path("/tmp/lfb-locked-inputs/artifacts"))
          forecast = run_inputs.execution.release
          registry_bytes = read_single_link_file(Path("/tmp/lfb-locked-inputs/model-registry.json"), label="model registry")
          registry_sha256 = model_registry_sha256(registry_bytes)
          requested_model_key = os.environ["MODEL_KEY"]
          entries = require_official_registry_entries(load_model_registry("/tmp/lfb-locked-inputs/model-registry.json").entries)
          requested_provider, separator, requested_model_id = requested_model_key.partition(":")
          if not separator:
              raise SystemExit(f"model_key is not provider:model_id: {requested_model_key}")
          normalized_requested_provider = "gemini" if requested_provider.casefold() == "google" else requested_provider.casefold()
          selected = [
              entry for entry in entries
              if entry.model_id == requested_model_id
              and ("gemini" if entry.provider.casefold() == "google" else entry.provider.casefold()) == normalized_requested_provider
          ]
          if len(selected) != 1:
              raise SystemExit(f"model_key is not the exact key of one eligible registry entry: {requested_model_key}")
          entries = selected
          entry = selected[0]
          run_identity_sha256 = derive_run_identity_sha256(execution=run_inputs.execution, entry=entry, registry_sha256=registry_sha256, ceiling_microusd=int(os.environ["CEILING_MICROUSD"]), harness="native", ablation="none", repeat_count=repeat_count, account=os.environ["ACCOUNT"], manifest_id=str(run_inputs.manifest.run_id), manifest_sha256=run_inputs.manifest_sha256)
          matrices: dict[str, list[dict[str, object]]] = {"openai": [], "anthropic": [], "gemini": []}
          def slug(value: str) -> str:
              value = re.sub(r"[^A-Za-z0-9_.-]+", "_", value).strip("_.-")
              if not value:
                  raise SystemExit("cell identity produced an empty artifact slug")
              return value[:180]
          for entry in entries:
              provider = entry.provider.strip().casefold()
              if provider == "google":
                  provider = "gemini"
              if provider not in matrices:
                  raise SystemExit(f"model registry provider is not supported by the official forecast workflow: {entry.provider}")
              for unit in forecast.prediction_units:
                  for repeat_index in range(1, repeat_count + 1):
                      ablation = "none"
                      cell_id = derive_cell_id(identity_sha256=run_identity_sha256, case_id=unit.case_id, unit_id=unit.unit_id, repeat_index=repeat_index)
                      matrices[provider].append({"provider": provider, "model_key": entry.registry_key, "model_id": entry.model_id, "cell_id": cell_id, "cell_id_slug": slug(cell_id), "unit_id": unit.unit_id, "case_id": unit.case_id, "repeat_index": repeat_index, "ablation": ablation})
          output = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")
          with output:
              for provider, rows in matrices.items():
                  slugs = [str(row["cell_id_slug"]) for row in rows]
                  if len(slugs) != len(set(slugs)):
                      raise SystemExit(f"artifact cell slug collision for provider {provider}")
                  print(f"{provider}_matrix={json.dumps({'include': rows}, separators=(',', ':'), sort_keys=True)}", file=output)
                  print(f"{provider}_count={len(rows)}", file=output)
              print(f"max_parallel={os.environ['MAX_PARALLEL']}", file=output)
          PY
      - name: Upload outcome-blinded forecast inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-forecast-inputs-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/lfb-locked-inputs
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  run-openai:
    name: OpenAI resumable forecast cells
    if: ${{ startsWith(inputs.model_key, 'openai:') && needs.prepare-inputs.outputs.openai_count != '0' }}
    needs: prepare-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: legalforecastbench-official-eval
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      LFB_AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_GITHUB_PACKET_READ_ROLE_ARN: ${{ vars.LFB_GITHUB_PACKET_READ_ROLE_ARN }}
      LFB_PROVIDER_AUTHORITY_TABLE: ${{ vars.LFB_PROVIDER_AUTHORITY_TABLE }}
      LFB_PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256: ${{ vars.LFB_PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare-inputs.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare-inputs.outputs.openai_matrix) }}
    steps:
      - name: Checkout and verify trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require main-reachable exact source
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA:-$(git rev-parse HEAD)}"
          git merge-base --is-ancestor origin/main HEAD
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v7.1.6
        with:
          enable-cache: true
      - name: Configure shared provider spend authority access
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.LFB_AWS_REGION }}
          role-session-name: lfb-provider-authority-${{ github.run_id }}-${{ matrix.cell_id_slug }}
          role-to-assume: ${{ env.LFB_GITHUB_PACKET_READ_ROLE_ARN }}
      - name: Initialize bounded resumable state
        shell: bash
        env:
          PROVIDER: ${{ matrix.provider }}
          CELL_ID: ${{ matrix.cell_id }}
          CELL_ID_SLUG: ${{ matrix.cell_id_slug }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lfb-run/receipts
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          record = {"schema_version": "legalforecast.forecast-cell-state.v1", "provider": os.environ["PROVIDER"], "cell_id": os.environ["CELL_ID"], "cell_id_slug": os.environ["CELL_ID_SLUG"], "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "status": "initialized"}
          Path("/tmp/lfb-run/state.json").write_text(json.dumps(record, sort_keys=True) + "\n", encoding="utf-8")
          Path("/tmp/lfb-run/failure-summary.json").write_text(json.dumps({**record, "failure_type": None}, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Restore newest prior valid attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          CELL_ID: ${{ matrix.cell_id }}
          CELL_ID_SLUG: ${{ matrix.cell_id_slug }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "${RUNNER_TEMP}/forecast-artifacts.json"
          export METADATA_PATH="${RUNNER_TEMP}/forecast-artifacts.json"
          uv run python - <<'PY'
          import json, os, re, shutil, subprocess, sys, zipfile
          from pathlib import Path
          provider, cell_id = os.environ["PROVIDER"], os.environ["CELL_ID"]
          current = int(os.environ["GITHUB_RUN_ATTEMPT"]); slug = os.environ["CELL_ID_SLUG"]
          pages = json.loads(Path(os.environ["METADATA_PATH"]).read_text()); artifacts = [item for page in pages for item in page]
          pattern = re.compile(r"^" + re.escape(f"locked-run-state-{provider}-{slug}-attempt-") + r"([1-9][0-9]*)$")
          candidates = [(int(match.group(1)), item["created_at"], item["id"]) for item in artifacts if isinstance(item, dict) and item.get("expired") is not True and isinstance(item.get("name"), str) and (match := pattern.fullmatch(item["name"])) and int(match.group(1)) < current and isinstance(item.get("id"), int) and isinstance(item.get("created_at"), str)]
          if not candidates:
              print("restore=none"); raise SystemExit(0)
          candidates.sort(reverse=True); run_root = Path("/tmp/lfb-run"); allowed = {"state.json", "failure-summary.json", "ledger.sqlite3", "run-summary.json"}; valid = None
          for attempt, _created, artifact_id in candidates:
              archive = Path(os.environ["RUNNER_TEMP"]) / f"forecast-state-{artifact_id}.zip"; root = Path(os.environ["RUNNER_TEMP"]) / f"forecast-state-{artifact_id}"; shutil.rmtree(root, ignore_errors=True); root.mkdir()
              try:
                  subprocess.run(["gh", "api", "--output", str(archive), f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}/zip"], check=True)
              except (OSError, subprocess.CalledProcessError) as exc:
                  raise SystemExit("prior state download/API failure; refusing a fresh duplicate call") from exc
              try:
                  with zipfile.ZipFile(archive) as bundle:
                      for info in bundle.infolist():
                          parts = Path(info.filename).parts
                          if not info.filename or info.filename.startswith("/") or ".." in parts or len(parts) > 2 or (len(parts) == 1 and parts[0] not in allowed) or (len(parts) == 2 and (parts[0] != "receipts" or not parts[1].endswith(".json"))): raise ValueError("unexpected state archive path")
                          if not info.filename.endswith("/"): (root / info.filename).parent.mkdir(parents=True, exist_ok=True); (root / info.filename).write_bytes(bundle.read(info.filename))
                  state = json.loads((root / "state.json").read_text()); json.loads((root / "failure-summary.json").read_text())
                  if state.get("provider") != provider or state.get("cell_id") != cell_id or state.get("run_attempt") != attempt: raise ValueError("state identity does not match artifact")
              except (OSError, ValueError, KeyError, json.JSONDecodeError, zipfile.BadZipFile) as exc:
                  print(f"ignoring corrupt prior state attempt {attempt}: {exc}", file=sys.stderr); continue
              valid = (root, attempt); break
          if valid is None: raise SystemExit("all prior state artifacts were corrupt; refusing a fresh duplicate call")
          root, attempt = valid
          for path in root.iterdir():
              if path.is_dir(): shutil.copytree(path, run_root / path.name, dirs_exist_ok=True)
              else: shutil.copyfile(path, run_root / path.name)
          state_path = run_root / "state.json"; state = json.loads(state_path.read_text()); state.update({"restored_from_attempt": attempt, "run_attempt": current, "status": "restored"}); state_path.write_text(json.dumps(state, sort_keys=True) + "\n", encoding="utf-8")
          print(f"restore=attempt-{attempt}")
          PY
      - name: Download outcome-blinded inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-forecast-inputs-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/lfb-forecast-inputs
      - name: Execute exact OpenAI forecast cell
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_KEY: ${{ matrix.model_key }}
          CELL_ID: ${{ matrix.cell_id }}
          UNIT_ID: ${{ matrix.unit_id }}
          REPEAT_INDEX: ${{ matrix.repeat_index }}
          ABLATION: ${{ matrix.ablation }}
          ACCOUNT: ${{ inputs.account }}
          CEILING_MICROUSD: ${{ inputs.ceiling_microusd }}
          PROVIDER_AUTHORITY_TABLE: ${{ env.LFB_PROVIDER_AUTHORITY_TABLE }}
          PROVIDER_AUTHORITY_REGION: ${{ env.LFB_AWS_REGION }}
          PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256: ${{ env.LFB_PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256 }}
        run: |
          set -euo pipefail
