name: Paper

on:
  push:
    branches: [main]
    paths:
      - 'docs/paper/**'
      - 'site/src/data/significance/summary/**'
      - '.github/workflows/paper.yaml'
  pull_request:
    paths:
      - 'docs/paper/**'
      - 'site/src/data/significance/summary/**'
      - '.github/workflows/paper.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile working paper
    permissions:
      contents: read
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check generated figures against the manuscript
        run: >-
          uv run --no-project --python 3.14 python
          docs/paper/figures/make_figures.py --check
          --manuscript docs/paper/LegalForecastBench-paper.tex

      - name: Compile with pinned TeX Live
        run: bash docs/paper/build.sh --container

      - name: Upload PDF preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: legalforecastbench-paper-${{ github.sha }}
          path: docs/paper/build/LegalForecastBench-paper.pdf
          if-no-files-found: error
          retention-days: 30

      # main rejects a workflow-token push: the new commit would not already
      # have the required Python quality gates check. The website PDF has to
      # arrive in the same pull request as the manuscript change.
      - name: Require the website PDF to match the compile
        run: |
          set -euo pipefail
          committed=site/public/papers/legalforecastbench-working.pdf
          if cmp -s docs/paper/build/LegalForecastBench-paper.pdf "$committed"; then
            exit 0
          fi
          printf 'The compiled PDF differs from %s.\n' "$committed" >&2
          printf 'Download the legalforecastbench-paper artifact from this run and commit that file.\n' >&2
          exit 1
