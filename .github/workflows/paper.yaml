name: Paper

on:
  push:
    branches: [main]
    paths:
      - 'docs/paper/**'
      - 'site/src/data/significance/summary/**'
      - '.github/workflows/paper.yaml'
  pull_request:
    paths:
      - 'docs/paper/**'
      - 'site/src/data/significance/summary/**'
      - '.github/workflows/paper.yaml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile working paper
    permissions:
      contents: read
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
          # Full history so the PDF date is the last docs/paper commit, not the
          # shallow boundary of an unrelated change.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check generated figures against the manuscript
        run: >-
          uv run --no-project --python 3.14 python
          docs/paper/figures/make_figures.py --check
          --manuscript docs/paper/LegalForecastBench-paper.tex

      - name: Compile with pinned TeX Live
        run: bash docs/paper/build.sh --container

      - name: Upload PDF preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: legalforecastbench-paper-${{ github.sha }}
          path: docs/paper/build/LegalForecastBench-paper.pdf
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Update the website PDF
    needs: build
    # A GITHUB_TOKEN push does not start new workflow runs. Committing onto a
    # pull-request head would leave that head without the required checks.
    # The compile job still uploads a preview artifact on a pull request.
    # Update the website copy only once the change is on main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the compiled PDF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legalforecastbench-paper-${{ github.sha }}
          path: docs/paper/build
          github-token: ${{ github.token }}

      - name: Commit and push the working PDF when it changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAPER_PUSH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status=$(bash docs/paper/publish-working-copy.sh)
          printf '%s\n' "$status"
          if [[ "$status" != "UPDATED" ]]; then
            exit 0
          fi
          # Branch names are not arbitrary shell. Reject anything that is not a
          # normal ref before using it as a push destination.
          if [[ ! "$PAPER_PUSH_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$PAPER_PUSH_REF" == *..* ]]; then
            printf 'Refusing to push the working PDF to %s\n' "$PAPER_PUSH_REF" >&2
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          if ! git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push origin "HEAD:${PAPER_PUSH_REF}"; then
            printf 'Could not push the working PDF. Commit site/public/papers/legalforecastbench-working.pdf on this branch.\n' >&2
            exit 1
          fi
