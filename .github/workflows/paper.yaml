name: Paper

on:
  push:
    branches: [main]
    paths:
      - 'docs/paper/**'
      - 'docs/harvey-lab-audit/litigation-dispute-resolution/human-review/**'
      - 'site/src/data/significance/**'
      - '.github/workflows/paper.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'docs/paper/**'
      - 'docs/harvey-lab-audit/litigation-dispute-resolution/human-review/**'
      - 'site/src/data/significance/**'
      - '.github/workflows/paper.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile working paper
    permissions:
      contents: read
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    # The small pinned image needs no runtime package installation. Two
    # bounded pulls keep a registry stall from consuming the whole job.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check generated figures against the manuscript
        run: >-
          uv run --no-project --python 3.14 python
          docs/paper/figures/make_figures.py --check
          --manuscript docs/paper/LegalForecastBench-paper.tex

      - name: Check clustering analysis against the manuscript
        run: >-
          uv run --frozen python docs/paper/analysis/clustering.py --check
          --manuscript docs/paper/LegalForecastBench-paper.tex

      - name: Check the LAB human-review appendix against the worksheet
        run: >-
          uv run --frozen python docs/paper/analysis/lab_review.py --check
          --manuscript docs/paper/LegalForecastBench-paper.tex

      - name: Compile with pinned TeX Live
        run: bash docs/paper/build.sh --container

      - name: Upload PDF preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: legalforecastbench-paper-${{ github.sha }}
          path: docs/paper/build/LegalForecastBench-paper.pdf
          if-no-files-found: error
          retention-days: 30

      # main rejects a workflow-token push: the new commit would not already
      # have the required Python quality gates check. The website PDF has to
      # arrive in the same pull request as the manuscript change.
      - name: Require the website PDF to match the compile
        run: |
          set -euo pipefail
          committed=site/public/paper/legalforecastbench-working.pdf
          if cmp -s docs/paper/build/LegalForecastBench-paper.pdf "$committed"; then
            exit 0
          fi
          printf 'The compiled PDF differs from %s.\n' "$committed" >&2
          printf 'Download the legalforecastbench-paper artifact from this run and commit that file.\n' >&2
          exit 1

  pangram:
    name: Pangram check of author prose
    # Scoring spends Pangram credits, so it runs only for pull requests from
    # this repository (forks have no secret) and on manual dispatch. A result
    # is cached by the exact text sent, so a commit that changes only the PDF,
    # or reruns the job, reuses it instead of paying again.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 10
    env:
      OUT: docs/paper/build/pangram
      MANUSCRIPT: docs/paper/LegalForecastBench-paper.tex
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Extract the text that would be scored
        id: extract
        run: |
          set -euo pipefail
          uv run --frozen python docs/paper/analysis/pangram_check.py \
            --extract-only --manuscript "$MANUSCRIPT" --out "$OUT"
          echo "hash=$(sha256sum "$OUT/paper.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Reuse a result for the same text
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/paper/build/pangram/response.json
          key: pangram-${{ steps.extract.outputs.hash }}

      - name: Score with Pangram
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          # Fail when more than this share of the scored text reads as AI.
          MAX_AI_FRACTION: ${{ vars.PANGRAM_MAX_AI_FRACTION || '0.10' }}
        run: |
          set -euo pipefail
          args=(--manuscript "$MANUSCRIPT" --out "$OUT" --verbose
                --fail-above "$MAX_AI_FRACTION")
          if [[ "$CACHE_HIT" == true ]]; then
            args+=(--response "$OUT/response.json")
          elif [[ -z "$PANGRAM_API_KEY" ]]; then
            echo "::error::The PANGRAM_API_KEY repository secret is not set."
            exit 1
          fi
          status=0
          uv run --frozen --with pangram-sdk==1.0.0 python \
            docs/paper/analysis/pangram_check.py "${args[@]}" \
            | tee "$OUT/report.txt" || status=$?
          {
            echo '### Pangram check of author prose'
            echo
            echo '```'
            cat "$OUT/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Save the result for this text
        if: always() && steps.cache.outputs.cache-hit != 'true' && hashFiles('docs/paper/build/pangram/response.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/paper/build/pangram/response.json
          key: pangram-${{ steps.extract.outputs.hash }}

      - name: Upload the scored text and response
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pangram-${{ github.sha }}
          path: docs/paper/build/pangram/
          if-no-files-found: ignore
          retention-days: 30
