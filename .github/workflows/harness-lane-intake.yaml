name: Harness Lane Intake

# Maintainer-triggered validation of one tracked harness-lane package before
# any upload. This is not an official LegalForecastBench result path and it
# does not publish to Hugging Face.
#
# WHY IT IS MAINTAINER-TRIGGERED. This accepts bytes into storage we host, so
# nothing here may run from a pull_request event. A maintainer reads the
# change, then dispatches this workflow at an exact commit. The job re-validates
# from scratch before it stages or uploads anything.
#
# Fork PRs never reach this file: there is no pull_request_target trigger,
# top-level permissions are empty, and contributors never receive a credential
# to anything of ours.

on:
  workflow_dispatch:
    inputs:
      package_dir:
        description: >-
          Checked-out path of the tracked package to validate, e.g.
          community/submissions/2026/<submission-id>. Must be tracked at the
          dispatched commit.
        required: true
        type: string

permissions: {}

concurrency:
  group: harness-lane-intake-${{ inputs.package_dir }}
  cancel-in-progress: false

jobs:
  intake:
    name: Validate and stage one harness-lane package
    permissions:
      contents: read
    # Unset CI_RUNNER (Dependabot and public johnhughes3 repos cannot see the
    # private org variable) must fall back to ubicloud-standard-2, not ubuntu-latest.
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Refuse a package path that cannot be a tracked tree
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          set -euo pipefail
          case "${PACKAGE_DIR}" in
            *..*|/*|*' '*)
              echo "package_dir must be a plain relative path" >&2
              exit 1
              ;;
          esac
          if [[ -z "$(git ls-files -- "${PACKAGE_DIR}")" ]]; then
            echo "package_dir is not tracked at this commit" >&2
            exit 1
          fi

      - name: Validate the tracked package
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          set -euo pipefail
          uv run python -m legalforecast.multiharness.container_harness.intake \
            validate --package-dir "${PACKAGE_DIR}"

      - name: Stage the validated package
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          set -euo pipefail
          uv run python -m legalforecast.multiharness.container_harness.intake \
            publish --package-dir "${PACKAGE_DIR}" --destination "${RUNNER_TEMP}/validated-package"

      - name: Upload the validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: harness-lane-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/validated-package
          if-no-files-found: error
