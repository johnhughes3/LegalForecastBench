name: Export published site data

on:
  workflow_run:
    workflows: ['Protected Labels Fan In']
    types: [completed]
    branches: [main]

# This workflow consumes only the explicit published source artifact. It cannot
# read protected storage, deploy a site, or execute code from the downloaded data.
permissions:
  actions: read
  contents: read

concurrency:
  group: site-export-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  export:
    name: Export published benchmark data
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.path == '.github/workflows/fan-in-publish.yaml' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    steps:
      - name: Find the published source artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          expected="site-source-${SOURCE_RUN_ID}-${SOURCE_ATTEMPT}"
          gh api --paginate \
            "repos/${SOURCE_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | [.name, .expired] | @tsv' > /tmp/site-artifacts.tsv
          found=false
          while IFS=$'\t' read -r name expired; do
            if [[ "$name" == "$expected" ]]; then
              [[ "$found" == false && "$expired" == false ]] || {
                echo 'Published site source is duplicated or expired' >&2
                exit 1
              }
              found=true
            fi
          done < /tmp/site-artifacts.tsv
          printf 'found=%s\n' "$found" >> "$GITHUB_OUTPUT"
          if [[ "$found" == false ]]; then
            echo 'No published site source: verification-only or pre-site publication. No export produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out current trusted main revision
        if: ${{ steps.source.outputs.found == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run github.sha is the default-branch revision, never the
          # originating workflow's historical runtime or an artifact checkout.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download published source data
        if: ${{ steps.source.outputs.found == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-source-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/lfb-site-source
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install uv
        if: ${{ steps.source.outputs.found == 'true' }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Export public frontend data
        if: ${{ steps.source.outputs.found == 'true' }}
        run: |
          uv sync --locked
          uv run legalforecast site export \
            --scores /tmp/lfb-site-source/scores.json \
            --model-registry /tmp/lfb-site-source/model-registry.json \
            --report /tmp/lfb-site-source/report.json \
            --output /tmp/lfb-site/site-export.json

      - name: Upload site data bundle
        if: ${{ steps.source.outputs.found == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: site-export-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: /tmp/lfb-site/site-export.json
          if-no-files-found: error
          retention-days: 90
