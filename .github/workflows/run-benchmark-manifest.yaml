name: Run Benchmark from Locked Manifest

on:
  workflow_dispatch:
    inputs:
      manifest_uri:
        description: Locked public benchmark-run manifest URI or checked-out JSON path.
        required: true
        type: string
      forecast_release_uri:
        description: Outcome-blinded forecast-release.json URI or checked-out path.
        required: true
        type: string
      labels_release_uri:
        description: Separate labels-release.json URI or checked-out path for fan-in.
        required: true
        type: string
      artifact_root_uri:
        description: URI or path containing the forecast release's public artifacts.
        required: true
        type: string
      model_registry_uri:
        description: Frozen public model registry URI or checked-out JSON path.
        required: true
        type: string
      model_key:
        description: One provider:model_id key from the frozen model registry.
        required: true
        type: string
      ceiling_microusd:
        description: Positive run ceiling in millionths of one US dollar.
        required: true
        type: string
      account:
        description: Stable provider-account identity for this run ledger.
        required: false
        default: default
        type: string
      artifact_retention_days:
        description: Retention for public workflow artifacts.
        required: false
        default: "14"
        type: string

permissions:
  contents: read

jobs:
  prepare-inputs:
    name: Validate locked manifest and releases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: legalforecastbench-official-eval
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
      LFB_GITHUB_PACKET_READ_ROLE_ARN: ${{ vars.LFB_GITHUB_PACKET_READ_ROLE_ARN }}
    steps:
      - name: Checkout trusted release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true

      - name: Configure read-only object storage access
        if: ${{ startsWith(inputs.manifest_uri, 's3://') || startsWith(inputs.forecast_release_uri, 's3://') || startsWith(inputs.labels_release_uri, 's3://') || startsWith(inputs.artifact_root_uri, 's3://') || startsWith(inputs.model_registry_uri, 's3://') }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lfb-locked-manifest-${{ github.run_id }}
          role-to-assume: ${{ env.LFB_GITHUB_PACKET_READ_ROLE_ARN }}

      - name: Download public release inputs
        shell: bash
        env:
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          FORECAST_RELEASE_URI: ${{ inputs.forecast_release_uri }}
          LABELS_RELEASE_URI: ${{ inputs.labels_release_uri }}
          ARTIFACT_ROOT_URI: ${{ inputs.artifact_root_uri }}
          MODEL_REGISTRY_URI: ${{ inputs.model_registry_uri }}
        run: |
          set -euo pipefail
          root=/tmp/lfb-locked-inputs
          mkdir -p "${root}/artifacts"
          fetch_file() {
            local uri="$1" destination="$2"
            case "${uri}" in
              s3://*) aws s3 cp "${uri}" "${destination}" --only-show-errors ;;
              manifests/*)
                [[ -n "${LFB_RESULTS_BUCKET:-}" ]] || { echo "LFB_RESULTS_BUCKET is required for manifests/ inputs." >&2; exit 1; }
                aws s3 cp "s3://${LFB_RESULTS_BUCKET}/${uri}" "${destination}" --only-show-errors ;;
              *) cp -- "${uri}" "${destination}" ;;
            esac
          }
          fetch_tree() {
            local uri="$1" destination="$2"
            case "${uri}" in
              s3://*) mkdir -p "${destination}"; aws s3 sync "${uri%/}/" "${destination}/" --only-show-errors ;;
              manifests/*)
                [[ -n "${LFB_RESULTS_BUCKET:-}" ]] || { echo "LFB_RESULTS_BUCKET is required for manifests/ inputs." >&2; exit 1; }
                mkdir -p "${destination}"; aws s3 sync "s3://${LFB_RESULTS_BUCKET}/${uri%/}/" "${destination}/" --only-show-errors ;;
              *) cp -a -- "${uri%/}/." "${destination}/" ;;
            esac
          }
          fetch_file "${MANIFEST_URI}" "${root}/run-manifest.json"
          fetch_file "${FORECAST_RELEASE_URI}" "${root}/forecast-release.json"
          fetch_file "${LABELS_RELEASE_URI}" "${root}/labels-release.json"
          fetch_file "${MODEL_REGISTRY_URI}" "${root}/model-registry.json"
          fetch_tree "${ARTIFACT_ROOT_URI}" "${root}/artifacts"
          [[ -s "${root}/run-manifest.json" && -s "${root}/forecast-release.json" && -s "${root}/labels-release.json" ]] || {
            echo "locked manifest and both release files are required" >&2
            exit 1
          }

      - name: Validate public contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run legalforecast manifest validate \
            --manifest /tmp/lfb-locked-inputs/run-manifest.json \
            --forecast /tmp/lfb-locked-inputs/forecast-release.json \
            --labels /tmp/lfb-locked-inputs/labels-release.json \
            --artifact-root /tmp/lfb-locked-inputs/artifacts

      - name: Upload outcome-blinded forecast inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-manifest-forecast-inputs-${{ github.run_id }}
          path: |
            /tmp/lfb-locked-inputs/run-manifest.json
            /tmp/lfb-locked-inputs/forecast-release.json
            /tmp/lfb-locked-inputs/model-registry.json
            /tmp/lfb-locked-inputs/artifacts
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload labels only for fan-in
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-manifest-labels-${{ github.run_id }}
          path: /tmp/lfb-locked-inputs/labels-release.json
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  run-forecast:
    name: Outcome-blinded forecast worker
    needs: prepare-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: legalforecastbench-official-eval
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout trusted release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true

      - name: Download outcome-blinded forecast inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: locked-manifest-forecast-inputs-${{ github.run_id }}
          path: /tmp/lfb-forecast-inputs

      - name: Execute forecast run
        shell: bash
        env:
          MODEL_KEY: ${{ inputs.model_key }}
          ACCOUNT: ${{ inputs.account }}
          CEILING_MICROUSD: ${{ inputs.ceiling_microusd }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lfb-run
          uv run legalforecast run execute \
            --manifest /tmp/lfb-forecast-inputs/run-manifest.json \
            --forecast /tmp/lfb-forecast-inputs/forecast-release.json \
            --artifact-root /tmp/lfb-forecast-inputs/artifacts \
            --model-registry /tmp/lfb-forecast-inputs/model-registry.json \
            --model-key "${MODEL_KEY}" \
            --ledger /tmp/lfb-run/ledger.sqlite3 \
            --receipts-dir /tmp/lfb-run/receipts \
            --ceiling-microusd "${CEILING_MICROUSD}" \
            --approval-reference "workflow-run-${GITHUB_RUN_ID}" \
            --account "${ACCOUNT}"

      - name: Upload public run receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-manifest-run-receipts-${{ github.run_id }}
          path: /tmp/lfb-run/receipts
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  score-and-report:
    name: Score and report at fan-in
    needs: run-forecast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: legalforecastbench-official-eval-fan-in
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true

      - name: Download forecast inputs and receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: locked-manifest-*
          path: /tmp/lfb-fan-in
          merge-multiple: false

      - name: Project public receipts for scoring
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["GITHUB_RUN_ID"]
          source = Path(f"/tmp/lfb-fan-in/locked-manifest-run-receipts-{run_id}")
          output = Path("/tmp/lfb-fan-in/run-records.jsonl")
          records = []
          for path in sorted(source.glob("*.json")):
              receipt = json.loads(path.read_text(encoding="utf-8"))
              records.append(
                  {
                      "case_id": receipt["case_id"],
                      "model_id": receipt["model_key"],
                      "required_unit_ids": [receipt["unit_id"]],
                      "parser_output": receipt["parser_output"],
                      "ablation": receipt["ablation"],
                  }
              )
          if not records:
              raise SystemExit("forecast worker produced no receipts")
          output.write_text(
              "".join(json.dumps(record, sort_keys=True) + "\n" for record in records),
              encoding="utf-8",
          )
          PY

      - name: Score against labels release
        shell: bash
        run: |
          set -euo pipefail
          input=/tmp/lfb-fan-in/locked-manifest-forecast-inputs-${GITHUB_RUN_ID}
          labels=/tmp/lfb-fan-in/locked-manifest-labels-${GITHUB_RUN_ID}/labels-release.json
          uv run legalforecast score \
            --runs /tmp/lfb-fan-in/run-records.jsonl \
            --labels-release "${labels}" \
            --forecast-release "${input}/forecast-release.json" \
            --artifact-root "${input}/artifacts" \
            --manifest "${input}/run-manifest.json" \
            --output /tmp/lfb-fan-in/scores.json

      - name: Render report
        shell: bash
        run: |
          set -euo pipefail
          input=/tmp/lfb-fan-in/locked-manifest-forecast-inputs-${GITHUB_RUN_ID}
          labels=/tmp/lfb-fan-in/locked-manifest-labels-${GITHUB_RUN_ID}/labels-release.json
          uv run legalforecast report \
            --scores /tmp/lfb-fan-in/scores.json \
            --output-dir /tmp/lfb-fan-in/report \
            --labels-release "${labels}" \
            --forecast-release "${input}/forecast-release.json" \
            --artifact-root "${input}/artifacts" \
            --manifest "${input}/run-manifest.json"

      - name: Upload score and report artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: locked-manifest-score-report-${{ github.run_id }}
          path: |
            /tmp/lfb-fan-in/scores.json
            /tmp/lfb-fan-in/report
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
