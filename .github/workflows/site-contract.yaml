name: Site data contract

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'legalforecast/**'
      - 'docs/schemas/site-export-v1.schema.json'
      - 'docs/METHODS.md'
      - 'tests/test_site*'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site-contract.yaml'
  pull_request:
    paths:
      - 'site/**'
      - 'legalforecast/**'
      - 'docs/schemas/site-export-v1.schema.json'
      - 'docs/METHODS.md'
      - 'tests/test_site*'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site-contract.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Site contract and TypeScript
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Check Python exporter and cross-language fixture
        run: uv run pytest tests/test_site_export.py -q

      - name: Check generated JSON Schema
        run: |
          uv run legalforecast site schema --output /tmp/site-export-v1.schema.json
          diff -u docs/schemas/site-export-v1.schema.json /tmp/site-export-v1.schema.json

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install site contract dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.27.0 --activate
          pnpm install --frozen-lockfile

      - name: Validate contract, generated types, and TypeScript
        run: pnpm site:check

      - name: Build the static site
        run: pnpm site:build

      - name: Check responsive navigation
        run: |
          pnpm --filter @legalforecastbench/site exec playwright install --with-deps chromium
          pnpm --filter @legalforecastbench/site test:browser
