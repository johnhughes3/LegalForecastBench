name: Official provider-authority infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Separately reviewed infrastructure operation
        required: true
        type: choice
        options:
          - import
          - detach-external-storage-state
          - plan
          - apply
      module:
        description: Closed Terraform root
        required: true
        type: choice
        options:
          - provider-authority
          - official-labeling
          - official-eval
      release_sha:
        description: Exact trusted commit SHA on main
        required: true
        type: string
      import_address:
        description: Import only - exact reviewed Terraform address
        required: false
        default: ""
        type: string
      import_id_sha256:
        description: Import only - SHA-256 of the protected exact import ID
        required: false
        default: ""
        type: string
      import_authorization_sha256:
        description: Import only - separately reviewed exact-request commitment
        required: false
        default: ""
        type: string
      import_operator_role_identity_sha256:
        description: Import only - reviewed operator-role identity commitment
        required: false
        default: ""
        type: string
      import_state_backend_identity_sha256:
        description: Import only - reviewed remote-state identity commitment
        required: false
        default: ""
        type: string
      import_terraform_input_identity_sha256:
        description: Import only - reviewed Terraform-input identity commitment
        required: false
        default: ""
        type: string
      plan_run_id:
        description: Apply only - successful plan run ID
        required: false
        default: ""
        type: string
      plan_run_attempt:
        description: Apply only - exact plan run attempt
        required: false
        default: ""
        type: string
      plan_artifact_name:
        description: Apply only - canonical encrypted plan artifact
        required: false
        default: ""
        type: string
      plan_artifact_digest:
        description: Apply only - GitHub SHA-256 artifact digest
        required: false
        default: ""
        type: string
      plan_file_sha256:
        description: Apply only - reviewed plaintext plan SHA-256
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: official-provider-authority-infra
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate closed infrastructure request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      # This job reads /repos/{repo}/environments and its
      # deployment-branch-policies to prove the six required paid-labeling
      # environments exist with the expected protection rules.
      deployments: read
    outputs:
      module_root: ${{ steps.request.outputs.module_root }}
      state_key: ${{ steps.request.outputs.state_key }}
    steps:
      - name: Checkout exact main release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Validate exact release and operation inputs
        id: request
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
          OPERATION: ${{ inputs.operation }}
          IMPORT_ADDRESS: ${{ inputs.import_address }}
          IMPORT_AUTHORIZATION_SHA256: ${{ inputs.import_authorization_sha256 }}
          IMPORT_ID_SHA256: ${{ inputs.import_id_sha256 }}
          IMPORT_OPERATOR_ROLE_IDENTITY_SHA256: ${{ inputs.import_operator_role_identity_sha256 }}
          IMPORT_STATE_BACKEND_IDENTITY_SHA256: ${{ inputs.import_state_backend_identity_sha256 }}
          IMPORT_TERRAFORM_INPUT_IDENTITY_SHA256: ${{ inputs.import_terraform_input_identity_sha256 }}
          PLAN_ARTIFACT_DIGEST: ${{ inputs.plan_artifact_digest }}
          PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
          PLAN_FILE_SHA256: ${{ inputs.plan_file_sha256 }}
          PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] || [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provider-authority infrastructure operations must start on main." >&2
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${GITHUB_SHA}" ]] || [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "release_sha must equal the exact main commit that triggered this workflow." >&2
            exit 1
          fi
          case "${MODULE}" in
            provider-authority)
              module_root="infra/provider-authority"
              state_key="provider-authority/terraform.tfstate"
              ;;
            official-labeling)
              module_root="infra/official-labeling"
              state_key="official-labeling/terraform.tfstate"
              ;;
            official-eval)
              module_root="infra/official-eval"
              state_key="official-eval/terraform.tfstate"
              ;;
            *)
              echo "The Terraform module is outside the reviewed allowlist." >&2
              exit 1
              ;;
          esac
          plan_provenance="${PLAN_RUN_ID}${PLAN_RUN_ATTEMPT}${PLAN_ARTIFACT_NAME}${PLAN_ARTIFACT_DIGEST}${PLAN_FILE_SHA256}"
          import_provenance="${IMPORT_ADDRESS}${IMPORT_ID_SHA256}${IMPORT_AUTHORIZATION_SHA256}${IMPORT_OPERATOR_ROLE_IDENTITY_SHA256}${IMPORT_STATE_BACKEND_IDENTITY_SHA256}${IMPORT_TERRAFORM_INPUT_IDENTITY_SHA256}"
          if [[ "${OPERATION}" == "import" ]]; then
            [[ -z "${plan_provenance}" ]] || exit 1
            [[ -n "${IMPORT_ADDRESS}" ]] || exit 1
            [[ "${IMPORT_ID_SHA256}" =~ ^[0-9a-f]{64}$ ]] || exit 1
            [[ "${IMPORT_AUTHORIZATION_SHA256}" =~ ^[0-9a-f]{64}$ ]] || exit 1
            [[ "${IMPORT_OPERATOR_ROLE_IDENTITY_SHA256}" =~ ^[0-9a-f]{64}$ ]] || exit 1
            [[ "${IMPORT_STATE_BACKEND_IDENTITY_SHA256}" =~ ^[0-9a-f]{64}$ ]] || exit 1
            [[ "${IMPORT_TERRAFORM_INPUT_IDENTITY_SHA256}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          elif [[ "${OPERATION}" == "detach-external-storage-state" ]]; then
            [[ "${MODULE}" == "official-eval" ]] || {
              echo "External-storage state detachment is limited to official-eval." >&2
              exit 1
            }
            if [[ -n "${plan_provenance}${import_provenance}" ]]; then
              echo "State-detachment provenance inputs must remain empty." >&2
              exit 1
            fi
          elif [[ "${OPERATION}" == "plan" ]]; then
            if [[ -n "${plan_provenance}${import_provenance}" ]]; then
              echo "Plan provenance inputs must remain empty for a new plan." >&2
              exit 1
            fi
          elif [[ "${OPERATION}" == "apply" ]]; then
            [[ -z "${import_provenance}" ]] || exit 1
            [[ "${PLAN_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "${PLAN_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]] || exit 1
            expected_name="provider-authority-infra-plan-${MODULE}-${PLAN_RUN_ID}-${PLAN_RUN_ATTEMPT}"
            [[ "${PLAN_ARTIFACT_NAME}" == "${expected_name}" ]] || exit 1
            [[ "${PLAN_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            [[ "${PLAN_FILE_SHA256}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          else
            exit 1
          fi
          {
            echo "module_root=${module_root}"
            echo "state_key=${state_key}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prove infrastructure environment already exists and is protected
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_name="legalforecastbench-official-provider-authority-infra"
          environment_json="$(
            gh api "/repos/${GITHUB_REPOSITORY}/environments/${environment_name}"
          )" || {
            echo "The protected infrastructure environment is absent or unreadable; dispatch cannot create it." >&2
            exit 1
          }
          jq -e --arg name "${environment_name}" '
            .name == $name and
            .deployment_branch_policy == {
              protected_branches:false,
              custom_branch_policies:true
            } and
            ([.protection_rules[] | select(
              .type == "required_reviewers" and
              .prevent_self_review == false and
              ([.reviewers[].reviewer.login] == ["johnjhughes"])
            )] | length) == 1
          ' <<<"${environment_json}" >/dev/null
          branch_policies="$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/environments/${environment_name}/deployment-branch-policies?per_page=100"
          )"
          jq -s -e '
            ([.[].branch_policies[]] | length) == 1 and
            ([.[].branch_policies[].name] == ["main"])
          ' <<<"${branch_policies}" >/dev/null

  operate:
    name: ${{ inputs.operation }} ${{ inputs.module }}
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: legalforecastbench-official-provider-authority-infra
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AGE_ROOT: ${{ github.workspace }}/.provider-authority-infra-tools
      ARTIFACT_ROOT: ${{ github.workspace }}/.lfb-encrypted-infra-plan
      # No default: the state bucket and KMS key are region-bound externally
      # bootstrapped resources, so silently falling back to a region would
      # break the fail-closed bootstrap contract below.
      AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_INFRA_OPERATOR_ROLE_ARN: ${{ vars.LFB_INFRA_OPERATOR_ROLE_ARN }}
      LFB_INFRA_PLAN_AGE_RECIPIENT: ${{ vars.LFB_INFRA_PLAN_AGE_RECIPIENT }}
      LFB_TERRAFORM_STATE_BUCKET: ${{ vars.LFB_TERRAFORM_STATE_BUCKET }}
      LFB_TERRAFORM_STATE_KEY_PREFIX: ${{ vars.LFB_TERRAFORM_STATE_KEY_PREFIX }}
      LFB_TERRAFORM_STATE_KMS_KEY_ID: ${{ vars.LFB_TERRAFORM_STATE_KMS_KEY_ID }}
      MODULE: ${{ inputs.module }}
      MODULE_ROOT: ${{ needs.validate-request.outputs.module_root }}
      OPERATION: ${{ inputs.operation }}
      IMPORT_ADDRESS: ${{ inputs.import_address }}
      IMPORT_AUTHORIZATION_SHA256: ${{ inputs.import_authorization_sha256 }}
      IMPORT_ID_SHA256: ${{ inputs.import_id_sha256 }}
      IMPORT_OPERATOR_ROLE_IDENTITY_SHA256: ${{ inputs.import_operator_role_identity_sha256 }}
      IMPORT_STATE_BACKEND_IDENTITY_SHA256: ${{ inputs.import_state_backend_identity_sha256 }}
      IMPORT_TERRAFORM_INPUT_IDENTITY_SHA256: ${{ inputs.import_terraform_input_identity_sha256 }}
      OUTPUT_ROOT: ${{ github.workspace }}/official-infra-output
      PLAN_FILE: ${{ github.workspace }}/.official-infra.tfplan
      RELEASE_SHA: ${{ inputs.release_sha }}
      STATE_KEY_SUFFIX: ${{ needs.validate-request.outputs.state_key }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.LFB_AWS_REGION }}
      TF_VAR_artifacts_kms_key_arn: ${{ vars.LFB_ARTIFACTS_KMS_KEY_ARN }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.LFB_GITHUB_OIDC_PROVIDER_ARN }}
      TF_VAR_packet_bucket_name: ${{ vars.LFB_PACKET_BUCKET }}
      TF_VAR_provider_authority_resource_identity_sha256: ${{ vars.LFB_PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256 }}
      TF_VAR_provider_authority_table_arn: ${{ vars.LFB_PROVIDER_AUTHORITY_TABLE_ARN }}
      TF_VAR_results_bucket_name: ${{ vars.LFB_RESULTS_BUCKET }}
    steps:
      - name: Checkout exact main release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Validate external bootstrap values
        shell: bash
        run: |
          set -euo pipefail
          required=(
            LFB_AWS_REGION
            LFB_INFRA_OPERATOR_ROLE_ARN
            LFB_TERRAFORM_STATE_BUCKET
            LFB_TERRAFORM_STATE_KEY_PREFIX
            LFB_TERRAFORM_STATE_KMS_KEY_ID
          )
          if [[ "${OPERATION}" == "plan" || "${OPERATION}" == "apply" ]]; then
            required+=(LFB_INFRA_PLAN_AGE_RECIPIENT)
          fi
          if [[ "${MODULE}" == "official-labeling" || "${MODULE}" == "official-eval" ]]; then
            required+=(
              TF_VAR_github_oidc_provider_arn
              TF_VAR_provider_authority_resource_identity_sha256
              TF_VAR_provider_authority_table_arn
            )
          fi
          if [[ "${MODULE}" == "official-eval" ]]; then
            required+=(
              TF_VAR_artifacts_kms_key_arn
              TF_VAR_packet_bucket_name
              TF_VAR_results_bucket_name
            )
          fi
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "Missing externally bootstrapped value: ${name}" >&2
              exit 1
            }
          done
          [[ "${LFB_INFRA_OPERATOR_ROLE_ARN}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+ ]] || exit 1
          [[ "${LFB_TERRAFORM_STATE_BUCKET}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || exit 1
          if [[ ! "${LFB_TERRAFORM_STATE_KEY_PREFIX}" =~ ^[A-Za-z0-9._/-]+$ ]] ||
            [[ "${LFB_TERRAFORM_STATE_KEY_PREFIX}" == /* ]] ||
            [[ "/${LFB_TERRAFORM_STATE_KEY_PREFIX}/" == *"/../"* ]]; then
            exit 1
          fi
          if [[ "${OPERATION}" != "import" ]] &&
            [[ ! "${LFB_INFRA_PLAN_AGE_RECIPIENT}" =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]; then
            exit 1
          fi
          if [[ ! "${LFB_TERRAFORM_STATE_KMS_KEY_ID}" =~ ^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-fA-F-]{36}$ ]]; then
            echo "The state backend requires one immutable KMS key ARN, not an alias." >&2
            exit 1
          fi
          operator_partition="$(cut -d: -f2 <<<"${LFB_INFRA_OPERATOR_ROLE_ARN}")"
          operator_account="$(cut -d: -f5 <<<"${LFB_INFRA_OPERATOR_ROLE_ARN}")"
          kms_partition="$(cut -d: -f2 <<<"${LFB_TERRAFORM_STATE_KMS_KEY_ID}")"
          kms_region="$(cut -d: -f4 <<<"${LFB_TERRAFORM_STATE_KMS_KEY_ID}")"
          kms_account="$(cut -d: -f5 <<<"${LFB_TERRAFORM_STATE_KMS_KEY_ID}")"
          [[ "${kms_partition}" == "${operator_partition}" ]] || exit 1
          [[ "${kms_region}" == "${AWS_REGION}" ]] || exit 1
          [[ "${kms_account}" == "${operator_account}" ]] || exit 1
          state_key="${LFB_TERRAFORM_STATE_KEY_PREFIX%/}/${STATE_KEY_SUFFIX}"
          operator_role_identity_sha256="$(
            jq -cn --arg role "${LFB_INFRA_OPERATOR_ROLE_ARN}" '{role:$role}' |
              sha256sum | cut -d' ' -f1
          )"
          state_backend_identity_sha256="$(
            jq -cn --arg bucket "${LFB_TERRAFORM_STATE_BUCKET}" \
              --arg key "${state_key}" --arg region "${AWS_REGION}" \
              --arg kms_key "${LFB_TERRAFORM_STATE_KMS_KEY_ID}" \
              '{bucket:$bucket,key:$key,region:$region,kms_key:$kms_key}' |
              sha256sum | cut -d' ' -f1
          )"
          case "${MODULE}" in
            official-eval)
              terraform_input_identity_sha256="$(
                jq -cn --arg module "${MODULE}" --arg region "${TF_VAR_aws_region}" \
                  --arg oidc "${TF_VAR_github_oidc_provider_arn}" \
                  --arg artifacts_kms_key "${TF_VAR_artifacts_kms_key_arn}" \
                  --arg identity "${TF_VAR_provider_authority_resource_identity_sha256}" \
                  --arg packet_bucket "${TF_VAR_packet_bucket_name}" \
                  --arg results_bucket "${TF_VAR_results_bucket_name}" \
                  --arg table "${TF_VAR_provider_authority_table_arn}" \
                  '{module:$module,region:$region,oidc:$oidc,
                    artifacts_kms_key:$artifacts_kms_key,identity:$identity,
                    packet_bucket:$packet_bucket,results_bucket:$results_bucket,
                    table:$table}' |
                  sha256sum | cut -d' ' -f1
              )"
              ;;
            official-labeling)
              terraform_input_identity_sha256="$(
                jq -cn --arg module "${MODULE}" --arg region "${TF_VAR_aws_region}" \
                  --arg oidc "${TF_VAR_github_oidc_provider_arn}" \
                  --arg identity "${TF_VAR_provider_authority_resource_identity_sha256}" \
                  --arg table "${TF_VAR_provider_authority_table_arn}" \
                  '{module:$module,region:$region,oidc:$oidc,identity:$identity,table:$table}' |
                  sha256sum | cut -d' ' -f1
              )"
              ;;
            provider-authority)
              terraform_input_identity_sha256="$(
                jq -cn --arg module "${MODULE}" --arg region "${TF_VAR_aws_region}" \
                  '{module:$module,region:$region}' |
                  sha256sum | cut -d' ' -f1
              )"
              ;;
            *)
              echo "The Terraform module is outside the reviewed identity contract." >&2
              exit 1
              ;;
          esac
          age_recipient_identity_sha256="$(
            printf '%s' "${LFB_INFRA_PLAN_AGE_RECIPIENT}" | sha256sum | cut -d' ' -f1
          )"
          {
            echo "AGE_RECIPIENT_IDENTITY_SHA256=${age_recipient_identity_sha256}"
            echo "OPERATOR_ROLE_IDENTITY_SHA256=${operator_role_identity_sha256}"
            echo "STATE_BACKEND_IDENTITY_SHA256=${state_backend_identity_sha256}"
            echo "TERRAFORM_INPUT_IDENTITY_SHA256=${terraform_input_identity_sha256}"
          } >> "${GITHUB_ENV}"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Install pinned age
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AGE_ROOT}"
          curl --fail --silent --show-error --location \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output "${AGE_ROOT}/age.tar.gz"
          printf '%s  %s\n' \
            bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 \
            "${AGE_ROOT}/age.tar.gz" | sha256sum --check --strict
          tar -xzf "${AGE_ROOT}/age.tar.gz" \
            --strip-components=1 --directory "${AGE_ROOT}" age/age
          chmod 0755 "${AGE_ROOT}/age"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true

      - name: Sync Python package for infrastructure contracts
        run: uv sync --locked

      - name: Authenticate exact successful plan artifact
        if: inputs.operation == 'apply'
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.plan_artifact_digest }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          EXPECTED_RUN_ID: ${{ inputs.plan_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}/attempts/${EXPECTED_RUN_ATTEMPT}")"
          jq -e \
            --arg release_sha "${RELEASE_SHA}" \
            --argjson attempt "${EXPECTED_RUN_ATTEMPT}" '
              .path == ".github/workflows/official-provider-authority-infra.yaml" and
              .event == "workflow_dispatch" and .head_branch == "main" and
              .head_sha == $release_sha and .run_attempt == $attempt and
              .status == "completed" and .conclusion == "success"
            ' <<<"${run_json}" >/dev/null
          artifacts_json="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}/artifacts?per_page=100")"
          jq -s -e \
            --arg name "${EXPECTED_ARTIFACT_NAME}" \
            --arg digest "${EXPECTED_ARTIFACT_DIGEST}" '
              ([.[].artifacts[] | select(
                .name == $name and .expired == false and .digest == $digest
              )] | length) == 1
            ' <<<"${artifacts_json}" >/dev/null

      - name: Download exact encrypted plan
        if: inputs.operation == 'apply'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ env.ARTIFACT_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Decrypt and verify reviewed plan
        if: inputs.operation == 'apply'
        shell: bash
        env:
          EXPECTED_PLAN_SHA256: ${{ inputs.plan_file_sha256 }}
          LFB_INFRA_PLAN_AGE_IDENTITY: ${{ secrets.LFB_INFRA_PLAN_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          mapfile -t names < <(find "${ARTIFACT_ROOT}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${names[*]}" == "plan-receipt.json provider-authority.tfplan.age" ]] || exit 1
          if find "${ARTIFACT_ROOT}" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            exit 1
          fi
          jq -e \
            --arg age_recipient_identity_sha256 "${AGE_RECIPIENT_IDENTITY_SHA256}" \
            --arg module "${MODULE}" \
            --arg operator_role_identity_sha256 "${OPERATOR_ROLE_IDENTITY_SHA256}" \
            --arg plan_sha256 "${EXPECTED_PLAN_SHA256}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg state_backend_identity_sha256 "${STATE_BACKEND_IDENTITY_SHA256}" \
            --arg terraform_input_identity_sha256 "${TERRAFORM_INPUT_IDENTITY_SHA256}" '
              .schema_version == "legalforecast.provider_authority_infra_plan_receipt.v1" and
              .module == $module and .release_sha == $release_sha and
              .age_recipient_identity_sha256 == $age_recipient_identity_sha256 and
              .plan_file_sha256 == $plan_sha256 and
              .operator_role_identity_sha256 == $operator_role_identity_sha256 and
              .state_backend_identity_sha256 == $state_backend_identity_sha256 and
              .terraform_input_identity_sha256 == $terraform_input_identity_sha256
            ' "${ARTIFACT_ROOT}/plan-receipt.json" >/dev/null
          identity_file="${RUNNER_TEMP}/lfb-infra-plan-identity.txt"
          umask 077
          trap 'shred --force --iterations=1 --zero --remove "${identity_file}" 2>/dev/null || true' EXIT
          printf '%s\n' "${LFB_INFRA_PLAN_AGE_IDENTITY:?missing plan identity}" > "${identity_file}"
          "${AGE_ROOT}/age" --decrypt --identity "${identity_file}" \
            --output "${PLAN_FILE}" \
            "${ARTIFACT_ROOT}/provider-authority.tfplan.age"
          printf '%s  %s\n' "${EXPECTED_PLAN_SHA256}" "${PLAN_FILE}" \
            | sha256sum --check --strict

      - name: Prove release is still current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "${current_main_sha}" == "${RELEASE_SHA}" ]] || {
            echo "main advanced after dispatch or protected approval; refusing stale infrastructure authority." >&2
            exit 1
          }

      - name: Configure externally bootstrapped AWS authority
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: lfb-infra-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ env.LFB_INFRA_OPERATOR_ROLE_ARN }}

      - name: Resolve separately authorized import binding
        if: inputs.operation == 'import'
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/official_infra_contract.py resolve-import \
            --module "${MODULE}" \
            --address "${IMPORT_ADDRESS}" \
            --release-sha "${RELEASE_SHA}" \
            --import-id-sha256 "${IMPORT_ID_SHA256}" \
            --authorization-sha256 "${IMPORT_AUTHORIZATION_SHA256}" \
            --operator-role-identity-sha256 "${IMPORT_OPERATOR_ROLE_IDENTITY_SHA256}" \
            --state-backend-identity-sha256 "${IMPORT_STATE_BACKEND_IDENTITY_SHA256}" \
            --terraform-input-identity-sha256 "${IMPORT_TERRAFORM_INPUT_IDENTITY_SHA256}" \
            --import-id-file "${RUNNER_TEMP}/official-infra-import-id"

      - name: Initialize protected remote state
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${MODULE}" != "official-eval" ]]; then
            printf 'terraform {\n  backend "s3" {}\n}\n' > "${MODULE_ROOT}/backend.workflow.tf"
          fi
          state_key="${LFB_TERRAFORM_STATE_KEY_PREFIX%/}/${STATE_KEY_SUFFIX}"
          if ! terraform -chdir="${MODULE_ROOT}" init \
            -input=false -reconfigure \
            -backend-config="bucket=${LFB_TERRAFORM_STATE_BUCKET}" \
            -backend-config="key=${state_key}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${LFB_TERRAFORM_STATE_KMS_KEY_ID}" \
            -backend-config="use_lockfile=true" \
            > "${RUNNER_TEMP}/provider-authority-init.log" 2>&1; then
            echo "Terraform initialization failed; protected diagnostics were not published." >&2
            exit 1
          fi

      - name: Import and verify exact remote-state binding
        id: import
        if: inputs.operation == 'import'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "${current_main_sha}" == "${RELEASE_SHA}" ]] || exit 1
          IFS= read -r LFB_IMPORT_ID < "${RUNNER_TEMP}/official-infra-import-id"
          export LFB_IMPORT_ID
          echo "::add-mask::${LFB_IMPORT_ID}"
          before_state="${RUNNER_TEMP}/official-infra-state-before.json"
          after_state="${RUNNER_TEMP}/official-infra-state-after.json"
          if ! terraform -chdir="${MODULE_ROOT}" show -json \
            > "${before_state}" 2> "${RUNNER_TEMP}/official-infra-state-before.log"; then
            echo "Terraform state inspection failed; protected diagnostics were not published." >&2
            exit 1
          fi
          before_state_sha256="$(sha256sum "${before_state}" | cut -d' ' -f1)"
          uv run python scripts/official_infra_contract.py state-binding \
            --state-json "${before_state}" \
            --address "${IMPORT_ADDRESS}" \
            --github-output "${GITHUB_OUTPUT}"
          binding="$(awk -F= '$1 == "binding" {print $2}' "${GITHUB_OUTPUT}" | tail -n1)"
          if [[ "${binding}" == "absent" ]]; then
            current_main_sha="$(
              gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
            )"
            [[ "${current_main_sha}" == "${RELEASE_SHA}" ]] || exit 1
            mkdir -p "${OUTPUT_ROOT}"
            jq -cn \
              --arg address "${IMPORT_ADDRESS}" \
              --arg authorization_sha256 "${IMPORT_AUTHORIZATION_SHA256}" \
              --arg before_state_sha256 "${before_state_sha256}" \
              --arg import_id_sha256 "${IMPORT_ID_SHA256}" \
              --arg module "${MODULE}" \
              --arg operator_role_identity_sha256 "${OPERATOR_ROLE_IDENTITY_SHA256}" \
              --arg release_sha "${RELEASE_SHA}" \
              --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg state_backend_identity_sha256 "${STATE_BACKEND_IDENTITY_SHA256}" \
              --arg terraform_input_identity_sha256 "${TERRAFORM_INPUT_IDENTITY_SHA256}" '{
                schema_version:"legalforecast.provider_authority_infra_import_recovery_receipt.v1",
                status:"authorized_pending_import",
                module:$module,
                release_sha:$release_sha,
                run_id:$run_id,
                run_attempt:$run_attempt,
                import_address:$address,
                import_id_sha256:$import_id_sha256,
                import_authorization_sha256:$authorization_sha256,
                before_state_sha256:$before_state_sha256,
                operator_role_identity_sha256:$operator_role_identity_sha256,
                state_backend_identity_sha256:$state_backend_identity_sha256,
                terraform_input_identity_sha256:$terraform_input_identity_sha256
              }' > "${OUTPUT_ROOT}/import-recovery-receipt.json"
            echo "mutation_succeeded=true" >> "${GITHUB_OUTPUT}"
            if ! terraform -chdir="${MODULE_ROOT}" import -input=false \
              "${IMPORT_ADDRESS}" "${LFB_IMPORT_ID}" \
              > "${RUNNER_TEMP}/official-infra-import.log" 2>&1; then
              echo "Terraform import failed; protected diagnostics were not published." >&2
              exit 1
            fi
            import_result="imported"
          elif [[ "${binding}" == "already_present" ]]; then
            import_result="already_present"
          else
            exit 1
          fi
          if ! terraform -chdir="${MODULE_ROOT}" show -json \
            > "${after_state}" 2> "${RUNNER_TEMP}/official-infra-state-after.log"; then
            echo "Terraform state verification failed; protected diagnostics were not published." >&2
            exit 1
          fi
          uv run python scripts/official_infra_contract.py state-binding \
            --state-json "${after_state}" \
            --address "${IMPORT_ADDRESS}" \
            --require-present \
            --github-output "${GITHUB_OUTPUT}"
          after_state_sha256="$(sha256sum "${after_state}" | cut -d' ' -f1)"
          mkdir -p "${OUTPUT_ROOT}"
          jq -cn \
            --arg address "${IMPORT_ADDRESS}" \
            --arg after_state_sha256 "${after_state_sha256}" \
            --arg authorization_sha256 "${IMPORT_AUTHORIZATION_SHA256}" \
            --arg before_state_sha256 "${before_state_sha256}" \
            --arg import_id_sha256 "${IMPORT_ID_SHA256}" \
            --arg module "${MODULE}" \
            --arg operator_role_identity_sha256 "${OPERATOR_ROLE_IDENTITY_SHA256}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg result "${import_result}" \
            --arg state_backend_identity_sha256 "${STATE_BACKEND_IDENTITY_SHA256}" \
            --arg terraform_input_identity_sha256 "${TERRAFORM_INPUT_IDENTITY_SHA256}" '{
              schema_version:"legalforecast.provider_authority_infra_import_receipt.v1",
              module:$module,
              release_sha:$release_sha,
              import_address:$address,
              import_id_sha256:$import_id_sha256,
              import_authorization_sha256:$authorization_sha256,
              result:$result,
              before_state_sha256:$before_state_sha256,
              after_state_sha256:$after_state_sha256,
              operator_role_identity_sha256:$operator_role_identity_sha256,
              state_backend_identity_sha256:$state_backend_identity_sha256,
            terraform_input_identity_sha256:$terraform_input_identity_sha256
          }' > "${OUTPUT_ROOT}/import-receipt.json"

      - name: Detach obsolete external-storage state bindings
        id: detach_storage_state
        if: inputs.operation == 'detach-external-storage-state'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "${current_main_sha}" == "${RELEASE_SHA}" ]] || exit 1

          before_state="${RUNNER_TEMP}/official-infra-state-before.tfstate"
          after_state="${RUNNER_TEMP}/official-infra-state-after.tfstate"
          before_addresses="${RUNNER_TEMP}/official-infra-state-before.addresses"
          after_addresses="${RUNNER_TEMP}/official-infra-state-after.addresses"
          expected_after_addresses="${RUNNER_TEMP}/official-infra-state-expected-after.addresses"
          obsolete_addresses="${RUNNER_TEMP}/official-infra-state-obsolete.addresses"
          remove_addresses="${RUNNER_TEMP}/official-infra-state-remove.addresses"

          cat > "${obsolete_addresses}" <<'EOF'
          aws_s3_bucket.packet
          aws_s3_bucket.results
          aws_s3_bucket_lifecycle_configuration.packet
          aws_s3_bucket_lifecycle_configuration.results
          aws_s3_bucket_ownership_controls.packet
          aws_s3_bucket_ownership_controls.results
          aws_s3_bucket_policy.packet
          aws_s3_bucket_policy.results
          aws_s3_bucket_public_access_block.packet
          aws_s3_bucket_public_access_block.results
          aws_s3_bucket_server_side_encryption_configuration.packet
          aws_s3_bucket_server_side_encryption_configuration.results
          aws_s3_bucket_versioning.packet
          aws_s3_bucket_versioning.results
          EOF
          sort -u -o "${obsolete_addresses}" "${obsolete_addresses}"

          terraform -chdir="${MODULE_ROOT}" state pull > "${before_state}"
          terraform -chdir="${MODULE_ROOT}" state list | sort -u > "${before_addresses}"
          before_state_sha256="$(sha256sum "${before_state}" | cut -d' ' -f1)"

          while IFS= read -r address; do
            if [[ "${address}" == aws_s3_* ]] &&
              ! grep -Fqx -- "${address}" "${obsolete_addresses}"; then
              echo "Remote state contains an unreviewed S3 address: ${address}" >&2
              exit 1
            fi
          done < "${before_addresses}"

          comm -12 "${before_addresses}" "${obsolete_addresses}" > "${remove_addresses}"
          comm -23 "${before_addresses}" "${remove_addresses}" > "${expected_after_addresses}"
          mapfile -t addresses_to_remove < "${remove_addresses}"

          mkdir -p "${OUTPUT_ROOT}"
          "${AGE_ROOT}/age" --encrypt \
            --recipient "${LFB_INFRA_PLAN_AGE_RECIPIENT}" \
            --output "${OUTPUT_ROOT}/official-eval-state-before.tfstate.age" \
            "${before_state}"
          encrypted_backup_sha256="$(
            sha256sum "${OUTPUT_ROOT}/official-eval-state-before.tfstate.age" | cut -d' ' -f1
          )"

          jq -cn \
            --arg before_state_sha256 "${before_state_sha256}" \
            --arg encrypted_backup_sha256 "${encrypted_backup_sha256}" \
            --arg module "${MODULE}" \
            --arg operator_role_identity_sha256 "${OPERATOR_ROLE_IDENTITY_SHA256}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg state_backend_identity_sha256 "${STATE_BACKEND_IDENTITY_SHA256}" \
            --arg terraform_input_identity_sha256 "${TERRAFORM_INPUT_IDENTITY_SHA256}" \
            --slurpfile removed <(jq -Rsc 'split("\n") | map(select(length > 0))' "${remove_addresses}") '{
              schema_version:"legalforecast.official_eval_external_storage_state_detach_recovery.v1",
              status:"backup_complete_pending_state_detach",
              module:$module,
              release_sha:$release_sha,
              run_id:$run_id,
              run_attempt:$run_attempt,
              before_state_sha256:$before_state_sha256,
              encrypted_backup_sha256:$encrypted_backup_sha256,
              removed_addresses:$removed[0],
              operator_role_identity_sha256:$operator_role_identity_sha256,
              state_backend_identity_sha256:$state_backend_identity_sha256,
              terraform_input_identity_sha256:$terraform_input_identity_sha256
            }' > "${OUTPUT_ROOT}/state-detach-recovery-receipt.json"

          detach_result="already_detached"
          if (( ${#addresses_to_remove[@]} > 0 )); then
            current_main_sha="$(
              gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
            )"
            [[ "${current_main_sha}" == "${RELEASE_SHA}" ]] || exit 1
            terraform -chdir="${MODULE_ROOT}" state rm "${addresses_to_remove[@]}" \
              > "${RUNNER_TEMP}/official-infra-state-detach.log" 2>&1
            echo "mutation_succeeded=true" >> "${GITHUB_OUTPUT}"
            detach_result="detached"
          fi

          terraform -chdir="${MODULE_ROOT}" state pull > "${after_state}"
          terraform -chdir="${MODULE_ROOT}" state list | sort -u > "${after_addresses}"
          cmp --silent "${expected_after_addresses}" "${after_addresses}" || {
            echo "Remote state changed outside the exact obsolete-address subtraction." >&2
            exit 1
          }
          if grep -Fxq -f "${obsolete_addresses}" "${after_addresses}"; then
            echo "An obsolete external-storage address remains in remote state." >&2
            exit 1
          fi
          after_state_sha256="$(sha256sum "${after_state}" | cut -d' ' -f1)"

          jq -cn \
            --arg after_state_sha256 "${after_state_sha256}" \
            --arg before_state_sha256 "${before_state_sha256}" \
            --arg encrypted_backup_sha256 "${encrypted_backup_sha256}" \
            --arg module "${MODULE}" \
            --arg operator_role_identity_sha256 "${OPERATOR_ROLE_IDENTITY_SHA256}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg result "${detach_result}" \
            --arg state_backend_identity_sha256 "${STATE_BACKEND_IDENTITY_SHA256}" \
            --arg terraform_input_identity_sha256 "${TERRAFORM_INPUT_IDENTITY_SHA256}" \
            --slurpfile removed <(jq -Rsc 'split("\n") | map(select(length > 0))' "${remove_addresses}") '{
              schema_version:"legalforecast.official_eval_external_storage_state_detach.v1",
              module:$module,
              release_sha:$release_sha,
              result:$result,
              before_state_sha256:$before_state_sha256,
              after_state_sha256:$after_state_sha256,
              encrypted_backup_sha256:$encrypted_backup_sha256,
              removed_addresses:$removed[0],
              operator_role_identity_sha256:$operator_role_identity_sha256,
              state_backend_identity_sha256:$state_backend_identity_sha256,
              terraform_input_identity_sha256:$terraform_input_identity_sha256
            }' > "${OUTPUT_ROOT}/state-detach-receipt.json"

      - name: Produce and guard exact Terraform plan
        id: plan
        if: inputs.operation == 'plan'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "${current_main_sha}" == "${RELEASE_SHA}" ]] || exit 1
          if ! terraform -chdir="${MODULE_ROOT}" validate \
            > "${RUNNER_TEMP}/official-infra-validate.log" 2>&1; then
            echo "Terraform validation failed; protected diagnostics were not published." >&2
            exit 1
          fi
          if ! terraform -chdir="${MODULE_ROOT}" plan -input=false -out="${PLAN_FILE}" \
            > "${RUNNER_TEMP}/provider-authority-plan.log" 2>&1; then
            echo "Terraform plan failed; protected diagnostics were not published." >&2
            exit 1
          fi
          if ! terraform -chdir="${MODULE_ROOT}" show -json "${PLAN_FILE}" \
            > "${RUNNER_TEMP}/provider-authority-plan.json" \
            2> "${RUNNER_TEMP}/official-infra-plan-render.log"; then
            echo "Terraform plan rendering failed; protected diagnostics were not published." >&2
            exit 1
          fi
          if ! uv run python scripts/official_infra_contract.py validate-plan \
            --module "${MODULE}" \
            --plan-json "${RUNNER_TEMP}/provider-authority-plan.json"; then
            echo "Unexpected Terraform resource address or destructive action." >&2
            exit 1
          fi
          plan_sha256="$(sha256sum "${PLAN_FILE}" | cut -d' ' -f1)"
          changes="$(jq -c '
            [.resource_changes[]? | select(.mode == "managed")
              | {address,actions:.change.actions}] | sort_by(.address)
          ' "${RUNNER_TEMP}/provider-authority-plan.json")"
          mkdir -p "${OUTPUT_ROOT}"
          jq -cn \
            --arg age_recipient_identity_sha256 "${AGE_RECIPIENT_IDENTITY_SHA256}" \
            --arg module "${MODULE}" \
            --arg operator_role_identity_sha256 "${OPERATOR_ROLE_IDENTITY_SHA256}" \
            --arg plan_sha256 "${plan_sha256}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg state_backend_identity_sha256 "${STATE_BACKEND_IDENTITY_SHA256}" \
            --arg terraform_input_identity_sha256 "${TERRAFORM_INPUT_IDENTITY_SHA256}" \
            --argjson changes "${changes}" '{
              schema_version:"legalforecast.provider_authority_infra_plan_receipt.v1",
              module:$module,
              release_sha:$release_sha,
              age_recipient_identity_sha256:$age_recipient_identity_sha256,
              plan_file_sha256:$plan_sha256,
              operator_role_identity_sha256:$operator_role_identity_sha256,
              state_backend_identity_sha256:$state_backend_identity_sha256,
              terraform_input_identity_sha256:$terraform_input_identity_sha256,
              resource_changes:$changes
            }' > "${OUTPUT_ROOT}/plan-receipt.json"
          "${AGE_ROOT}/age" --encrypt \
            --recipient "${LFB_INFRA_PLAN_AGE_RECIPIENT}" \
            --output "${OUTPUT_ROOT}/provider-authority.tfplan.age" \
            "${PLAN_FILE}"

      - name: Apply exact reviewed plan
        id: apply
        if: inputs.operation == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "${current_main_sha}" == "${RELEASE_SHA}" ]] || exit 1
          if ! terraform -chdir="${MODULE_ROOT}" apply -input=false -auto-approve \
            "${PLAN_FILE}" > "${RUNNER_TEMP}/provider-authority-apply.log" 2>&1; then
            echo "Terraform apply failed; protected diagnostics were not published." >&2
            exit 1
          fi
          mkdir -p "${OUTPUT_ROOT}"
          jq -cn \
            --arg age_recipient_identity_sha256 "${AGE_RECIPIENT_IDENTITY_SHA256}" \
            --arg artifact_digest "${{ inputs.plan_artifact_digest }}" \
            --arg artifact_name "${{ inputs.plan_artifact_name }}" \
            --arg module "${MODULE}" \
            --arg operator_role_identity_sha256 "${OPERATOR_ROLE_IDENTITY_SHA256}" \
            --arg plan_sha256 "${{ inputs.plan_file_sha256 }}" \
            --arg plan_run_attempt "${{ inputs.plan_run_attempt }}" \
            --arg plan_run_id "${{ inputs.plan_run_id }}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg state_backend_identity_sha256 "${STATE_BACKEND_IDENTITY_SHA256}" \
            --arg terraform_input_identity_sha256 "${TERRAFORM_INPUT_IDENTITY_SHA256}" '{
              schema_version:"legalforecast.provider_authority_infra_apply_recovery_receipt.v1",
              status:"applied_pending_output_handoff",
              module:$module,
              release_sha:$release_sha,
              run_id:$run_id,
              run_attempt:$run_attempt,
              age_recipient_identity_sha256:$age_recipient_identity_sha256,
              plan_file_sha256:$plan_sha256,
              plan_run_id:$plan_run_id,
              plan_run_attempt:$plan_run_attempt,
              plan_artifact_name:$artifact_name,
              plan_artifact_digest:$artifact_digest,
              operator_role_identity_sha256:$operator_role_identity_sha256,
              state_backend_identity_sha256:$state_backend_identity_sha256,
              terraform_input_identity_sha256:$terraform_input_identity_sha256
            }' > "${OUTPUT_ROOT}/apply-recovery-receipt.json"
          echo "mutation_succeeded=true" >> "${GITHUB_OUTPUT}"
          if ! terraform -chdir="${MODULE_ROOT}" output -json \
            > "${RUNNER_TEMP}/terraform-output.json" 2> "${RUNNER_TEMP}/official-infra-output.log"; then
            echo "Terraform output handoff failed; protected diagnostics were not published." >&2
            exit 1
          fi
          "${AGE_ROOT}/age" --encrypt \
            --recipient "${LFB_INFRA_PLAN_AGE_RECIPIENT}" \
            --output "${OUTPUT_ROOT}/terraform-output.json.age" \
            "${RUNNER_TEMP}/terraform-output.json"
          terraform_output_sha256="$(
            sha256sum "${RUNNER_TEMP}/terraform-output.json" | cut -d' ' -f1
          )"
          encrypted_output_sha256="$(
            sha256sum "${OUTPUT_ROOT}/terraform-output.json.age" | cut -d' ' -f1
          )"
          jq -cn \
            --arg age_recipient_identity_sha256 "${AGE_RECIPIENT_IDENTITY_SHA256}" \
            --arg artifact_digest "${{ inputs.plan_artifact_digest }}" \
            --arg artifact_name "${{ inputs.plan_artifact_name }}" \
            --arg encrypted_output_sha256 "${encrypted_output_sha256}" \
            --arg module "${MODULE}" \
            --arg operator_role_identity_sha256 "${OPERATOR_ROLE_IDENTITY_SHA256}" \
            --arg plan_sha256 "${{ inputs.plan_file_sha256 }}" \
            --arg plan_run_attempt "${{ inputs.plan_run_attempt }}" \
            --arg plan_run_id "${{ inputs.plan_run_id }}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg state_backend_identity_sha256 "${STATE_BACKEND_IDENTITY_SHA256}" \
            --arg terraform_output_sha256 "${terraform_output_sha256}" \
            --arg terraform_input_identity_sha256 "${TERRAFORM_INPUT_IDENTITY_SHA256}" '{
              schema_version:"legalforecast.provider_authority_infra_apply_receipt.v1",
              module:$module,
              release_sha:$release_sha,
              age_recipient_identity_sha256:$age_recipient_identity_sha256,
              plan_file_sha256:$plan_sha256,
              plan_run_id:$plan_run_id,
              plan_run_attempt:$plan_run_attempt,
              plan_artifact_name:$artifact_name,
              plan_artifact_digest:$artifact_digest,
              terraform_output_sha256:$terraform_output_sha256,
              encrypted_output_sha256:$encrypted_output_sha256,
              operator_role_identity_sha256:$operator_role_identity_sha256,
              state_backend_identity_sha256:$state_backend_identity_sha256,
              terraform_input_identity_sha256:$terraform_input_identity_sha256
            }' > "${OUTPUT_ROOT}/apply-receipt.json"

      - name: Clear plan plaintext and AWS credentials
        id: clear_sensitive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "${RUNNER_TEMP}" -maxdepth 1 -type f \
            \( -name 'provider-authority-*.log' -o -name 'official-infra-*.log' \) \
            -delete
          find "${RUNNER_TEMP}" -maxdepth 1 -type f \
            \( -name 'provider-authority-plan.json' -o \
              -name 'official-infra-import-id' -o \
              -name 'official-infra-state-*.json' -o \
              -name 'official-infra-state-*.tfstate' -o \
              -name 'official-infra-state-*.addresses' -o \
              -name 'terraform-output.json' \) -delete
          find "${MODULE_ROOT}" -maxdepth 1 -type f \
            -name 'backend.workflow.tf' -delete
          find "${GITHUB_WORKSPACE}" -maxdepth 1 -type f \
            -name '.official-infra.tfplan' -delete
          {
            echo 'AWS_ACCESS_KEY_ID='
            echo 'AWS_SECRET_ACCESS_KEY='
            echo 'AWS_SESSION_TOKEN='
            echo 'AWS_SECURITY_TOKEN='
          } >> "${GITHUB_ENV}"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          test ! -e "${PLAN_FILE}"
          test ! -e "${RUNNER_TEMP}/official-infra-import-id"
          test ! -e "${MODULE_ROOT}/backend.workflow.tf"

      - name: Upload encrypted reviewed plan
        if: inputs.operation == 'plan' && steps.plan.outcome == 'success' && steps.clear_sensitive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-authority-infra-plan-${{ inputs.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}/provider-authority.tfplan.age
            ${{ env.OUTPUT_ROOT }}/plan-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7

      - name: Upload redacted apply receipt
        if: inputs.operation == 'apply' && steps.apply.outcome == 'success' && steps.clear_sensitive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-authority-infra-apply-${{ inputs.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}/apply-receipt.json
            ${{ env.OUTPUT_ROOT }}/terraform-output.json.age
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30

      - name: Upload redacted import receipt
        if: inputs.operation == 'import' && steps.import.outcome == 'success' && steps.clear_sensitive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-authority-infra-import-${{ inputs.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}/import-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30

      - name: Upload encrypted pre-migration state and redacted detach receipt
        if: inputs.operation == 'detach-external-storage-state' && steps.detach_storage_state.outcome == 'success' && steps.clear_sensitive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-authority-infra-state-detach-${{ inputs.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}/official-eval-state-before.tfstate.age
            ${{ env.OUTPUT_ROOT }}/state-detach-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30

      - name: Upload apply recovery receipt after post-mutation failure
        if: always() && inputs.operation == 'apply' && steps.apply.outputs.mutation_succeeded == 'true' && steps.apply.outcome != 'success' && steps.clear_sensitive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-authority-infra-apply-recovery-${{ inputs.module }}-${{ github.run_id }}-${{ github.run_attempt }}
