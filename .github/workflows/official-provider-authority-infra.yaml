          retention-days: 30

      - name: Upload import recovery receipt after post-mutation failure
        if: always() && inputs.operation == 'import' && steps.import.outputs.mutation_succeeded == 'true' && steps.import.outcome != 'success' && steps.clear_sensitive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-authority-infra-import-recovery-${{ inputs.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}/import-recovery-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30

      - name: Upload state-detach recovery receipt after post-mutation failure
        if: always() && inputs.operation == 'detach-external-storage-state' && steps.detach_storage_state.outcome != 'success' && steps.clear_sensitive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: provider-authority-infra-state-detach-recovery-${{ inputs.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}/official-eval-state-before.tfstate.age
            ${{ env.OUTPUT_ROOT }}/state-detach-recovery-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
