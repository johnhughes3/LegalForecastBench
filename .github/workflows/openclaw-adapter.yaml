name: OpenClaw adapter

on:
  pull_request:
    paths:
      - '.github/workflows/openclaw-adapter.yaml'
      - 'examples/adapters/openclaw-pinned/**'
      - 'infra/openclaw-runtime/**'
      - 'legalforecast/multiharness/**'
      - 'tests/test_multiharness_openclaw*.py'
      - 'uv.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/openclaw-adapter.yaml'
      - 'examples/adapters/openclaw-pinned/**'
      - 'infra/openclaw-runtime/**'
      - 'legalforecast/multiharness/**'
      - 'tests/test_multiharness_openclaw*.py'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-runtime:
    name: Pinned OpenClaw offline integration
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install pinned runtimes
        run: |
          uv sync --locked
          corepack enable
          corepack prepare pnpm@11.27.0 --activate
          pnpm --dir examples/adapters/openclaw-pinned install --frozen-lockfile
      - name: Configure rootless Docker for the contained regression
        run: .github/scripts/setup-rootless-docker.sh
      - name: Build the pinned credential-free OpenClaw image
        run: docker build --pull=false -f infra/openclaw-runtime/Containerfile -t lfb-openclaw:issue46-gateway .
      - name: Exercise installed OpenClaw with a local provider double
        env:
          LEGALFORECAST_OPENCLAW_E2E: '1'
          LFB_OPENCLAW_CONTAINER_E2E: '1'
        run: >-
          uv run pytest tests/test_multiharness_openclaw*.py -q
          --cov=legalforecast --cov-report=xml:coverage.xml
      - name: Require the native-runtime coverage report
        id: coverage-report
        if: ${{ !cancelled() }}
        run: test -s coverage.xml
      - name: Upload native-runtime coverage to the same commit report
        if: ${{ !cancelled() && steps.coverage-report.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: johnhughes3/LegalForecastBench
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          name: openclaw-native
