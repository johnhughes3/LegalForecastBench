name: Archive GitHub artifacts

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Archive only this workflow run (blank archives every available artifact)
        required: false
        default: ''
  # Every result-producing run is copied to S3 as soon as it finishes, whatever
  # its conclusion: failed runs carry recovery checkpoints. GitHub artifacts
  # expire; the S3 copy does not.
  workflow_run:
    workflows:
      - Run Benchmark
      - Recover Benchmark
      - Protected Labels Fan In
      - Score Terminal Release
      - Prepare Jev Summaries
    types: [completed]

permissions:
  actions: read
  contents: read

# One group per source run: a shared group would silently replace pending
# archives when several benchmark runs finish close together.
concurrency:
  group: archive-github-artifacts-${{ github.event.workflow_run.id || inputs.source_run_id || 'inventory' }}-${{ github.event.workflow_run.run_attempt || github.run_id }}
  cancel-in-progress: false

jobs:
  archive:
    name: Preserve available artifact ZIPs in S3
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 210
    environment: legalforecastbench-official-eval-fan-in
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Sync the locked Python environment
        run: uv sync --locked

      - name: Download artifacts within the GitHub API quota
        id: download
        continue-on-error: true
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          ARCHIVE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m legalforecast.artifact_archive \
            --repository "$SOURCE_REPOSITORY" \
            --bucket "$LFB_RESULTS_BUCKET" \
            --archive-id "$ARCHIVE_ID" \
            --output-dir /tmp/lfb-artifact-archive-results \
            --workers 4 --download-only \
            ${SOURCE_RUN_ID:+--source-run-id "$SOURCE_RUN_ID"}

      - name: Assume protected artifact publication role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lfb-artifact-archive-${{ github.run_id }}
          role-to-assume: ${{ vars.LFB_GITHUB_FAN_IN_ROLE_ARN }}
          role-duration-seconds: 3600

      - name: Archive downloaded artifacts with fresh storage credentials
        timeout-minutes: 45
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          ARCHIVE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m legalforecast.artifact_archive \
            --repository "$SOURCE_REPOSITORY" \
            --bucket "$LFB_RESULTS_BUCKET" \
            --archive-id "$ARCHIVE_ID" \
            --output-dir /tmp/lfb-artifact-archive-results \
            --workers 4 --upload-only \
            ${SOURCE_RUN_ID:+--source-run-id "$SOURCE_RUN_ID"}

      - name: Refuse successful completion after an interrupted download
        if: ${{ !cancelled() && steps.download.outcome == 'failure' }}
        run: exit 1

      - name: Retain the archive index for inspection
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: github-artifact-archive-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/lfb-artifact-archive-results/*.json
          if-no-files-found: warn
          retention-days: 90
