name: Dependabot auto-merge

on:
  workflow_run:
    # PR-triggered workflows only. Each successful completion retriggers the
    # check-run gate so auto-merge waits until every check on the head SHA is
    # complete rather than merging on the first green job.
    workflows:
      - CI
      - CodeQL
      - Community Multi-Harness Validation
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name != 'Dependabot auto-merge' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # Dependabot often cannot see the private org CI_RUNNER variable, so the
    # fallback must be ubicloud-standard-2 rather than ubuntu-latest.
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    steps:
      - name: Resolve Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          matches="$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.user.login=="dependabot[bot]" and .state=="open" and .draft!=true and .base.ref=="main" and .head.sha=="'"${SHA}"'")]')"
          count="$(printf '%s' "${matches}" | jq 'length')"
          if [ "${count}" -ne 1 ]; then
            echo "Expected exactly one open Dependabot PR for ${SHA} on main; found ${count}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          num="$(printf '%s' "${matches}" | jq -r '.[0].number')"
          commit="$(gh api "repos/${REPO}/commits/${SHA}")"
          author="$(printf '%s' "${commit}" | jq -r '.author.login // ""')"
          verified="$(printf '%s' "${commit}" | jq -r '.commit.verification.verified // false')"
          if [ "${author}" != "dependabot[bot]" ] || [ "${verified}" != "true" ]; then
            echo "Expected a verified Dependabot head commit for ${SHA}; author=${author} verified=${verified}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message_path="${RUNNER_TEMP}/dependabot-commit-message.txt"
          printf '%s' "${commit}" | jq -r '.commit.message' > "${message_path}"
          {
            echo "number=${num}"
            echo "message_path=${message_path}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      # dependabot/fetch-metadata reads only pull_request event payloads. This
      # workflow intentionally runs after hosted checks via workflow_run, so
      # parse the same verified Dependabot commit metadata locally instead.
      - name: Parse verified Dependabot metadata
        if: steps.pr.outputs.skip != 'true'
        id: meta
        env:
          MESSAGE_PATH: ${{ steps.pr.outputs.message_path }}
        run: |
          set -euo pipefail
          python3 - "${MESSAGE_PATH}" "${GITHUB_OUTPUT}" <<'PY'
          from pathlib import Path
          import sys

          message = Path(sys.argv[1]).read_text(encoding="utf-8")
          entries: list[tuple[str, str]] = []
          dependency_name = ""
          update_type = ""
          in_metadata = False

          for raw_line in message.splitlines():
              line = raw_line.strip()
              if line == "updated-dependencies:":
                  in_metadata = True
                  continue
              if not in_metadata:
                  continue
              if line == "...":
                  break
              if line.startswith("- dependency-name:"):
                  if dependency_name:
                      entries.append((dependency_name, update_type))
                  dependency_name = line.partition(":")[2].strip()
                  update_type = ""
              elif line.startswith("update-type:") and dependency_name:
                  update_type = line.partition(":")[2].strip()

          if dependency_name:
              entries.append((dependency_name, update_type))
          if not entries or any(not name or not kind for name, kind in entries):
              raise SystemExit("Verified Dependabot commit has incomplete update metadata")

          ranks = {
              "version-update:semver-patch": 1,
              "version-update:semver-minor": 2,
              "version-update:semver-major": 3,
          }
          update_types = [kind for _, kind in entries]
          highest = (
              max(update_types, key=ranks.__getitem__)
              if all(kind in ranks for kind in update_types)
              else ""
          )
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"dependency-names={','.join(name for name, _ in entries)}\n")
              output.write(f"update-type={highest}\n")
          PY

      - name: Classify dependencies and update type
        id: class
        if: steps.pr.outputs.skip != 'true'
        env:
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail
          dependency_names="$(
            printf '%s' "${DEPENDENCY_NAMES}" |
              tr '[:upper:]' '[:lower:]' |
              tr -d '[:space:]'
          )"
          case ",${dependency_names}," in
            *,anthropic,*|*,claude-agent-sdk,*|*,openai,*)
              echo "Skipping auto-merge for provider-contract dependencies='${DEPENDENCY_NAMES}'"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          case "${UPDATE_TYPE}" in
            version-update:semver-patch|version-update:semver-minor)
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Skipping auto-merge for update-type='${UPDATE_TYPE}'"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Require every check on the head SHA to be complete and non-failing
        id: gates
        if: steps.pr.outputs.skip != 'true' && steps.class.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          json="$(gh api "repos/${REPO}/commits/${SHA}/check-runs" --paginate --jq '.check_runs[]' | jq -s '.')"
          pending="$(printf '%s' "$json" | jq '[.[] | select(.status != "completed")] | length')"
          python_ok="$(printf '%s' "$json" | jq '[.[] | select(.name=="Python quality gates" and .status=="completed" and .conclusion=="success")] | length')"
          failed="$(printf '%s' "$json" | jq '[.[] | select(.status=="completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length')"
          if [ "$pending" -ne 0 ] || [ "$python_ok" -lt 1 ] || [ "$failed" -ne 0 ]; then
            echo "Not merging: pending=${pending} python_ok=${python_ok} failed=${failed}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Disable stale auto-merge for ineligible updates
        if: always() && steps.pr.outputs.skip != 'true' && (steps.class.outputs.eligible != 'true' || steps.gates.outputs.ok != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          auto_merge_enabled="$(
            gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null'
          )"
          if [ "${auto_merge_enabled}" = "true" ]; then
            gh pr merge --disable-auto --repo "$REPO" "$PR"
          fi

      - name: Enable auto-merge (squash)
        if: steps.pr.outputs.skip != 'true' && steps.class.outputs.eligible == 'true' && steps.gates.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$SHA"
