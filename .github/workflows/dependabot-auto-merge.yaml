name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'johnhughes3/LegalForecastBench' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    # Public repo: GitHub-hosted Actions minutes are free here; ubicloud is paid.
    # Deliberately NOT using vars.CI_RUNNER; do not "standardize" this back.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Classify verified Dependabot update
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "eligible=false" >>"${GITHUB_OUTPUT}"

          commits="$(
            gh api \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=2" \
              --jq '[.[] | {
                author: (.author.login // ""),
                verified: (.commit.verification.verified // false),
                message: (.commit.message // "")
              }]'
          )"
          if [[ "$(jq 'length' <<<"${commits}")" != "1" ]]; then
            echo "A Dependabot auto-merge candidate must contain exactly one commit." >&2
            exit 1
          fi
          first_commit="$(jq '.[0]' <<<"${commits}")"
          author="$(jq -r '.author' <<<"${first_commit}")"
          verified="$(jq -r '.verified' <<<"${first_commit}")"
          if [[ "${author}" != "dependabot[bot]" || "${verified}" != "true" ]]; then
            echo "The first pull request commit is not a verified Dependabot commit." >&2
            exit 1
          fi

          mapfile -t update_types < <(
            jq -r '.message' <<<"${first_commit}" |
              sed -n 's/^[[:space:]]*update-type:[[:space:]]*//p'
          )
          eligible=true
          if ((${#update_types[@]} == 0)); then
            eligible=false
            echo "::notice::Verified Dependabot commit has no update-type metadata; leaving auto-merge disabled."
          else
            for update_type in "${update_types[@]}"; do
              case "${update_type}" in
                version-update:semver-patch | version-update:semver-minor) ;;
                version-update:semver-major) eligible=false ;;
                *)
                  eligible=false
                  echo "::notice::Unknown Dependabot update type: ${update_type}; leaving auto-merge disabled."
                  ;;
              esac
            done
          fi
          echo "eligible=${eligible}" >>"${GITHUB_OUTPUT}"

      - name: Disable stale auto-merge for ineligible updates
        if: always() && steps.metadata.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          auto_merge_enabled="$(
            gh pr view "${PR_URL}" \
              --json autoMergeRequest \
              --jq '.autoMergeRequest != null'
          )"
          if [[ "${auto_merge_enabled}" == "true" ]]; then
            gh pr merge --disable-auto "${PR_URL}"
          fi

      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          allow_auto_merge="$(
            gh api "repos/${REPOSITORY}" --jq '.allow_auto_merge'
          )"
          if [[ "${allow_auto_merge}" != "true" ]]; then
            echo "::notice::Repository auto-merge is disabled; skipping. Enable Settings > General > Pull requests > Allow auto-merge to activate this workflow."
            exit 0
          fi

          gh pr merge \
            --auto \
            --squash \
            --match-head-commit "${PR_HEAD_SHA}" \
            "${PR_URL}"
