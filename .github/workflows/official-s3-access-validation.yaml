name: Official S3 Access Validation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional commit SHA to validate. If set, it must be reachable from origin/main.
        required: false
        type: string
      packet_object_key:
        description: Existing model packet key to prove before fan-in denial checks.
        required: true
        type: string
      manifest_object_key:
        description: Existing public-safe manifest key to prove before fan-in denial checks.
        required: true
        type: string
      per_case_object_key:
        description: Existing per-case metrics key under per-case/<case>/metrics/.
        required: true
        type: string
      per_case_version_id:
        description: Exact immutable S3 VersionId for per_case_object_key.
        required: true
        type: string
      shard_receipt_object_key:
        description: Existing immutable shard receipt key to prove both role boundaries.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: official-s3-access-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      manifest_object_key: ${{ steps.resolve.outputs.manifest_object_key }}
      packet_object_key: ${{ steps.resolve.outputs.packet_object_key }}
      per_case_object_key: ${{ steps.resolve.outputs.per_case_object_key }}
      per_case_version_id: ${{ steps.resolve.outputs.per_case_version_id }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      shard_receipt_object_key: ${{ steps.resolve.outputs.shard_receipt_object_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve trusted release
        id: resolve
        shell: bash
        env:
          MANIFEST_OBJECT_KEY_INPUT: ${{ inputs.manifest_object_key }}
          PACKET_OBJECT_KEY_INPUT: ${{ inputs.packet_object_key }}
          PER_CASE_OBJECT_KEY_INPUT: ${{ inputs.per_case_object_key }}
          PER_CASE_VERSION_ID_INPUT: ${{ inputs.per_case_version_id }}
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
          SHARD_RECEIPT_OBJECT_KEY_INPUT: ${{ inputs.shard_receipt_object_key }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Official LegalForecastBench S3 validation is allowed only from refs/heads/main." >&2
            exit 1
          fi

          case "${PACKET_OBJECT_KEY_INPUT}" in
            model-packets/*) ;;
            *)
              echo "packet_object_key must start with model-packets/." >&2
              exit 1
              ;;
          esac
          case "${MANIFEST_OBJECT_KEY_INPUT}" in
            manifests/*) ;;
            *)
              echo "manifest_object_key must start with manifests/." >&2
              exit 1
              ;;
          esac
          if [[ ! "${PER_CASE_OBJECT_KEY_INPUT}" =~ ^per-case/[A-Za-z0-9._-]+/metrics/[A-Za-z0-9._/-]+$ ]]; then
            echo "per_case_object_key must name an existing object under per-case/<case>/metrics/." >&2
            exit 1
          fi
          if [[ ! "${PER_CASE_VERSION_ID_INPUT}" =~ ^[A-Za-z0-9._~+/=-]{1,1024}$ ]]; then
            echo "per_case_version_id must be a nonempty S3 VersionId without whitespace or control characters." >&2
            exit 1
          fi
          if [[ ! "${SHARD_RECEIPT_OBJECT_KEY_INPUT}" =~ ^shard-receipts/[A-Za-z0-9._/-]+$ ]]; then
            echo "shard_receipt_object_key must name an existing object under shard-receipts/." >&2
            exit 1
          fi

          git fetch origin main --prune
          if [[ -z "${RELEASE_SHA_INPUT}" ]]; then
            release_sha="$(git rev-parse --verify "origin/main^{commit}")"
          else
            release_sha="$(git rev-parse --verify "${RELEASE_SHA_INPUT}^{commit}")"
          fi
          if ! git merge-base --is-ancestor "${release_sha}" origin/main; then
            echo "release_sha must be reachable from origin/main." >&2
            exit 1
          fi

          {
            echo "manifest_object_key=${MANIFEST_OBJECT_KEY_INPUT}"
            echo "packet_object_key=${PACKET_OBJECT_KEY_INPUT}"
            echo "per_case_object_key=${PER_CASE_OBJECT_KEY_INPUT}"
            echo "per_case_version_id=${PER_CASE_VERSION_ID_INPUT}"
            echo "release_sha=${release_sha}"
            echo "shard_receipt_object_key=${SHARD_RECEIPT_OBJECT_KEY_INPUT}"
          } >> "${GITHUB_OUTPUT}"

  validate-official-s3-access:
    needs: validate-request
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: legalforecastbench-official-eval
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION || 'us-east-1' }}
      LFB_GITHUB_PACKET_READ_ROLE_ARN: ${{ vars.LFB_GITHUB_PACKET_READ_ROLE_ARN }}
      LFB_MODEL_PACKET_PREFIX: ${{ vars.LFB_MODEL_PACKET_PREFIX || 'model-packets/' }}
      LFB_PACKET_BUCKET: ${{ vars.LFB_PACKET_BUCKET }}
      LFB_PROVIDER_AUTHORITY_TABLE: ${{ vars.LFB_PROVIDER_AUTHORITY_TABLE }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
      LFB_RESULTS_MANIFEST_PREFIX: ${{ vars.LFB_RESULTS_MANIFEST_PREFIX || 'manifests/' }}
      MANIFEST_OBJECT_KEY: ${{ needs.validate-request.outputs.manifest_object_key }}
      PACKET_OBJECT_KEY: ${{ needs.validate-request.outputs.packet_object_key }}
    steps:
      - name: Confirm secure-gate protected environment
        shell: bash
        run: |
          set -euo pipefail
          echo "This job starts only after the legalforecastbench-official-eval protected environment, including secure-gate deployment protection, approves it."

      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          required_env=(
            AWS_REGION
            LFB_GITHUB_PACKET_READ_ROLE_ARN
            LFB_MODEL_PACKET_PREFIX
            LFB_PACKET_BUCKET
            LFB_PROVIDER_AUTHORITY_TABLE
            LFB_RESULTS_BUCKET
            LFB_RESULTS_MANIFEST_PREFIX
          )
          for name in "${required_env[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required protected environment values:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          if [[ "${LFB_MODEL_PACKET_PREFIX}" != "model-packets/" ]]; then
            echo "LFB_MODEL_PACKET_PREFIX must be model-packets/ for the packet-read role." >&2
            exit 1
          fi
          if [[ "${LFB_RESULTS_MANIFEST_PREFIX}" != "manifests/" ]]; then
            echo "LFB_RESULTS_MANIFEST_PREFIX must be manifests/ for public-safe manifests." >&2
            exit 1
          fi
          if [[ ! "${LFB_GITHUB_PACKET_READ_ROLE_ARN}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+ ]]; then
            echo "LFB_GITHUB_PACKET_READ_ROLE_ARN must be an IAM role ARN." >&2
            exit 1
          fi

      - name: Checkout trusted release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate-request.outputs.release_sha }}

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lfb-official-eval-${{ github.run_id }}
          role-to-assume: ${{ env.LFB_GITHUB_PACKET_READ_ROLE_ARN }}

      - name: Validate packet-read contract
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text >/tmp/lfb-aws-caller.txt

          aws s3api list-objects-v2 \
            --bucket "${LFB_PACKET_BUCKET}" \
            --prefix "${LFB_MODEL_PACKET_PREFIX}" \
            --max-items 1 \
            --output json >/tmp/lfb-model-packet-list.json

          aws s3api list-objects-v2 \
            --bucket "${LFB_RESULTS_BUCKET}" \
            --prefix "${LFB_RESULTS_MANIFEST_PREFIX}" \
            --max-items 1 \
            --output json >/tmp/lfb-manifest-list.json

          aws s3api head-object \
            --bucket "${LFB_PACKET_BUCKET}" \
            --key "${PACKET_OBJECT_KEY}" >/tmp/lfb-packet-head.json
          aws s3api head-object \
            --bucket "${LFB_RESULTS_BUCKET}" \
            --key "${MANIFEST_OBJECT_KEY}" >/tmp/lfb-manifest-head.json

          aws dynamodb describe-table \
            --table-name "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --region "${AWS_REGION}" \
            --query Table.TableArn \
            --output text >/tmp/lfb-provider-authority-table-arn.txt

      - name: Validate cell omission boundary
        shell: bash
        run: |
          set -euo pipefail
          report_key="reports/security-negative-controls/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/cell-forbidden"

          expect_access_denied() {
            local label="$1"
            shift
            local output_file="/tmp/lfb-${label}-denial.txt"
            if "$@" >"${output_file}" 2>&1; then
              echo "${label} unexpectedly succeeded under the cell role." >&2
              exit 1
            fi
            if ! grep -Eqi 'AccessDenied|Forbidden|403|not authorized' "${output_file}"; then
              echo "${label} failed for a reason other than access denial." >&2
              cat "${output_file}" >&2
              exit 1
            fi
          }

          expect_access_denied cell-report-write \
            aws s3api put-object \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --key "${report_key}" \
              --body /dev/null
          expect_access_denied cell-bucket-wide-list \
            aws s3api list-objects-v2 \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --max-keys 1
          expect_access_denied cell-delete \
            aws s3api delete-object \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --key "${report_key}"
          expect_access_denied cell-acl \
            aws s3api put-object-acl \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --key "${report_key}" \
              --acl private
          expect_access_denied cell-versions \
            aws s3api list-object-versions \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --prefix "reports/security-negative-controls/" \
              --max-keys 1

  validate-fan-in-access:
    needs:
      - validate-request
      - validate-official-s3-access
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: legalforecastbench-official-eval-fan-in
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION || 'us-east-1' }}
      LFB_GITHUB_FAN_IN_ROLE_ARN: ${{ vars.LFB_GITHUB_FAN_IN_ROLE_ARN }}
      LFB_PACKET_BUCKET: ${{ vars.LFB_PACKET_BUCKET }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
      MANIFEST_OBJECT_KEY: ${{ needs.validate-request.outputs.manifest_object_key }}
      PACKET_OBJECT_KEY: ${{ needs.validate-request.outputs.packet_object_key }}
      PER_CASE_OBJECT_KEY: ${{ needs.validate-request.outputs.per_case_object_key }}
      PER_CASE_VERSION_ID: ${{ needs.validate-request.outputs.per_case_version_id }}
      SHARD_RECEIPT_OBJECT_KEY: ${{ needs.validate-request.outputs.shard_receipt_object_key }}
    steps:
      - name: Confirm secure-gate protected environment
        shell: bash
        run: |
          set -euo pipefail
          echo "This job starts only after the legalforecastbench-official-eval-fan-in protected environment, including secure-gate deployment protection, approves it."

      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          required_env=(
            AWS_REGION
            LFB_GITHUB_FAN_IN_ROLE_ARN
            LFB_PACKET_BUCKET
            LFB_RESULTS_BUCKET
            PER_CASE_OBJECT_KEY
            PER_CASE_VERSION_ID
            SHARD_RECEIPT_OBJECT_KEY
          )
          for name in "${required_env[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required protected environment values:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          if [[ ! "${LFB_GITHUB_FAN_IN_ROLE_ARN}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+ ]]; then
            echo "LFB_GITHUB_FAN_IN_ROLE_ARN must be an IAM role ARN." >&2
            exit 1
          fi

      - name: Checkout trusted release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate-request.outputs.release_sha }}

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lfb-official-fan-in-${{ github.run_id }}
          role-to-assume: ${{ env.LFB_GITHUB_FAN_IN_ROLE_ARN }}

      - name: Validate fan-in read contract
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text >/tmp/lfb-fan-in-caller.txt
          allowed_prefixes=("per-case/" "shard-receipts/")
          for prefix in "${allowed_prefixes[@]}"; do
            aws s3api list-objects-v2 \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --prefix "${prefix}" \
              --max-items 1 \
              --output json >"/tmp/lfb-fan-in-${prefix%/}-list.json"
          done
          aws s3api head-object \
            --bucket "${LFB_RESULTS_BUCKET}" \
            --key "${PER_CASE_OBJECT_KEY}" \
            --version-id "${PER_CASE_VERSION_ID}" \
            >/tmp/lfb-fan-in-per-case-version-head.json
          aws s3api head-object \
            --bucket "${LFB_RESULTS_BUCKET}" \
            --key "${SHARD_RECEIPT_OBJECT_KEY}" \
            >/tmp/lfb-fan-in-shard-receipt-head.json

      - name: Validate fan-in omission boundary
        shell: bash
        run: |
          set -euo pipefail
          report_key="reports/security-negative-controls/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/fan-in-forbidden"

          expect_access_denied() {
            local label="$1"
            shift
            local output_file="/tmp/lfb-${label}-denial.txt"
            if "$@" >"${output_file}" 2>&1; then
              echo "${label} unexpectedly succeeded under the fan-in role." >&2
              exit 1
            fi
            if ! grep -Eqi 'AccessDenied|Forbidden|403|not authorized' "${output_file}"; then
              echo "${label} failed for a reason other than access denial." >&2
              cat "${output_file}" >&2
              exit 1
            fi
          }

          expect_access_denied fan-in-manifest-read \
            aws s3api head-object \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --key "${MANIFEST_OBJECT_KEY}"
          expect_access_denied fan-in-packet-read \
            aws s3api head-object \
              --bucket "${LFB_PACKET_BUCKET}" \
              --key "${PACKET_OBJECT_KEY}"
          expect_access_denied fan-in-report-write \
            aws s3api put-object \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --key "${report_key}" \
              --body /dev/null
          expect_access_denied fan-in-bucket-wide-list \
            aws s3api list-objects-v2 \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --max-keys 1
          expect_access_denied fan-in-delete \
            aws s3api delete-object \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --key "${report_key}"
          expect_access_denied fan-in-acl \
            aws s3api put-object-acl \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --key "${report_key}" \
              --acl private
          expect_access_denied fan-in-versions \
            aws s3api list-object-versions \
              --bucket "${LFB_RESULTS_BUCKET}" \
              --prefix "reports/security-negative-controls/" \
              --max-keys 1

  validate-cell-receipt-denial:
    needs:
      - validate-request
      - validate-fan-in-access
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: legalforecastbench-official-eval
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION || 'us-east-1' }}
      LFB_GITHUB_PACKET_READ_ROLE_ARN: ${{ vars.LFB_GITHUB_PACKET_READ_ROLE_ARN }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
      SHARD_RECEIPT_OBJECT_KEY: ${{ needs.validate-request.outputs.shard_receipt_object_key }}
    steps:
      - name: Confirm secure-gate protected environment
        shell: bash
        run: |
          set -euo pipefail
          echo "This job starts only after the legalforecastbench-official-eval protected environment, including secure-gate deployment protection, approves it."

      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          required_env=(
            AWS_REGION
            LFB_GITHUB_PACKET_READ_ROLE_ARN
            LFB_RESULTS_BUCKET
            SHARD_RECEIPT_OBJECT_KEY
          )
          for name in "${required_env[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required protected environment values:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          if [[ ! "${LFB_GITHUB_PACKET_READ_ROLE_ARN}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+ ]]; then
            echo "LFB_GITHUB_PACKET_READ_ROLE_ARN must be an IAM role ARN." >&2
            exit 1
          fi

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lfb-official-cell-denial-${{ github.run_id }}
          role-to-assume: ${{ env.LFB_GITHUB_PACKET_READ_ROLE_ARN }}

      - name: Deny cell read of proven shard receipt
        shell: bash
        run: |
          set -euo pipefail
          output_file=/tmp/lfb-cell-shard-receipt-denial.txt
          if aws s3api head-object \
            --bucket "${LFB_RESULTS_BUCKET}" \
            --key "${SHARD_RECEIPT_OBJECT_KEY}" \
            >"${output_file}" 2>&1; then
            echo "Cell role unexpectedly read a shard receipt already proven under fan-in." >&2
            exit 1
          fi
          if ! grep -Eqi 'AccessDenied|Forbidden|403|not authorized' "${output_file}"; then
            echo "Cell shard-receipt read failed for a reason other than access denial." >&2
            cat "${output_file}" >&2
            exit 1
          fi
