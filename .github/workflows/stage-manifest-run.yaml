name: Stage Supplementary Manifest Run

# Staging is the last step of the Cycle 1 pre-dispatch chain that still wrote to
# S3 from a developer machine. It now runs here, under GitHub OIDC, with no
# long-lived credentials anywhere -- and it cannot run anywhere else: the buckets
# and their KMS key are governed by resource policies naming only the OIDC roles,
# so even break-glass AdministratorAccess is denied (PutObject fails on
# kms:GenerateDataKey, ListObjectsV2 reports no resource-based policy, HeadObject
# returns 403). The corpus bytes are rebuilt from the immutable objects an
# earlier official staging already wrote rather than being carried into this
# public repository.
#
# SUPPLEMENTARY ONLY, deliberately. Restaging an already-staged official freeze
# would double the artifacts/ segment its paths already carry, creating junk in
# the immutable official prefix that no role can delete before it aborts. Official
# re-verification must be a read-only head-object check, which is a different
# operation and is not this workflow.
#
# What this workflow deliberately does NOT do: issue or verify the execution
# scope. That step reads live owner-approval comments from a loopback-only beads
# Dolt server on the operator's machine, so it is permanently operator-side. The
# scope reaches a dispatch as a checked-out `path#sha256`, which
# run-benchmark.yaml already accepts and pins.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact trusted commit SHA on main; must equal the dispatched commit.
        required: true
        type: string
      manifest_digest:
        description: Corpus manifest SHA-256 from manifest-mode-run-record.json.
        required: true
        type: string
      official_freeze_bundle_sha256:
        description: >-
          Raw-file SHA-256 of the staged official freeze. This is the pin that
          makes the reconstruction trustworthy and the lane decision authoritative.
          Not the freeze protocol's canonical hash_bundle_sha256.
        required: true
        type: string
      run_inputs_sha256:
        description: >-
          Raw-file SHA-256 of the staged run-inputs.json. Every packet digest the
          rebuild trusts is read out of that file, so it is pinned rather than
          taken on the staged prefix's word.
        required: true
        type: string
      run_record_sha256:
        description: Raw-file SHA-256 of the staged manifest-mode-run-record.json.
        required: true
        type: string
      freeze_bundle_path:
        description: Checked-out path to the sibling freeze bundle; must be tracked at release_sha.
        required: true
        type: string
      freeze_bundle_sha256:
        description: >-
          Raw-file SHA-256 of freeze_bundle_path, taken before staging. This is
          the prefix component, not the staged freeze's digest, which does not
          exist until this workflow has run.
        required: true
        type: string
      local_artifacts:
        description: >-
          Newline-separated <artifact_name>=<checked-out path> for the artifacts
          the sibling replaces (model registry, provider caps, execution policy).
          Refused for any artifact already staged officially, and for a repeated name.
        required: true
        type: string
      dry_run:
        description: Validate and print the upload plan without writing to S3.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: stage-manifest-run-${{ inputs.manifest_digest }}-${{ inputs.freeze_bundle_sha256 }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate staging request
    # Public repo: GitHub-hosted Actions minutes are free here; ubicloud is paid.
    # Deliberately NOT using vars.CI_RUNNER; do not "standardize" this back.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      expected_prefix: ${{ steps.request.outputs.expected_prefix }}
    steps:
      - name: Checkout exact main release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Validate pins and checked-out inputs
        id: request
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FREEZE_BUNDLE_PATH: ${{ inputs.freeze_bundle_path }}
          FREEZE_BUNDLE_SHA256: ${{ inputs.freeze_bundle_sha256 }}
          LOCAL_ARTIFACTS: ${{ inputs.local_artifacts }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
          OFFICIAL_FREEZE_BUNDLE_SHA256: ${{ inputs.official_freeze_bundle_sha256 }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_INPUTS_SHA256: ${{ inputs.run_inputs_sha256 }}
          RUN_RECORD_SHA256: ${{ inputs.run_record_sha256 }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] || [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Manifest-run staging is allowed only from refs/heads/main." >&2
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${GITHUB_SHA}" ]] || [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "release_sha must equal the exact main commit that triggered this workflow." >&2
            exit 1
          fi
          for name in MANIFEST_DIGEST OFFICIAL_FREEZE_BUNDLE_SHA256 FREEZE_BUNDLE_SHA256 \
            RUN_INPUTS_SHA256 RUN_RECORD_SHA256; do
            if [[ ! "${!name}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "${name} must be a lowercase SHA-256 hex digest." >&2
              exit 1
            fi
          done

          # A sibling freeze that hashes to the pinned official bundle IS the
          # official freeze. Restaging it would double the artifacts/ segment its
          # paths already carry and create undeletable junk in the official
          # prefix, so it is refused here, before any credential exists.
          if [[ "${FREEZE_BUNDLE_SHA256}" == "${OFFICIAL_FREEZE_BUNDLE_SHA256}" ]]; then
            echo "freeze_bundle_sha256 equals the pinned official bundle; this workflow stages supplementary siblings only." >&2
            exit 1
          fi

          # A checked-out path must stay inside the checkout and must be tracked
          # at the release commit: a file present in the working tree but absent
          # from the release did not go through review. The gitignored artifacts/
          # tree is exactly what must not become a staging input.
          require_tracked_file() {
            local label="$1" candidate="$2"
            if [[ ! "${candidate}" =~ ^[A-Za-z0-9._/-]+$ ]] ||
              [[ "${candidate}" == /* ]] ||
              [[ "${candidate}" == -* ]] ||
              [[ "/${candidate}/" == *"/../"* ]]; then
              echo "${label} must be a relative path inside the checkout: ${candidate}" >&2
              exit 1
            fi
            if [[ ! -f "${candidate}" ]]; then
              echo "${label} does not exist at the release commit: ${candidate}" >&2
              exit 1
            fi
            if ! git ls-files --error-unmatch -- "${candidate}" >/dev/null 2>&1; then
              echo "${label} is not tracked at the release commit: ${candidate}" >&2
              exit 1
            fi
          }

          require_tracked_file freeze_bundle_path "${FREEZE_BUNDLE_PATH}"
          actual="$(sha256sum -- "${FREEZE_BUNDLE_PATH}" | cut -d' ' -f1)"
          if [[ "${actual}" != "${FREEZE_BUNDLE_SHA256}" ]]; then
            echo "freeze_bundle_path hashes to ${actual}, not the pinned ${FREEZE_BUNDLE_SHA256}." >&2
            exit 1
          fi

          if [[ -z "${LOCAL_ARTIFACTS//[[:space:]]/}" ]]; then
            echo "local_artifacts is required: a sibling freeze replaces at least its own model registry." >&2
            exit 1
          fi
          seen=""
          while IFS= read -r entry; do
            [[ -n "${entry//[[:space:]]/}" ]] || continue
            if [[ ! "${entry}" =~ ^[a-z0-9_]+=[A-Za-z0-9._/-]+$ ]]; then
              echo "local_artifacts entries must be <artifact_name>=<path>: ${entry}" >&2
              exit 1
            fi
            name="${entry%%=*}"
            if [[ " ${seen} " == *" ${name} "* ]]; then
              echo "local_artifacts names ${name} more than once." >&2
              exit 1
            fi
            seen="${seen} ${name}"
            require_tracked_file "local_artifacts entry ${name}" "${entry#*=}"
          done <<< "${LOCAL_ARTIFACTS}"

          if [[ "${DRY_RUN}" != "true" && "${DRY_RUN}" != "false" ]]; then
            echo "dry_run must be true or false." >&2
            exit 1
          fi
          expected_prefix="cycle-1/manifest-runs/supplementary/${MANIFEST_DIGEST}/${FREEZE_BUNDLE_SHA256}"
          echo "expected_prefix=${expected_prefix}" >> "${GITHUB_OUTPUT}"

  stage:
    name: Stage supplementary manifest run
    needs: validate-request
    if: github.ref == 'refs/heads/main'
    # Public repo: GitHub-hosted Actions minutes are free here; ubicloud is paid.
    # Deliberately NOT using vars.CI_RUNNER; do not "standardize" this back.
    runs-on: ubuntu-latest
    # Generous on purpose. Staging drives roughly a thousand serial aws CLI calls
    # (one create-only put and one head-object per object, plus the rebuild's
    # exact-key gets). Every write is create-once and no role can delete, so a
    # timeout part-way through leaves a prefix nobody can clean up: the budget
    # must never be the thing that stops a run.
    timeout-minutes: 90
    environment: legalforecastbench-official-eval-manifest-staging
    permissions:
      contents: read
      id-token: write
    outputs:
      prefix: ${{ steps.stage.outputs.prefix }}
      staged_freeze_sha256: ${{ steps.stage.outputs.staged_freeze_sha256 }}
      staged_freeze_uri: ${{ steps.stage.outputs.staged_freeze_uri }}
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      EXPECTED_PREFIX: ${{ needs.validate-request.outputs.expected_prefix }}
      FREEZE_BUNDLE_PATH: ${{ inputs.freeze_bundle_path }}
      LFB_GITHUB_MANIFEST_STAGING_ROLE_ARN: ${{ vars.LFB_GITHUB_MANIFEST_STAGING_ROLE_ARN }}
      LFB_PACKET_BUCKET: ${{ vars.LFB_PACKET_BUCKET }}
      LFB_RESULTS_BUCKET: ${{ vars.LFB_RESULTS_BUCKET }}
      LOCAL_ARTIFACTS: ${{ inputs.local_artifacts }}
      MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
      OFFICIAL_FREEZE_BUNDLE_SHA256: ${{ inputs.official_freeze_bundle_sha256 }}
      # No dot prefix: the upload step sets include-hidden-files: false with
      # if-no-files-found: error, so a hidden output root would hard-fail the job
      # after the unrecoverable write had already happened.
      OUTPUT_ROOT: ${{ github.workspace }}/lfb-manifest-stage-output
      RELEASE_SHA: ${{ inputs.release_sha }}
      RUN_INPUTS_SHA256: ${{ inputs.run_inputs_sha256 }}
      RUN_RECORD_SHA256: ${{ inputs.run_record_sha256 }}
      WORK_ROOT: ${{ runner.temp }}/lfb-manifest-stage
    steps:
      - name: Confirm secure-gate protected environment
        shell: bash
        run: |
          set -euo pipefail
          echo "This job starts only after the legalforecastbench-official-eval-manifest-staging protected environment, including secure-gate deployment protection, approves it."

      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          required_env=(
            AWS_REGION
            LFB_GITHUB_MANIFEST_STAGING_ROLE_ARN
            LFB_PACKET_BUCKET
            LFB_RESULTS_BUCKET
          )
          for name in "${required_env[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required protected environment values:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          if [[ ! "${LFB_GITHUB_MANIFEST_STAGING_ROLE_ARN}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+ ]]; then
            echo "LFB_GITHUB_MANIFEST_STAGING_ROLE_ARN must be an IAM role ARN." >&2
            exit 1
          fi
          for bucket in "${LFB_PACKET_BUCKET}" "${LFB_RESULTS_BUCKET}"; do
            if [[ ! "${bucket}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
              echo "Bucket names must be S3 bucket names, not URIs or prefixes." >&2
              exit 1
            fi
          done

      - name: Checkout exact main release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true

      - name: Sync Python package
        run: uv sync --locked

      - name: Prove release is still current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          [[ "${current_main_sha}" == "${RELEASE_SHA}" ]] || {
            echo "main advanced after dispatch or protected approval; refusing stale staging authority." >&2
            exit 1
          }

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: lfb-manifest-stage-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ env.LFB_GITHUB_MANIFEST_STAGING_ROLE_ARN }}
          # Nothing ambient may survive into this job: the only credentials that
          # may act here are the ones this step just minted from the OIDC token.
          unset-current-credentials: true

      - name: Rebuild staging inputs from staged objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORK_ROOT}" "${OUTPUT_ROOT}"
          args=(
            --freeze-bundle "${FREEZE_BUNDLE_PATH}"
            --official-freeze-bundle-sha256 "${OFFICIAL_FREEZE_BUNDLE_SHA256}"
            --run-inputs-sha256 "${RUN_INPUTS_SHA256}"
            --run-record-sha256 "${RUN_RECORD_SHA256}"
            --official-prefix "cycle-1/manifest-runs/${MANIFEST_DIGEST}"
            --results-bucket "${LFB_RESULTS_BUCKET}"
            --packet-bucket "${LFB_PACKET_BUCKET}"
            --artifact-root "${WORK_ROOT}/artifact-root"
            --output-dir "${WORK_ROOT}/output-dir"
            --official-freeze-bundle-out "${WORK_ROOT}/official-freeze.json"
            # Written straight into OUTPUT_ROOT, which survives the cleanup that
            # deletes WORK_ROOT, so the durable record is genuinely durable.
            --plan-out "${OUTPUT_ROOT}/materialize-plan.json"
          )
          while IFS= read -r entry; do
            [[ -n "${entry//[[:space:]]/}" ]] || continue
            args+=(--local-artifact "${entry}")
          done <<< "${LOCAL_ARTIFACTS}"
          # stdout repeats the plan and names artifact paths; the durable copy is
          # --plan-out. Nothing here prints file contents.
          uv run python -m legalforecast.publication.manifest_run_materialize \
            "${args[@]}" >/dev/null

      - name: Prove the upload plan stays inside its own prefix
        shell: bash
        run: |
          set -euo pipefail
          uv run legalforecast acquisition stage-manifest-forecast \
            --output-dir "${WORK_ROOT}/output-dir" \
            --freeze-bundle "${FREEZE_BUNDLE_PATH}" \
            --artifact-root "${WORK_ROOT}/artifact-root" \
            --manifest-digest "${MANIFEST_DIGEST}" \
            --results-bucket "${LFB_RESULTS_BUCKET}" \
            --packet-bucket "${LFB_PACKET_BUCKET}" \
            --official-freeze-bundle "${WORK_ROOT}/official-freeze.json" \
            --official-freeze-bundle-sha256 "${OFFICIAL_FREEZE_BUNDLE_SHA256}" \
            --supplementary \
            --dry-run > "${OUTPUT_ROOT}/stage-plan.json"

          # The load-bearing fence, and the reason it runs before any write:
          # manifest-run objects are created once and no role can delete them, so
          # a single object placed outside this prefix is unrecoverable.
          bash "${GITHUB_WORKSPACE}/.github/scripts/assert-manifest-run-lane.sh" \
            "${OUTPUT_ROOT}/stage-plan.json" "${EXPECTED_PREFIX}" \
            "${LFB_RESULTS_BUCKET}" "${LFB_PACKET_BUCKET}"

      - name: Stage the manifest run
        id: stage
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            cp -f "${OUTPUT_ROOT}/stage-plan.json" "${OUTPUT_ROOT}/stage-record.json"
          else
            uv run legalforecast acquisition stage-manifest-forecast \
              --output-dir "${WORK_ROOT}/output-dir" \
              --freeze-bundle "${FREEZE_BUNDLE_PATH}" \
              --artifact-root "${WORK_ROOT}/artifact-root" \
              --manifest-digest "${MANIFEST_DIGEST}" \
              --results-bucket "${LFB_RESULTS_BUCKET}" \
              --packet-bucket "${LFB_PACKET_BUCKET}" \
              --official-freeze-bundle "${WORK_ROOT}/official-freeze.json" \
              --official-freeze-bundle-sha256 "${OFFICIAL_FREEZE_BUNDLE_SHA256}" \
              --supplementary > "${OUTPUT_ROOT}/stage-record.json"
          fi

          # Re-assert the fence against the record of what was actually written,
          # not only against the earlier dry-run invocation's plan: the two are
          # separate invocations, and only this one describes the real writes.
          bash "${GITHUB_WORKSPACE}/.github/scripts/assert-manifest-run-lane.sh" \
            "${OUTPUT_ROOT}/stage-record.json" "${EXPECTED_PREFIX}" \
            "${LFB_RESULTS_BUCKET}" "${LFB_PACKET_BUCKET}"

          prefix="$(jq -r '.prefix' "${OUTPUT_ROOT}/stage-record.json")"
          # The staged freeze's RAW SHA-256, which is an output of staging and
          # cannot be computed beforehand: staging rewrites every relative
          # artifact path, so the bundle it writes has different bytes from the
          # one it was given. Execution-scope issuance binds THIS digest. It is
          # neither the pre-staging raw digest (the prefix component) nor the
          # freeze protocol's canonical hash_bundle_sha256; substituting either
          # silently breaks scope verification.
          staged_freeze_sha256="$(
            jq -r --arg key "${prefix}/freeze.json" \
              '.objects[] | select(.bucket == $ENV.LFB_RESULTS_BUCKET and .key == $key) | .sha256' \
              "${OUTPUT_ROOT}/stage-record.json"
          )"
          [[ "${staged_freeze_sha256}" =~ ^[0-9a-f]{64}$ ]] || {
            echo "The stage record carries no staged freeze.json digest." >&2
            exit 1
          }
          staged_freeze_uri="s3://${LFB_RESULTS_BUCKET}/${prefix}/freeze.json"
          {
            echo "prefix=${prefix}"
            echo "staged_freeze_sha256=${staged_freeze_sha256}"
            echo "staged_freeze_uri=${staged_freeze_uri}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Staged supplementary manifest run (dry_run=${DRY_RUN})"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| prefix | \`${prefix}\` |"
            echo "| staged freeze URI | \`${staged_freeze_uri}\` |"
            echo "| **staged freeze raw sha256** | \`${staged_freeze_sha256}\` |"
            echo "| objects | $(jq -r '.objects | length' "${OUTPUT_ROOT}/stage-record.json") |"
            echo "| packets | $(jq -r '.packet_count' "${OUTPUT_ROOT}/stage-record.json") |"
            echo
            echo "Bind the staged freeze raw sha256 when issuing the execution scope."
          } >> "${GITHUB_STEP_SUMMARY}"

      # `!= true` rather than `== false`: an input that is not a real boolean
      # must fail into running the verification, never silently skip it after a
      # write that cannot be undone.
      - name: Verify the staged freeze reads back byte-identical
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          aws s3api get-object \
            --bucket "${LFB_RESULTS_BUCKET}" \
            --key "${{ steps.stage.outputs.prefix }}/freeze.json" \
            "${WORK_ROOT}/readback-freeze.json" >/dev/null
          printf '%s  %s\n' \
            "${{ steps.stage.outputs.staged_freeze_sha256 }}" \
            "${WORK_ROOT}/readback-freeze.json" | sha256sum --check --strict

      - name: Clear reconstructed corpus bytes and AWS credentials
        id: clear_sensitive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # The rebuilt tree holds model packets and frozen corpus artifacts. This
          # is a public repository: those bytes must not reach an uploaded run
          # artifact, which any viewer can download. OUTPUT_ROOT holds only
          # digests and keys and is deliberately kept.
          rm -rf "${WORK_ROOT}"
          {
            echo 'AWS_ACCESS_KEY_ID='
            echo 'AWS_SECRET_ACCESS_KEY='
            echo 'AWS_SESSION_TOKEN='
            echo 'AWS_SECURITY_TOKEN='
          } >> "${GITHUB_ENV}"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          test ! -e "${WORK_ROOT}"

      # always(): if staging wrote objects and a later step failed, the record of
      # which immutable objects now exist is exactly what is needed to recover.
      - name: Upload stage record
        if: always() && steps.stage.outcome == 'success' && steps.clear_sensitive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          # Digests and S3 keys only. Never the reconstructed packets, labels, or
          # frozen corpus artifacts: run artifacts on a public repository are
          # publicly downloadable.
          name: stage-manifest-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}/stage-record.json
            ${{ env.OUTPUT_ROOT }}/stage-plan.json
            ${{ env.OUTPUT_ROOT }}/materialize-plan.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
