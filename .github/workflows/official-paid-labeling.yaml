name: Official protected paid labeling

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Exact paid labeling stage
        required: true
        type: choice
        options:
          - llm-unitize
          - llm-review-stage-a
          - llm-label-provider-shard
      provider:
        description: Provider isolated in this job
        required: true
        type: choice
        options:
          - anthropic
          - google
          - openai
      release_sha:
        description: Full trusted commit SHA on main
        required: true
        type: string
      job_artifact_run_id:
        description: Workflow run containing the sealed paid-labeling job artifact
        required: true
        type: string
      job_artifact_run_attempt:
        description: Exact producer workflow run attempt
        required: true
        type: string
      job_artifact_name:
        description: Exact encrypted Actions artifact name
        required: true
        type: string
      job_artifact_digest:
        description: GitHub SHA-256 digest of the encrypted Actions artifact
        required: true
        type: string
      package_manifest_sha256:
        description: SHA-256 of the closed paid-labeling package manifest
        required: true
        type: string
      job_manifest_sha256:
        description: Lowercase SHA-256 of official-paid-labeling-job.json
        required: true
        type: string
      sequence_ordinal:
        description: Positive sequential baton ordinal
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: official-paid-labeling
  cancel-in-progress: false

jobs:
  authorize-boundary:
    name: Authorize exact stage and provider boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment_name: ${{ steps.boundary.outputs.environment_name }}
    steps:
      - name: Resolve reviewed protected environment
        id: boundary
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          if [[ "${STAGE}:${PROVIDER}" == "llm-unitize:anthropic" ]]; then
            environment_name="legalforecastbench-official-labeling-anthropic-unitize"
          elif [[ "${STAGE}:${PROVIDER}" == "llm-review-stage-a:google" ]]; then
            environment_name="legalforecastbench-official-labeling-google-review"
          elif [[ "${STAGE}:${PROVIDER}" == "llm-label-provider-shard:openai" ]]; then
            environment_name="legalforecastbench-official-labeling-openai-label"
          elif [[ "${STAGE}:${PROVIDER}" == "llm-label-provider-shard:google" ]]; then
            environment_name="legalforecastbench-official-labeling-google-label"
          else
            echo "Stage/provider pair is outside the reviewed paid-labeling allowlist." >&2
            exit 1
          fi
          echo "environment_name=${environment_name}" >> "${GITHUB_OUTPUT}"

  run-provider-stage:
    name: Run ${{ inputs.stage }} / ${{ inputs.provider }}
    needs: authorize-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ needs.authorize-boundary.outputs.environment_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION || 'us-east-1' }}
      JOB_ROOT: ${{ github.workspace }}/.official-paid-labeling-job
      OUTPUT_ROOT: ${{ github.workspace }}/official-paid-labeling-output
      LFB_BATON_AGE_RECIPIENT: ${{ vars.LFB_BATON_AGE_RECIPIENT }}
      LFB_GITHUB_LABELING_ROLE_ARN: ${{ vars.LFB_GITHUB_LABELING_ROLE_ARN }}
      LFB_PROVIDER_ACCOUNT_ALIAS: ${{ vars.LFB_PROVIDER_ACCOUNT_ALIAS }}
      LFB_PROVIDER_AUTHORITY_TABLE: ${{ vars.LFB_PROVIDER_AUTHORITY_TABLE }}
    steps:
      - name: Checkout trusted release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Validate immutable release and protected values
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] || [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "paid labeling must be dispatched from the immutable main commit." >&2
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${GITHUB_SHA}" ]] || [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "release_sha must equal the exact main commit that triggered this workflow." >&2
            exit 1
          fi
          missing=""
          for name in \
            LFB_GITHUB_LABELING_ROLE_ARN \
            LFB_BATON_AGE_RECIPIENT \
            LFB_PROVIDER_ACCOUNT_ALIAS \
            LFB_PROVIDER_AUTHORITY_TABLE; do
            if [[ -z "${!name:-}" ]]; then
              printf -v missing '%s  - %s\n' "${missing}" "${name}"
            fi
          done
          if [[ -n "${missing}" ]]; then
            printf 'Missing protected paid-labeling values:\n%s' "${missing}" >&2
            exit 1
          fi
          if [[ ! "${LFB_GITHUB_LABELING_ROLE_ARN}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+ ]]; then
            echo "LFB_GITHUB_LABELING_ROLE_ARN must be an IAM role ARN." >&2
            exit 1
          fi
          if [[ ! "${LFB_BATON_AGE_RECIPIENT}" =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]; then
            echo "LFB_BATON_AGE_RECIPIENT must be one age X25519 recipient." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.job_artifact_run_id }}" =~ ^[1-9][0-9]*$ ]] || \
             [[ ! "${{ inputs.job_artifact_run_attempt }}" =~ ^[1-9][0-9]*$ ]] || \
             [[ ! "${{ inputs.job_artifact_name }}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || \
             [[ ! "${{ inputs.job_artifact_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [[ ! "${{ inputs.package_manifest_sha256 }}" =~ ^[0-9a-f]{64}$ ]] || \
             [[ ! "${{ inputs.job_manifest_sha256 }}" =~ ^[0-9a-f]{64}$ ]] || \
             [[ ! "${{ inputs.sequence_ordinal }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Encrypted baton identity inputs are malformed." >&2
            exit 1
          fi
          expected_artifact_name="official-paid-labeling-baton-${{ inputs.job_artifact_run_id }}-${{ inputs.job_artifact_run_attempt }}"
          if [[ "${{ inputs.job_artifact_name }}" != "${expected_artifact_name}" ]]; then
            echo "Encrypted baton artifact name is not bound to the exact run attempt." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.6
        with:
          enable-cache: true

      - name: Install pinned age
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lfb-age"
          curl --fail --silent --show-error --location \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz \
            --output "${RUNNER_TEMP}/lfb-age/age.tar.gz"
          printf '%s  %s\n' \
            bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377 \
            "${RUNNER_TEMP}/lfb-age/age.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/lfb-age/age.tar.gz" \
            --strip-components=1 --directory "${RUNNER_TEMP}/lfb-age" age/age
          chmod 0755 "${RUNNER_TEMP}/lfb-age/age"

      - name: Verify exact baton producer run and artifact
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.job_artifact_digest }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.job_artifact_name }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.job_artifact_run_attempt }}
          EXPECTED_RUN_ID: ${{ inputs.job_artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}/attempts/${EXPECTED_RUN_ATTEMPT}")"
          jq -e \
            --arg release_sha "${RELEASE_SHA}" \
            --argjson attempt "${EXPECTED_RUN_ATTEMPT}" \
            '.path == ".github/workflows/official-paid-labeling-baton.yaml" and
             .event == "workflow_dispatch" and .head_branch == "main" and
             .head_sha == $release_sha and .run_attempt == $attempt and
             .status == "completed" and .conclusion == "success"' \
            <<<"${run_json}" >/dev/null
          artifacts_json="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}/artifacts?per_page=100")"
          jq -s '{artifacts: map(.artifacts[]) }' <<<"${artifacts_json}" > "${RUNNER_TEMP}/lfb-baton-artifacts.json"
          jq -e \
            --arg name "${EXPECTED_ARTIFACT_NAME}" \
            --arg digest "${EXPECTED_ARTIFACT_DIGEST}" \
            '([.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length) == 1' \
            "${RUNNER_TEMP}/lfb-baton-artifacts.json" >/dev/null

      - name: Download encrypted paid-labeling baton
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.job_artifact_name }}
          path: ${{ runner.temp }}/lfb-encrypted-baton
          repository: ${{ github.repository }}
          run-id: ${{ inputs.job_artifact_run_id }}

      - name: Decrypt and verify closed paid-labeling baton
        id: open_baton
        shell: bash
        env:
          BATON_AGE_IDENTITY: ${{ secrets.BATON_AGE_IDENTITY }}
          EXPECTED_JOB_MANIFEST_SHA256: ${{ inputs.job_manifest_sha256 }}
          EXPECTED_PACKAGE_MANIFEST_SHA256: ${{ inputs.package_manifest_sha256 }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SEQUENCE_ORDINAL: ${{ inputs.sequence_ordinal }}
        run: |
          set -euo pipefail
          test -n "${BATON_AGE_IDENTITY:-}"
          umask 077
          printf '%s\n' "${BATON_AGE_IDENTITY}" > "${RUNNER_TEMP}/lfb-baton-identity.txt"
          uv run legalforecast acquisition open-paid-labeling-baton \
            --artifact-root "${RUNNER_TEMP}/lfb-encrypted-baton" \
            --expected-package-manifest-sha256 "${EXPECTED_PACKAGE_MANIFEST_SHA256}" \
            --expected-job-manifest-sha256 "${EXPECTED_JOB_MANIFEST_SHA256}" \
            --age-executable "${RUNNER_TEMP}/lfb-age/age" \
            --age-identity-file "${RUNNER_TEMP}/lfb-baton-identity.txt" \
            --release-sha "${RELEASE_SHA}" \
            --stage "${{ inputs.stage }}" \
            --provider "${{ inputs.provider }}" \
            --sequence-ordinal "${SEQUENCE_ORDINAL}" \
            --job-root "${JOB_ROOT}" \
            --execute

      - name: Clear baton decryption identity
        id: clear_identity
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${RUNNER_TEMP}/lfb-baton-identity.txt" ]]; then
            shred --force --iterations=1 --zero --remove "${RUNNER_TEMP}/lfb-baton-identity.txt"
          fi
          test ! -e "${RUNNER_TEMP}/lfb-baton-identity.txt"

      - name: Verify sealed job manifest commitment
        id: verify_job_manifest
        if: ${{ steps.open_baton.outcome == 'success' && steps.clear_identity.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.job_manifest_sha256 }}
        run: |
          set -euo pipefail
          manifest="${JOB_ROOT}/official-paid-labeling-job.json"
          if [[ ! "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]] || [[ ! -f "${manifest}" ]] || [[ -L "${manifest}" ]]; then
            echo "The sealed paid-labeling job manifest is missing or invalid." >&2
            exit 1
          fi
          printf '%s  %s\n' "${EXPECTED_SHA256}" "${manifest}" | sha256sum --check --strict

      - name: Validate sealed job before authority configuration
        id: validate_job
        if: ${{ steps.open_baton.outcome == 'success' && steps.clear_identity.outcome == 'success' && steps.verify_job_manifest.outcome == 'success' }}
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          uv run python -m legalforecast.labeling.official_paid_job \
            --job-manifest "${JOB_ROOT}/official-paid-labeling-job.json" \
            --job-root "${JOB_ROOT}" \
            --release-sha "${RELEASE_SHA}" \
            --stage "${STAGE}" \
            --provider "${PROVIDER}" \
            --expected-provider-account-alias "${LFB_PROVIDER_ACCOUNT_ALIAS}" \
            --validate-only

      - name: Configure exact-table labeling AWS authority
        id: configure_authority
        if: ${{ steps.validate_job.outcome == 'success' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
          role-session-name: lfb-label-${{ inputs.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ env.LFB_GITHUB_LABELING_ROLE_ARN }}

      - name: Run isolated paid-labeling stage
        id: run_provider_stage
        if: ${{ steps.configure_authority.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          LFB_PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          if [[ -z "${LFB_PROVIDER_API_KEY:-}" ]]; then
            echo "The protected environment lacks PROVIDER_API_KEY." >&2
            exit 1
          fi
          if [[ "${PROVIDER}" == "anthropic" ]]; then
            export ANTHROPIC_API_KEY="${LFB_PROVIDER_API_KEY}"
          elif [[ "${PROVIDER}" == "google" ]]; then
            export GEMINI_API_KEY="${LFB_PROVIDER_API_KEY}"
          elif [[ "${PROVIDER}" == "openai" ]]; then
            export OPENAI_API_KEY="${LFB_PROVIDER_API_KEY}"
          else
            echo "Provider is outside the reviewed allowlist." >&2
            exit 1
          fi
          uv run python -m legalforecast.labeling.official_paid_job \
            --job-manifest "${JOB_ROOT}/official-paid-labeling-job.json" \
            --job-root "${JOB_ROOT}" \
            --release-sha "${RELEASE_SHA}" \
            --stage "${STAGE}" \
            --provider "${PROVIDER}" \
            --provider-authority-table "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --provider-authority-region "${AWS_REGION}" \
            --expected-provider-account-alias "${LFB_PROVIDER_ACCOUNT_ALIAS}"

      - name: Clear temporary credentials
        id: clear_credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'AWS_ACCESS_KEY_ID='
            echo 'AWS_SECRET_ACCESS_KEY='
            echo 'AWS_SESSION_TOKEN='
            echo 'AWS_SECURITY_TOKEN='
          } >> "${GITHUB_ENV}"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN

      - name: Seal encrypted paid-labeling result
        id: seal_result
        if: ${{ always() && steps.open_baton.outcome == 'success' && steps.clear_identity.outcome == 'success' && steps.verify_job_manifest.outcome == 'success' && steps.validate_job.outcome == 'success' && steps.configure_authority.outcome == 'success' && steps.clear_credentials.outcome == 'success' }}
        shell: bash
        env:
          PROVIDER_STAGE_OUTCOME: ${{ steps.run_provider_stage.outcome }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SEQUENCE_ORDINAL: ${{ inputs.sequence_ordinal }}
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_ROOT}"
          uv run legalforecast acquisition seal-paid-labeling-result \
            --job-root "${JOB_ROOT}" \
            --input-package-manifest "${JOB_ROOT}/official-paid-labeling-package.json" \
            --expected-input-package-manifest-sha256 "${{ inputs.package_manifest_sha256 }}" \
            --release-sha "${RELEASE_SHA}" \
            --stage "${{ inputs.stage }}" \
            --provider "${{ inputs.provider }}" \
            --sequence-ordinal "${SEQUENCE_ORDINAL}" \
            --provider-stage-outcome "${PROVIDER_STAGE_OUTCOME}" \
            --age-executable "${RUNNER_TEMP}/lfb-age/age" \
            --age-recipient "${LFB_BATON_AGE_RECIPIENT}" \
            --output-ciphertext "${OUTPUT_ROOT}/official-paid-labeling-result.age" \
            --receipt-output "${OUTPUT_ROOT}/result-receipt.json" \
            --execute

      - name: Clear plaintext paid-labeling state
        id: clear_plaintext
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "${JOB_ROOT}" ]]; then
            find "${JOB_ROOT}" -type f -exec shred --force --iterations=1 --zero --remove {} +
            find "${JOB_ROOT}" -depth -type d -empty -delete
          fi
          test ! -e "${JOB_ROOT}"

      - name: Upload encrypted paid-labeling result
        if: ${{ always() && steps.seal_result.outcome == 'success' && steps.clear_plaintext.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: official-paid-labeling-${{ inputs.stage }}-${{ inputs.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}/official-paid-labeling-result.age
            ${{ env.OUTPUT_ROOT }}/result-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7
