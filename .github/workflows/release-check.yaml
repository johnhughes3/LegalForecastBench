name: Release Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Release check
    # Unset CI_RUNNER (Dependabot and public johnhughes3 repos cannot see the
    # private org variable) must fall back to ubicloud-standard-2, not ubuntu-latest.
    runs-on: ${{ (vars.CI_RUNNER == 'ubuntu-latest' || startsWith(vars.CI_RUNNER, 'ubicloud-')) && vars.CI_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run release checks
        run: uv run scripts/release_check.py --output-dir tmp/release-check

      - name: Upload release-check artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-check
          path: tmp/release-check
          if-no-files-found: warn
