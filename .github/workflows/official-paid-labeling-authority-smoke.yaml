name: Official paid-labeling authority smoke

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full trusted commit SHA on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-exact-table-authority:
    name: Provider-free exact-table authority smoke
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: legalforecastbench-official-labeling-authority-smoke
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.LFB_AWS_REGION }}
      EVIDENCE_ROOT: ${{ github.workspace }}/.official-labeling-smoke-evidence
      LFB_GITHUB_LABELING_ROLE_ARN: ${{ vars.LFB_GITHUB_LABELING_ROLE_ARN }}
      LFB_OUTSIDE_AUTHORITY_TABLE: ${{ vars.LFB_OUTSIDE_AUTHORITY_TABLE }}
      LFB_PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256: ${{ vars.LFB_PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256 }}
      LFB_PROVIDER_AUTHORITY_TABLE: ${{ vars.LFB_PROVIDER_AUTHORITY_TABLE }}
    steps:
      - name: Checkout trusted release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Validate immutable release and protected values
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] || [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "authority smoke must be dispatched from the immutable main commit." >&2
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${GITHUB_SHA}" ]] || [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "release_sha must equal the exact main commit that triggered this workflow." >&2
            exit 1
          fi
          missing=()
          for name in \
            AWS_REGION \
            LFB_GITHUB_LABELING_ROLE_ARN \
            LFB_OUTSIDE_AUTHORITY_TABLE \
            LFB_PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256 \
            LFB_PROVIDER_AUTHORITY_TABLE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing protected authority-smoke values:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          if [[ ! "${LFB_PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The frozen provider authority identity must be lowercase SHA-256." >&2
            exit 1
          fi
          if [[ "${LFB_OUTSIDE_AUTHORITY_TABLE}" == "${LFB_PROVIDER_AUTHORITY_TABLE}" ]]; then
            echo "The outside-table denial target must be distinct." >&2
            exit 1
          fi

      - name: Configure exact-table labeling AWS authority
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lfb-label-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ env.LFB_GITHUB_LABELING_ROLE_ARN }}

      - name: Exercise allowed actions and required denials
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}"
          chmod 0700 "${EVIDENCE_ROOT}"
          denial_error="$(mktemp)"
          trap 'rm -f "${denial_error}"' EXIT
          table_json="$(aws dynamodb describe-table \
            --table-name "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --output json)"
          table_arn="$(jq -er '.Table.TableArn' <<<"${table_json}")"
          actual_identity="$(printf '%s' "${table_arn}" | sha256sum | cut -d' ' -f1)"
          unset table_json table_arn
          if [[ "${actual_identity}" != "${LFB_PROVIDER_AUTHORITY_RESOURCE_IDENTITY_SHA256}" ]]; then
            echo "Exact authority table differs from the frozen identity." >&2
            exit 1
          fi
          ttl_json="$(aws dynamodb describe-time-to-live \
            --table-name "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --output json)"
          ttl_status="$(jq -er '.TimeToLiveDescription.TimeToLiveStatus' <<<"${ttl_json}")"
          ttl_attribute="$(jq -er '.TimeToLiveDescription.AttributeName' <<<"${ttl_json}")"
          unset ttl_json
          if [[ "${ttl_status}" != "ENABLED" ]] || [[ "${ttl_attribute}" != "expires_at" ]]; then
            echo "Exact authority table must have TTL enabled on expires_at." >&2
            exit 1
          fi
          unset ttl_status ttl_attribute
          nonce="$(printf '%s:%s:%s' "${RELEASE_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" | sha256sum | cut -c1-32)"
          expires_at="$(( $(date +%s) + 86400 ))"
          key="{\"authority_key\":{\"S\":\"smoke-${nonce}\"},\"record_key\":{\"S\":\"get-put-update\"}}"
          item="{\"authority_key\":{\"S\":\"smoke-${nonce}\"},\"record_key\":{\"S\":\"get-put-update\"},\"smoke_state\":{\"S\":\"put\"},\"expires_at\":{\"N\":\"${expires_at}\"}}"
          aws dynamodb get-item \
            --table-name "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --key "${key}" \
            --consistent-read >/dev/null
          aws dynamodb put-item \
            --table-name "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --item "${item}" \
            --condition-expression "attribute_not_exists(authority_key)" >/dev/null
          aws dynamodb update-item \
            --table-name "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --key "${key}" \
            --update-expression "SET smoke_state = :updated" \
            --condition-expression "smoke_state = :put" \
            --expression-attribute-values '{":updated":{"S":"updated"},":put":{"S":"put"}}' >/dev/null
          transaction="$(jq -cn \
            --arg table "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --arg authority "smoke-${nonce}" \
            --arg expires "${expires_at}" \
            '{TransactItems:[
              {ConditionCheck:{
                TableName:$table,
                Key:{authority_key:{S:$authority},record_key:{S:"get-put-update"}},
                ConditionExpression:"smoke_state = :updated",
                ExpressionAttributeValues:{":updated":{S:"updated"}}
              }},
              {Put:{
                TableName:$table,
                Item:{authority_key:{S:$authority},record_key:{S:"transact"},smoke_state:{S:"transacted"},expires_at:{N:$expires}},
                ConditionExpression:"attribute_not_exists(authority_key)"
              }}
            ]}')"
          aws dynamodb transact-write-items --cli-input-json "${transaction}" >/dev/null
          unset key item transaction

          deny() {
            if "$@" >"${denial_error}" 2>&1; then
              echo "A required IAM denial unexpectedly succeeded." >&2
              return 1
            fi
            if ! grep -Eqi 'AccessDenied|not authorized' "${denial_error}"; then
              echo "A required denial failed for a reason other than IAM authorization." >&2
              return 1
            fi
            : > "${denial_error}"
          }
          deny aws dynamodb scan \
            --table-name "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --limit 1
          deny aws dynamodb delete-item \
            --table-name "${LFB_PROVIDER_AUTHORITY_TABLE}" \
            --key "{\"authority_key\":{\"S\":\"smoke-${nonce}\"},\"record_key\":{\"S\":\"get-put-update\"}}"
          deny aws dynamodb describe-table \
            --table-name "${LFB_OUTSIDE_AUTHORITY_TABLE}"
          outside_key="{\"authority_key\":{\"S\":\"outside-smoke-${nonce}\"},\"record_key\":{\"S\":\"get-put\"}}"
          outside_item="{\"authority_key\":{\"S\":\"outside-smoke-${nonce}\"},\"record_key\":{\"S\":\"get-put\"},\"smoke_state\":{\"S\":\"put\"},\"expires_at\":{\"N\":\"${expires_at}\"}}"
          deny aws dynamodb get-item \
            --table-name "${LFB_OUTSIDE_AUTHORITY_TABLE}" \
            --key "${outside_key}" \
            --consistent-read
          deny aws dynamodb put-item \
            --table-name "${LFB_OUTSIDE_AUTHORITY_TABLE}" \
            --item "${outside_item}" \
            --condition-expression "attribute_not_exists(authority_key)"
          deny aws dynamodb update-item \
            --table-name "${LFB_OUTSIDE_AUTHORITY_TABLE}" \
            --key "{\"authority_key\":{\"S\":\"outside-smoke-${nonce}\"},\"record_key\":{\"S\":\"update\"}}" \
            --update-expression "SET smoke_state = :updated, expires_at = :expires" \
            --expression-attribute-values "{\":updated\":{\"S\":\"updated\"},\":expires\":{\"N\":\"${expires_at}\"}}"
          outside_transaction="$(jq -cn \
            --arg table "${LFB_OUTSIDE_AUTHORITY_TABLE}" \
            --arg authority "outside-smoke-${nonce}" \
            --arg expires "${expires_at}" \
            '{TransactItems:[{Put:{
              TableName:$table,
              Item:{authority_key:{S:$authority},record_key:{S:"transact"},smoke_state:{S:"transacted"},expires_at:{N:$expires}},
              ConditionExpression:"attribute_not_exists(authority_key)"
            }}]}')"
          deny aws dynamodb transact-write-items \
            --cli-input-json "${outside_transaction}"
          unset outside_key outside_item outside_transaction
          deny aws dynamodb list-tables --limit 1

          jq -n \
            --arg release_sha "${RELEASE_SHA}" \
            --arg resource_identity_sha256 "${actual_identity}" \
            '{
              schema_version:"legalforecast.official_labeling_authority_smoke.v1",
              release_sha:$release_sha,
              authority_resource_identity_sha256:$resource_identity_sha256,
              provider_call_made:false,
              allowed:{
                describe_table:true,
                describe_time_to_live:true,
                get_item:true,
                put_item:true,
                update_item:true,
                condition_check_item:true,
                transact_write_items:true
              },
              denied:{
                scan:true,
                delete_item:true,
                outside_table_describe:true,
                outside_table_get_item:true,
                outside_table_put_item:true,
                outside_table_update_item:true,
                outside_table_transact_write_items:true,
                list_tables:true
              }
            }' > "${EVIDENCE_ROOT}/authority-smoke.json"

      - name: Clear temporary AWS credentials
        id: clear_credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'AWS_ACCESS_KEY_ID='
            echo 'AWS_SECRET_ACCESS_KEY='
            echo 'AWS_SESSION_TOKEN='
            echo 'AWS_SECURITY_TOKEN='
          } >> "${GITHUB_ENV}"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN

      - name: Upload redacted smoke evidence
        if: ${{ always() && steps.clear_credentials.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: official-paid-labeling-authority-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/authority-smoke.json
          if-no-files-found: error
          retention-days: 14
