version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    ignore:
      # These SDK versions are part of characterized provider contracts. A
      # version change requires an explicit characterization PR rather than a
      # routine dependency update.
      - dependency-name: anthropic
      - dependency-name: claude-agent-sdk
      - dependency-name: openai
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
