version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    ignore:
      # These SDK versions are part of characterized provider contracts. A
      # version change requires an explicit characterization PR rather than a
      # routine dependency update.
      - dependency-name: anthropic
      - dependency-name: claude-agent-sdk
      - dependency-name: openai
      # pypdf renders the disclosure marker-page prompt whose sha256 is part of
      # the provider-attempt identity a replay must reproduce, so a version
      # change retroactively invalidates settled Cycle 1 evidence. #1022's
      # routine bump did exactly that. Unpinning is a deliberate decision, not a
      # routine update: unpin after Cycle 1 closes or when renderer versioning
      # lands. Pinned in pyproject.toml and fenced by
      # tests/test_pdf_extractor_pin.py.
      - dependency-name: pypdf
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
