version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  # uv.lock is the resolver input. GitHub opens uv-ecosystem PRs for it
  # (#1037, #1053, #1126) even when only pip is configured, and pip ignore
  # rules do not bind those PRs. Configure uv directly; do not also configure
  # pip, or version updates duplicate across two Python ecosystems.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    ignore:
      # These SDK versions are part of characterized provider contracts. A
      # version change requires an explicit characterization PR rather than a
      # routine dependency update.
      - dependency-name: anthropic
      - dependency-name: claude-agent-sdk
      - dependency-name: openai
      # PDF extraction affects model-visible text. Review extractor upgrades
      # explicitly rather than merging them as routine dependency updates.
      - dependency-name: pypdf
    groups:
      uv-minor-patch:
        update-types:
          - minor
          - patch
