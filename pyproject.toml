[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "legalforecast-mtd"
version = "0.1.0a3"
description = "Alpha-release tooling for the LegalForecast-MTD public benchmark."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "John Hughes" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cryptography>=50.0.1",
    "ortools>=9.15.6755",
    "pydantic>=2.13.5,<3",
    "pypdf>=6.16.2",
]

[project.scripts]
legalforecast = "legalforecast.cli:main"
legalforecast-acquisition-systemd-run = "legalforecast.ingestion.infisical_systemd_launcher:main"
legalforecast-exact100-convergence = "legalforecast.ingestion.exact100_convergence_invariants_cli:main"
legalforecast-exact100-successor-v3 = "legalforecast.ingestion.exact100_successor_v3.cli:main"

[project.optional-dependencies]
claude-agent-sdk-adapter = [
    "claude-agent-sdk==0.2.143",
]
tier0-judge-adapter = [
    "anthropic==1.0.0",
]

[dependency-groups]
dev = [
  "interrogate>=1.7.0",
  "openai==3.3.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8",
  "reportlab>=5.0.1",
  "ruff>=0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["legalforecast"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
log_level = "INFO"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["legalforecast", "tests"]
# Deliberately one release behind `requires-python`, and settled rather than
# pending: at py314 the formatter adopts PEP 758 unparenthesized
# `except A, B:`, which rewrites 34 files and makes the source unparseable by
# any Python before 3.14.  That form is also visually identical to Python 2's
# `except A, B:` bind syntax, so it reads as a bug.  Decided in
# LegalForecastBench-xf1t: stay at py313.  Raise this only as its own reviewed
# change, never as a side effect of a runtime bump.
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.pyright]
include = ["legalforecast", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.interrogate]
# CI supplies the intentionally scoped publication and release paths.
fail-under = 48
ignore-nested-classes = true
ignore-nested-functions = true
ignore-private = true
ignore-semiprivate = true
style = "google"
verbose = 1
